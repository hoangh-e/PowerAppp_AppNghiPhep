Screens:
  ProfileScreen:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      OnVisible: |
        =Set(varActiveScreen, "Profile");
        Set(varNetworkError, false);
        Set(varDataLoading, true);
        
        //Check user permissions using CheckPermission function from App/Formulas
        Set(varUserPermissions, {
          CanViewPersonalLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.PERSONAL_LEAVE),
          CanCreatePersonalLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.PERSONAL_LEAVE),
          CanViewDashboard: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_DASHBOARD),
          CanManageUsers: CheckPermission(UserSessionANP.Permission, UserPermissions.MANAGE_USERS),
          CanViewTeamLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_TEAM_LEAVE),
          CanViewAllLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_ALL_LEAVE),
          CanExportReports: CheckPermission(UserSessionANP.Permission, UserPermissions.EXPORT_REPORTS)
        });
        
        //NOTE: ProfileScreen is accessible to all authenticated users
        //Only need to ensure user is logged in (checked at App level)
        
        Set(varIsEditing, false);
        Set(varEditedName, UserSessionANP.HoTen);
        Set(varEditedEmail, UserSessionANP.Email);
        Set(varEditedPhone, "");
        Set(varIsSaving, false);
        
        //Load SharePoint data with authentication check
        If(And(varIsUserAuthenticated, Not(IsBlank(UserSessionANP.Id))),
          //Load current user data from SharePoint NguoiDung
          Set(varCurrentUser, LookUp(NguoiDung, Title = UserSessionANP.Id));
          
          //Load user leave balance from SharePoint SoNgayPhep - CORRECTED field name
          Set(varUserLeaveBalance, LookUp(SoNgayPhep, And(MaNhanVien.Value = UserSessionANP.Id, Nam = Year(Today()))));
          
          //Load user leave history from SharePoint DonNghiPhep
          ClearCollect(colUserLeaveHistory, 
            Sort(
              Filter(DonNghiPhep, MaNguoiDung.Value = UserSessionANP.Id),
              NgayBatDau, 
              SortOrder.Descending
            )
          );
          
          //Load user department info from SharePoint DonVi - with null check
          If(Not(IsBlank(varCurrentUser)) And Not(IsBlank(varCurrentUser.MaDonVi.Value)),
            Set(varUserDepartment, LookUp(DonVi, Title = varCurrentUser.MaDonVi.Value)),
            Set(varUserDepartment, Blank())
          );
          
          //Load user manager info from SharePoint NguoiDung - with null check
          If(Not(IsBlank(varCurrentUser)) And Not(IsBlank(varCurrentUser.MaQuanLy.Value)),
            Set(varUserManager, LookUp(NguoiDung, Title = varCurrentUser.MaQuanLy.Value)),
            Set(varUserManager, Blank())
          );
          
          Set(varNetworkError, false),
          //No authentication - use demo data for preview
          Set(varNetworkError, true);
          
          //Demo user data for preview - with correct SharePoint structure
          Set(varCurrentUser, {
            Title: "EMP001",
            HoTen: "Nguyễn Văn An",
            Email: "nguyenvana@company.com",
            SoDienThoai: "0912345678",
            ChucDanh: {Value: "Nhân viên"},
            MaDonVi: {Value: "IT"},
            MaVaiTro: {Value: "Employee"},
            NgayVaoLam: Date(2023, 1, 15),
            NgaySinh: Date(1990, 5, 20),
            GioiTinh: {Value: "Nam"},
            DiaChi: "123 Đường ABC, Quận 1, TP.HCM",
            TrangThai: {Value: "HoatDong"},
            MaQuanLy: {Value: "MGR001"}
          });
          
          //Demo leave balance with correct structure
          Set(varUserLeaveBalance, {
            MaNhanVien: {Value: "EMP001"},
            Nam: Year(Today()),
            TongNgayDuocPhep: 12,
            SoNgayDaNghi: 3,
            SoNgayConLai: 9,
            SoNgayKhongLuong: 0
          });
          
          //Demo leave history with correct SharePoint structure
          ClearCollect(colUserLeaveHistory,
            Table(
              {MaDon: "LR001", NgayBatDau: Date(2024,11,15), NgayKetThuc: Date(2024,11,15), SoNgayNghi: 1, LyDo: "Nghỉ ốm", TrangThai: {Value: "DaDuyet"}, MaLoai: {Value: "SICK"}, BuoiNghi: {Value: "CaNgay"}, MaNguoiDung: {Value: "EMP001"}},
              {MaDon: "LR002", NgayBatDau: Date(2024,10,10), NgayKetThuc: Date(2024,10,12), SoNgayNghi: 3, LyDo: "Nghỉ phép năm", TrangThai: {Value: "DaDuyet"}, MaLoai: {Value: "ANNUAL"}, BuoiNghi: {Value: "CaNgay"}, MaNguoiDung: {Value: "EMP001"}},
              {MaDon: "LR003", NgayBatDau: Date(2024,9,5), NgayKetThuc: Date(2024,9,5), SoNgayNghi: 1, LyDo: "Việc gia đình", TrangThai: {Value: "ChoDuyetCap1"}, MaLoai: {Value: "PERSONAL"}, BuoiNghi: {Value: "Sang"}, MaNguoiDung: {Value: "EMP001"}}
            )
          );
          
          //Demo department data
          Set(varUserDepartment, {
            Title: "IT",
            TenDonVi: "Phòng Công nghệ thông tin",
            MaDonVi: "IT"
          });
          
          //Demo manager data
          Set(varUserManager, {
            Title: "MGR001",
            HoTen: "Trần Thị Bình",
            Email: "tranbi@company.com",
            ChucDanh: {Value: "Trưởng phòng"}
          })
        );
        
        Set(varDataLoading, false);
        Set(varSelectedTab, "Info");
        
        //Start authentication check
        Set(varAuthTimerStart, true)
    Children:
      # Authentication Check Timer
      - 'Profile.AuthTimer':
          Control: Timer
          Properties:
            X: =0
            Y: =0
            Width: =1
            Height: =1
            Duration: =100
            AutoStart: =varAuthTimerStart
            Visible: =false
            OnTimerEnd: |
              =Set(varAuthTimerStart, false);
              If(Not(varIsUserAuthenticated),
                Navigate(LoginScreen),
                Set(varAuthenticationValid, true)
              )
              
      # Header Component
      - 'Profile.Header':
          Control: CanvasComponent
          ComponentName: HeaderComponent
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height * 0.065
            UserName: =UserSessionANP.HoTen
            UserRole: =UserSessionANP.MaVaiTro
            ShowNotification: =true
            NotificationCount: =0
            OnLogout: |
              =Set(varIsUserAuthenticated, false);
              Set(UserSessionANP, {
                Id: "",
                HoTen: "",
                Email: "",
                MaVaiTro: "",
                Permission: 0,
                NguoiQuanLyId: "",
                ChucDanh: "",
                MaDonVi: "",
                TrangThai: "",
                Name: "",
                Role: ""
              });
              Navigate(LoginScreen)
            
      # Navigation Component
      - 'Profile.Navigation':
          Control: CanvasComponent
          ComponentName: NavigationComponent
          Properties:
            X: =0
            Y: ='Profile.Header'.Height
            Width: =If(varNavCollapsed, App.Width * 0.045, App.Width * 0.14)
            Height: =Parent.Height - 'Profile.Header'.Height
            UserRole: =UserSessionANP.MaVaiTro
            ActiveScreen: ="Profile"
            IsCollapsed: =varNavCollapsed
            DashboardScreen: =DashboardScreen
            LeaveRequestScreen: =LeaveRequestScreen
            MyLeavesScreen: =MyLeavesScreen
            CalendarScreen: =CalendarScreen
            ManagementScreen: =ManagementScreen
            ReportsScreen: =ReportsScreen
            ProfileScreen: =ProfileScreen
            ApprovalScreen: =ApprovalScreen
            OnNavigate: |
              =Set(varActiveScreen, ScreenName);
              Switch(ScreenName,
                "Dashboard", Navigate(DashboardScreen),
                "LeaveRequest", Navigate(LeaveRequestScreen),
                "MyLeaves", Navigate(MyLeavesScreen),
                "Calendar", Navigate(CalendarScreen),
                "Management", Navigate(ManagementScreen),
                "Profile", Navigate(ProfileScreen),
                "Approval", Navigate(ApprovalScreen),
                "Reports", Navigate(ReportsScreen)
              )
            OnToggleCollapse: |
              =Set(varNavCollapsed, !varNavCollapsed)
            
      # Main Content Container
      - 'Profile.Content.Container':
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: ='Profile.Navigation'.Width
            Y: ='Profile.Header'.Height
            Width: =Parent.Width - 'Profile.Navigation'.Width
            Height: =Parent.Height - 'Profile.Header'.Height
          Children:
            - 'Profile.Content.Padded':
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.01
                  Y: =Parent.Height * 0.01
                  Width: =Parent.Width * 0.98
                  Height: =Parent.Height * 0.98
                Children:
                  # Page Header
                  - 'Profile.PageHeader.Container':
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.Width
                        Height: =Parent.Height * 0.1
                      Children:
                        - 'Profile.PageHeader.Background':
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.Width
                              Height: =Parent.Height
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              
                        - 'Profile.PageHeader.Icon':
                            Control: Classic/Icon
                            Properties:
                              X: =Parent.Width * 0.015
                              Y: =Parent.Height * 0.25
                              Width: =Parent.Height * 0.2
                              Height: =Parent.Height * 0.2
                              Icon: =Icon.Person
                              Color: =RGBA(59, 130, 246, 1)
                              
                        - 'Profile.PageHeader.Title':
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015 + 'Profile.PageHeader.Icon'.Width + Parent.Width * 0.01
                              Y: =Parent.Height * 0.2
                              Width: =Parent.Width * 0.6
                              Height: =Parent.Height * 0.35
                              Text: ="Thông tin cá nhân"
                              Color: =RGBA(17, 24, 39, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =FontSizes.Medium
                                    
                        - 'Profile.PageHeader.Stats':
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015 + 'Profile.PageHeader.Icon'.Width + Parent.Width * 0.01
                              Y: =Parent.Height * 0.6
                              Width: =Parent.Width * 0.6
                              Height: =Parent.Height * 0.25
                              Text: =Concatenate("Nhân viên", ":", " ", UserSessionANP.HoTen, " | ", UserSessionANP.MaVaiTro)
                              Color: =RGBA(75, 85, 99, 1)
                              Font: =Font.'Open Sans'
                              Size: =FontSizes.Small
                                
                  # Tab Navigation
                  - 'Profile.Tabs.Container':
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: ='Profile.PageHeader.Container'.Y + 'Profile.PageHeader.Container'.Height + Parent.Height * 0.015
                        Width: =Parent.Width
                        Height: =Parent.Height * 0.08
                      Children:
                        - 'Profile.Tabs.Background':
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.Width
                              Height: =Parent.Height
                              Fill: =RGBA(249, 250, 251, 1)
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              
                        - 'Profile.Tabs.Info':
                            Control: CanvasComponent
                            ComponentName: ButtonComponent
                            Properties:
                              X: =Parent.Width * 0.02
                              Y: =(Parent.Height - Self.Height) / 2
                              Width: =Parent.Width * 0.15
                              Height: =Parent.Height * 0.7
                              Text: ="Thông tin"
                              Size: ="Small"
                              OnClick: |
                                =Set(varSelectedTab, "Info")
                              
                        - 'Profile.Tabs.LeaveBalance':
                            Control: CanvasComponent
                            ComponentName: ButtonComponent
                            Properties:
                              X: =Parent.Width * 0.18
                              Y: =(Parent.Height - Self.Height) / 2
                              Width: =Parent.Width * 0.15
                              Height: =Parent.Height * 0.7
                              Text: ="Số ngày phép"
                              Size: ="Small"
                              OnClick: |
                                =Set(varSelectedTab, "LeaveBalance")
                              
                        - 'Profile.Tabs.History':
                            Control: CanvasComponent
                            ComponentName: ButtonComponent
                            Properties:
                              X: =Parent.Width * 0.34
                              Y: =(Parent.Height - Self.Height) / 2
                              Width: =Parent.Width * 0.15
                              Height: =Parent.Height * 0.7
                              Text: ="Lịch sử nghỉ phép"
                              Size: ="Small"
                              OnClick: |
                                =Set(varSelectedTab, "History")
                              
                  # Content Area
                  - 'Profile.Content.Area':
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: ='Profile.Tabs.Container'.Y + 'Profile.Tabs.Container'.Height + Parent.Height * 0.015
                        Width: =Parent.Width
                        Height: =Parent.Height * 0.77
                      Children:
                        # Personal Info Tab
                        - 'Profile.Info.Container':
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.Width
                              Height: =Parent.Height
                              Visible: =varSelectedTab = "Info"
                            Children:
                              - 'Profile.Info.Background':
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    Fill: =RGBA(255, 255, 255, 1)
                                    BorderColor: =RGBA(226, 232, 240, 1)
                                    BorderThickness: =1
                                    
                              # Avatar Section
                              - 'Profile.Info.Avatar.Container':
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    X: =Parent.Width * 0.03
                                    Y: =Parent.Height * 0.03
                                    Width: =Parent.Width * 0.94
                                    Height: =Parent.Height * 0.2
                                  Children:
                                    - 'Profile.Info.Avatar.Icon':
                                        Control: Classic/Icon
                                        Properties:
                                          X: =Parent.Width * 0.02
                                          Y: =(Parent.Height - Self.Height) / 2
                                          Width: =Parent.Height * 0.8
                                          Height: =Parent.Height * 0.8
                                          Icon: =Icon.Person
                                          Color: =RGBA(59, 130, 246, 1)
                                          Fill: =RGBA(219, 234, 254, 1)
                                          BorderColor: =RGBA(147, 197, 253, 1)
                                          BorderThickness: =2
                                          
                                    - 'Profile.Info.Avatar.Name':
                                        Control: Label
                                        Properties:
                                          X: =Parent.Height 
                                          Y: =Parent.Height * 0.1
                                          Width: =Parent.Width * 0.6
                                          Height: =Parent.Height * 0.4
                                          Text: =If(Not(IsBlank(varCurrentUser)), varCurrentUser.HoTen, UserSessionANP.HoTen)
                                          Color: =RGBA(17, 24, 39, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =FontSizes.XLarge
                                          
                                    - 'Profile.Info.Avatar.Role':
                                        Control: Label
                                        Properties:
                                          X: =Parent.Height
                                          Y: =Parent.Height * 0.55
                                          Width: =Parent.Width * 0.6
                                          Height: =Parent.Height * 0.35
                                          Text: =If(Not(IsBlank(varCurrentUser)), 
                                            varCurrentUser.ChucDanh.Value & " - " & 
                                            If(Not(IsBlank(varUserDepartment)), varUserDepartment.TenDonVi, ""), 
                                            UserSessionANP.ChucDanh)
                                          Color: =RGBA(75, 85, 99, 1)
                                          Font: =Font.'Open Sans'
                                          Size: =FontSizes.Medium
                                          
                                    - 'Profile.Info.EditButton':
                                        Control: CanvasComponent
                                        ComponentName: ButtonComponent
                                        Properties:
                                          X: =Parent.Width * 0.8
                                          Y: =(Parent.Height - Self.Height) / 2
                                          Width: =Parent.Width * 0.17
                                          Height: =Parent.Height * 0.5
                                          Text: =If(varIsEditing, "Hủy", "Chỉnh sửa")
                                          Size: ="Small"
                                          OnClick: |
                                            =If(varIsEditing,
                                              Set(varIsEditing, false);
                                              Set(varEditedName, If(Not(IsBlank(varCurrentUser)), varCurrentUser.HoTen, UserSessionANP.HoTen));
                                              Set(varEditedEmail, If(Not(IsBlank(varCurrentUser)), varCurrentUser.Email, UserSessionANP.Email)),
                                              Set(varIsEditing, true)
                                            )

                              # Info Form
                              - 'Profile.Info.Form.Container':
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    X: =Parent.Width * 0.03
                                    Y: =Parent.Height * 0.25
                                    Width: =Parent.Width * 0.94
                                    Height: =Parent.Height * 0.7
                                  Children:
                                    # Employee ID
                                    - 'Profile.Info.ID.Label':
                                        Control: Label
                                        Properties:
                                          X: =0
                                          Y: =0
                                          Width: =Parent.Width * 0.3
                                          Height: =Parent.Height * 0.08
                                          Text: ="Mã nhân viên:"
                                          Color: =RGBA(55, 65, 81, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =FontSizes.Base
                                          
                                    - 'Profile.Info.ID.Value':
                                        Control: Label
                                        Properties:
                                          X: =Parent.Width * 0.32
                                          Y: =0
                                          Width: =Parent.Width * 0.68
                                          Height: =Parent.Height * 0.08
                                          Text: =UserSessionANP.Id
                                          Color: =RGBA(17, 24, 39, 1)
                                          Font: =Font.'Open Sans'
                                          Size: =FontSizes.Base

                                    # Full Name
                                    - 'Profile.Info.Name.Label':
                                        Control: Label
                                        Properties:
                                          X: =0
                                          Y: =Parent.Height * 0.12
                                          Width: =Parent.Width * 0.3
                                          Height: =Parent.Height * 0.08
                                          Text: ="Họ và tên:"
                                          Color: =RGBA(55, 65, 81, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =FontSizes.Base
                                          
                                    - 'Profile.Info.Name.Input':
                                        Control: Classic/TextInput
                                        Properties:
                                          X: =Parent.Width * 0.32
                                          Y: =Parent.Height * 0.12
                                          Width: =Parent.Width * 0.68
                                          Height: =Parent.Height * 0.08
                                          Default: =varEditedName
                                          DisplayMode: =If(varIsEditing, DisplayMode.Edit, DisplayMode.View)
                                          Color: =RGBA(55, 65, 81, 1)
                                          Fill: =If(varIsEditing, RGBA(255, 255, 255, 1), RGBA(249, 250, 251, 1))
                                          BorderColor: =If(varIsEditing, RGBA(59, 130, 246, 1), RGBA(226, 232, 240, 1))
                                          BorderThickness: =1
                                          Font: =Font.'Open Sans'
                                          Size: =FontSizes.Base
                                          OnChange: |
                                            =Set(varEditedName, Self.Default)

                                    # Email
                                    - 'Profile.Info.Email.Label':
                                        Control: Label
                                        Properties:
                                          X: =0
                                          Y: =Parent.Height * 0.24
                                          Width: =Parent.Width * 0.3
                                          Height: =Parent.Height * 0.08
                                          Text: ="Email:"
                                          Color: =RGBA(55, 65, 81, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =FontSizes.Base
                                          
                                    - 'Profile.Info.Email.Input':
                                        Control: Classic/TextInput
                                        Properties:
                                          X: =Parent.Width * 0.32
                                          Y: =Parent.Height * 0.24
                                          Width: =Parent.Width * 0.68
                                          Height: =Parent.Height * 0.08
                                          Default: =varEditedEmail
                                          DisplayMode: =If(varIsEditing, DisplayMode.Edit, DisplayMode.View)
                                          Color: =RGBA(55, 65, 81, 1)
                                          Fill: =If(varIsEditing, RGBA(255, 255, 255, 1), RGBA(249, 250, 251, 1))
                                          BorderColor: =If(varIsEditing, RGBA(59, 130, 246, 1), RGBA(226, 232, 240, 1))
                                          BorderThickness: =1
                                          Font: =Font.'Open Sans'
                                          Size: =FontSizes.Base
                                          OnChange: |
                                            =Set(varEditedEmail, Self.Default)

                                    # Phone
                                    - 'Profile.Info.Phone.Label':
                                        Control: Label
                                        Properties:
                                          X: =0
                                          Y: =Parent.Height * 0.36
                                          Width: =Parent.Width * 0.3
                                          Height: =Parent.Height * 0.08
                                          Text: ="Số điện thoại:"
                                          Color: =RGBA(55, 65, 81, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =FontSizes.Base
                                          
                                    - 'Profile.Info.Phone.Input':
                                        Control: Classic/TextInput
                                        Properties:
                                          X: =Parent.Width * 0.32
                                          Y: =Parent.Height * 0.36
                                          Width: =Parent.Width * 0.68
                                          Height: =Parent.Height * 0.08
                                          Default: =If(Not(IsBlank(varCurrentUser.SoDienThoai)), varCurrentUser.SoDienThoai, "")
                                          DisplayMode: =If(varIsEditing, DisplayMode.Edit, DisplayMode.View)
                                          Color: =RGBA(55, 65, 81, 1)
                                          Fill: =If(varIsEditing, RGBA(255, 255, 255, 1), RGBA(249, 250, 251, 1))
                                          BorderColor: =If(varIsEditing, RGBA(59, 130, 246, 1), RGBA(226, 232, 240, 1))
                                          BorderThickness: =1
                                          Font: =Font.'Open Sans'
                                          Size: =FontSizes.Base
                                          OnChange: |
                                            =Set(varEditedPhone, Self.Default)

                                    # Department
                                    - 'Profile.Info.Department.Label':
                                        Control: Label
                                        Properties:
                                          X: =0
                                          Y: =Parent.Height * 0.48
                                          Width: =Parent.Width * 0.3
                                          Height: =Parent.Height * 0.08
                                          Text: ="Phòng ban:"
                                          Color: =RGBA(55, 65, 81, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =FontSizes.Base
                                          
                                    - 'Profile.Info.Department.Value':
                                        Control: Label
                                        Properties:
                                          X: =Parent.Width * 0.32
                                          Y: =Parent.Height * 0.48
                                          Width: =Parent.Width * 0.68
                                          Height: =Parent.Height * 0.08
                                          Text: =If(Not(IsBlank(varUserDepartment)), varUserDepartment.TenDonVi, "")
                                          Color: =RGBA(17, 24, 39, 1)
                                          Font: =Font.'Open Sans'
                                          Size: =FontSizes.Base

                                    # Position
                                    - 'Profile.Info.Position.Label':
                                        Control: Label
                                        Properties:
                                          X: =0
                                          Y: =Parent.Height * 0.6
                                          Width: =Parent.Width * 0.3
                                          Height: =Parent.Height * 0.08
                                          Text: ="Chức danh:"
                                          Color: =RGBA(55, 65, 81, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =FontSizes.Base
                                          
                                    - 'Profile.Info.Position.Value':
                                        Control: Label
                                        Properties:
                                          X: =Parent.Width * 0.32
                                          Y: =Parent.Height * 0.6
                                          Width: =Parent.Width * 0.68
                                          Height: =Parent.Height * 0.08
                                          Text: =If(Not(IsBlank(varCurrentUser)), varCurrentUser.ChucDanh.Value, UserSessionANP.ChucDanh)
                                          Color: =RGBA(17, 24, 39, 1)
                                          Font: =Font.'Open Sans'
                                          Size: =FontSizes.Base

                                    # Save Button
                                    - 'Profile.Info.SaveButton':
                                        Control: CanvasComponent
                                        ComponentName: ButtonComponent
                                        Properties:
                                          X: =Parent.Width * 0.75
                                          Y: =Parent.Height * 0.8
                                          Width: =Parent.Width * 0.23
                                          Height: =Parent.Height * 0.1
                                          Text: =If(varIsSaving, "Đang lưu...", "Lưu thay đổi")
                                          Size: ="Medium"
                                          Visible: =varIsEditing
                                          IsDisabled: =Or(varIsSaving, IsBlank(varEditedName), IsBlank(varEditedEmail))
                                          OnClick: |
                                            =Set(varIsSaving, true);
                                            If(varIsUserAuthenticated,
                                              Patch(NguoiDung, varCurrentUser, {
                                                HoTen: varEditedName,
                                                Email: varEditedEmail,
                                                SoDienThoai: varEditedPhone
                                              }),
                                              Set(varCurrentUser, {
                                                Title: UserSessionANP.Id,
                                                HoTen: varEditedName,
                                                Email: varEditedEmail,
                                                SoDienThoai: varEditedPhone,
                                                MaDonVi: UserSessionANP.MaDonVi,
                                                ChucDanh: UserSessionANP.ChucDanh,
                                                TrangThai: "HoatDong"
                                              })
                                            );
                                            Set(UserSessionANP, {
                                              Id: UserSessionANP.Id,
                                              Name: varEditedName,
                                              Email: varEditedEmail,
                                              Role: UserSessionANP.Role,
                                              Permission: UserSessionANP.Permission,
                                              NguoiQuanLyId: UserSessionANP.NguoiQuanLyId,
                                              HoTen: varEditedName,
                                              MaVaiTro: UserSessionANP.MaVaiTro,
                                              ChucDanh: UserSessionANP.ChucDanh,
                                              MaDonVi: UserSessionANP.MaDonVi,
                                              TrangThai: UserSessionANP.TrangThai
                                            });
                                            Set(varIsSaving, false);
                                            Set(varIsEditing, false);
                                            Notify("Đã cập nhật thông tin thành công!", NotificationType.Success)

                        # Leave Balance Tab
                        - 'Profile.LeaveBalance.Container':
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.Width
                              Height: =Parent.Height
                              Visible: =varSelectedTab = "LeaveBalance"
                            Children:
                              - 'Profile.LeaveBalance.Background':
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    Fill: =RGBA(255, 255, 255, 1)
                                    BorderColor: =RGBA(226, 232, 240, 1)
                                    BorderThickness: =1
                                    
                              # Current Year Stats
                              - 'Profile.LeaveBalance.CurrentYear':
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =Parent.Width * 0.03
                                    Y: =Parent.Height * 0.05
                                    Width: =Parent.Width * 0.44
                                    Height: =Parent.Height * 0.25
                                    Title: =Concatenate("Năm ", Year(Today()))
                                    Value: =If(Not(IsBlank(varUserLeaveBalance)), varUserLeaveBalance.TongNgayDuocPhep, 0)
                                    Icon: ="CalendarBlank"
                                    Color: =RGBA(59, 130, 246, 1)
                                    
                              # Remaining Days
                              - 'Profile.LeaveBalance.Remaining':
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =Parent.Width * 0.53
                                    Y: =Parent.Height * 0.05
                                    Width: =Parent.Width * 0.44
                                    Height: =Parent.Height * 0.25
                                    Title: ="Còn lại"
                                    Value: =If(Not(IsBlank(varUserLeaveBalance)), varUserLeaveBalance.SoNgayConLai, 0)
                                    Icon: ="Timer"
                                    Color: =RGBA(34, 197, 94, 1)
                                    
                              # Used Days
                              - 'Profile.LeaveBalance.Used':
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =Parent.Width * 0.03
                                    Y: =Parent.Height * 0.35
                                    Width: =Parent.Width * 0.44
                                    Height: =Parent.Height * 0.25
                                    Title: ="Đã sử dụng"
                                    Value: =If(Not(IsBlank(varUserLeaveBalance)), varUserLeaveBalance.SoNgayDaNghi, 0)
                                    Icon: ="CheckBadge"
                                    Color: =RGBA(139, 69, 19, 1)
                                    
                              # Pending Days
                              - 'Profile.LeaveBalance.Pending':
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =Parent.Width * 0.53
                                    Y: =Parent.Height * 0.35
                                    Width: =Parent.Width * 0.44
                                    Height: =Parent.Height * 0.25
                                    Title: ="Đang chờ duyệt"
                                    Value: =Sum(Filter(colUserLeaveHistory, Or(TrangThai.Value = "ChoDuyetCap1", TrangThai.Value = "ChoDuyetCap2", TrangThai.Value = "ChoDuyetCap3")), SoNgayNghi)
                                    Icon: ="Clock"
                                    Color: =RGBA(251, 191, 36, 1)

                              # Annual Leave Breakdown
                              - 'Profile.LeaveBalance.Details.Container':
                                  Control: GroupContainer
                                  Variant: ManualLayout
                                  Properties:
                                    X: =Parent.Width * 0.03
                                    Y: =Parent.Height * 0.65
                                    Width: =Parent.Width * 0.94
                                    Height: =Parent.Height * 0.3
                                  Children:
                                    - 'Profile.LeaveBalance.Details.Title':
                                        Control: Label
                                        Properties:
                                          X: =0
                                          Y: =0
                                          Width: =Parent.Width
                                          Height: =Parent.Height * 0.2
                                          Text: ="Chi tiết ngày phép năm hiện tại"
                                          Color: =RGBA(17, 24, 39, 1)
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Bold
                                          Size: =FontSizes.Medium
                                          
                                    - 'Profile.LeaveBalance.Details.Info':
                                        Control: Label
                                        Properties:
                                          X: =0
                                          Y: =Parent.Height * 0.25
                                          Width: =Parent.Width
                                          Height: =Parent.Height * 0.7
                                          Text: =If(Not(IsBlank(varUserLeaveBalance)),
                                            Concatenate(
                                              "Tổng ngày phép được cấp:", Text(varUserLeaveBalance.TongNgayDuocPhep), " ngày", Char(10),
                                              "Ngày phép đã sử dụng:", Text(varUserLeaveBalance.SoNgayDaNghi), " ngày", Char(10),
                                              "Ngày phép còn lại:", Text(varUserLeaveBalance.SoNgayConLai), " ngày", Char(10),
                                              "Tỷ lệ sử dụng:", Text(Round((varUserLeaveBalance.SoNgayDaNghi / varUserLeaveBalance.TongNgayDuocPhep) * 100, 0)), "%"
                                            ),
                                            "Chưa có thông tin số ngày phép năm hiện tại"
                                            )
                                          Color: =RGBA(55, 65, 81, 1)
                                          Font: =Font.'Open Sans'
                                          Size: =FontSizes.Base
                                          Wrap: =true
                                    
                        # History Tab
                        - 'Profile.History.Container':
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.Width
                              Height: =Parent.Height
                              Visible: =varSelectedTab = "History"
                            Children:
                              - 'Profile.History.Background':
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.Width
                                    Height: =Parent.Height
                                    Fill: =RGBA(255, 255, 255, 1)
                                    BorderColor: =RGBA(226, 232, 240, 1)
                                    BorderThickness: =1
                                    
                              # History Header
                              - 'Profile.History.Header':
                                  Control: Label
                                  Properties:
                                    X: =Parent.Width * 0.03
                                    Y: =Parent.Height * 0.02
                                    Width: =Parent.Width * 0.94
                                    Height: =Parent.Height * 0.06
                                    Text: ="Lịch sử đơn nghỉ phép"
                                    Color: =RGBA(17, 24, 39, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =FontSizes.Medium
                                    
                              # History List
                              - 'Profile.History.Gallery':
                                  Control: Gallery
                                  Variant: Vertical
                                  Properties:
                                    X: =Parent.Width * 0.03
                                    Y: =Parent.Height * 0.1
                                    Width: =Parent.Width * 0.94
                                    Height: =Parent.Height * 0.87
                                    Items: =SortByColumns(colUserLeaveHistory, "NgayBatDau", SortOrder.Descending)
                                    TemplateSize: =(Self.Height * 0.87) / 5
                                    BorderThickness: =0
                                    Fill: =RGBA(0, 0, 0, 0)
                                  Children:
                                    - 'Profile.History.Item':
                                        Control: GroupContainer
                                        Variant: ManualLayout
                                        Properties:
                                          X: =0
                                          Y: =0
                                          Width: =Parent.Width * 0.94
                                          Height: =(Parent.Height * 0.87) / 5
                                          Fill: =RGBA(255, 255, 255, 1)
                                          BorderColor: =RGBA(226, 232, 240, 1)
                                          BorderThickness: =1
                                        Children:
                                          # Period
                                          - 'Profile.History.Period':
                                              Control: Label
                                              Properties:
                                                X: =Parent.Width * 0.02
                                                Y: =Parent.Height * 0.1
                                                Width: =Parent.Width * 0.25
                                                Height: =Parent.Height * 0.4
                                                Text: =Text(ThisItem.NgayBatDau, "dd/mm/yyyy") & " - " & Text(ThisItem.NgayKetThuc, "dd/mm/yyyy")
                                                Color: =RGBA(17, 24, 39, 1)
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Size: =FontSizes.Small
                                                
                                          # Days
                                          - 'Profile.History.Days':
                                              Control: Label
                                              Properties:
                                                X: =Parent.Width * 0.02
                                                Y: =Parent.Height * 0.55
                                                Width: =Parent.Width * 0.25
                                                Height: =Parent.Height * 0.35
                                                Text: =Concatenate(Text(ThisItem.SoNgayNghi), " ngày")
                                                Color: =RGBA(75, 85, 99, 1)
                                                Font: =Font.'Open Sans'
                                                Size: =FontSizes.Small
                                                
                                          # Leave Type
                                          - 'Profile.History.Type':
                                              Control: Label
                                              Properties:
                                                X: =Parent.Width * 0.3
                                                Y: =Parent.Height * 0.1
                                                Width: =Parent.Width * 0.2
                                                Height: =Parent.Height * 0.4
                                                Text: =If(varIsUserAuthenticated, LookUp(LoaiNghi, Title = ThisItem.MaLoai.Value).TenLoai, Switch(ThisItem.MaLoai.Value, "ANNUAL", "Nghỉ phép năm", "PERSONAL", "Nghỉ việc riêng", "SICK", "Nghỉ ốm", "Không xác định"))
                                                Color: =RGBA(17, 24, 39, 1)
                                                Font: =Font.'Open Sans'
                                                Size: =FontSizes.Small
                                                
                                          # Status
                                          - 'Profile.History.Status':
                                              Control: Label
                                              Properties:
                                                X: =Parent.Width * 0.55
                                                Y: =(Parent.Height - Self.Height) / 2
                                                Width: =Parent.Width * 0.18
                                                Height: =Parent.Height * 0.6
                                                Text: =Switch(ThisItem.TrangThai.Value, 
                                                  "ChoDuyetCap1", "Chờ duyệt",
                                                  "ChoDuyetCap2", "Chờ duyệt", 
                                                  "ChoDuyetCap3", "Chờ duyệt",
                                                  "DaDuyet", "Đã duyệt",
                                                  "TuChoi", "Từ chối",
                                                  "Huy", "Đã hủy",
                                                  ThisItem.TrangThai.Value)
                                                Color: =Switch(ThisItem.TrangThai.Value,
                                                  "DaDuyet", RGBA(34, 197, 94, 1),
                                                  "TuChoi", RGBA(239, 68, 68, 1),
                                                  "Huy", RGBA(107, 114, 128, 1),
                                                  RGBA(251, 191, 36, 1))
                                                Fill: =Switch(ThisItem.TrangThai.Value,
                                                  "DaDuyet", RGBA(240, 253, 244, 1),
                                                  "TuChoi", RGBA(254, 242, 242, 1),
                                                  "Huy", RGBA(249, 250, 251, 1),
                                                  RGBA(254, 243, 199, 1))
                                                BorderColor: =Switch(ThisItem.TrangThai.Value,
                                                  "DaDuyet", RGBA(34, 197, 94, 1),
                                                  "TuChoi", RGBA(239, 68, 68, 1),
                                                  "Huy", RGBA(107, 114, 128, 1),
                                                  RGBA(251, 191, 36, 1))
                                                BorderThickness: =1
                                                Font: =Font.'Open Sans'
                                                FontWeight: =FontWeight.Semibold
                                                Size: =FontSizes.Small
                                                Align: =Align.Center
                                                
                                          # Reason (truncated)
                                          - 'Profile.History.Reason':
                                              Control: Label
                                              Properties:
                                                X: =Parent.Width * 0.75
                                                Y: =(Parent.Height - Self.Height) / 2
                                                Width: =Parent.Width * 0.23
                                                Height: =Parent.Height * 0.8
                                                Text: =If(Len(ThisItem.LyDo) > 30, Left(ThisItem.LyDo, 27) & "...", ThisItem.LyDo)
                                                Color: =RGBA(75, 85, 99, 1)
                                                Font: =Font.'Open Sans'
                                                Size: =FontSizes.Small
                                                Wrap: =true 
