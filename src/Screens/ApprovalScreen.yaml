Screens:
  ApprovalScreen:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      OnVisible: |
        =Set(varActiveScreen, "Approval");
        Set(varNavCollapsed, false);
        Set(varMobileMenuOpen, false);
        Set(varNavigateAwayFlag, false);
        
        //Check user permissions using CheckPermission function from App/Formulas
        Set(varUserPermissions, {
          CanApproveLevel1: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_1),
          CanApproveLevel2: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_2),
          CanApproveLevel3: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_3),
          CanViewTeamLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_TEAM_LEAVE),
          CanViewAllLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_ALL_LEAVE),
          CanRecordLeave: CheckPermission(UserSessionANP.Permission, UserPermissions.RECORD_LEAVE),
          CanManageUsers: CheckPermission(UserSessionANP.Permission, UserPermissions.MANAGE_USERS),
          CanViewDashboard: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_DASHBOARD),
          CanExportReports: CheckPermission(UserSessionANP.Permission, UserPermissions.EXPORT_REPORTS),
          IsSystemAdmin: CheckPermission(UserSessionANP.Permission, UserPermissions.SYSTEM_ADMIN)
        });
        
        //ENHANCED: Check if user has ANY approval permission OR record permission (for HR)
        Set(varCanApprove, Or(varUserPermissions.CanApproveLevel1, varUserPermissions.CanApproveLevel2, varUserPermissions.CanApproveLevel3));
        Set(varCanAccessApproval, Or(varCanApprove, varUserPermissions.CanRecordLeave, varUserPermissions.IsSystemAdmin));
        
        //ENHANCED: Determine user approval level for display
        Set(varUserApprovalLevel, 
          If(varUserPermissions.CanApproveLevel3, 3,
            If(varUserPermissions.CanApproveLevel2, 2,
              If(varUserPermissions.CanApproveLevel1, 1, 0))));
              
        //ENHANCED: Set user role display text
        Set(varUserRoleDisplay,
          If(varUserPermissions.IsSystemAdmin, "Quản trị viên",
            If(varUserPermissions.CanRecordLeave, "Nhân sự (Ghi nhận)",
              If(varUserPermissions.CanApproveLevel3, "Giám đốc điều hành",
                If(varUserPermissions.CanApproveLevel2, "Giám đốc khối",
                  If(varUserPermissions.CanApproveLevel1, "Quản lý phòng/bộ phận", "Nhân viên"))))));
        
        //DEBUG: Log permission check results for troubleshooting
        Set(varPermissionDebug, {
          UserPermission: UserSessionANP.Permission,
          CanApproveLevel1: varUserPermissions.CanApproveLevel1,
          CanApproveLevel2: varUserPermissions.CanApproveLevel2, 
          CanApproveLevel3: varUserPermissions.CanApproveLevel3,
          CanApprove: varCanApprove,
          CanAccessApproval: varCanAccessApproval,
          UserRole: UserSessionANP.MaVaiTro,
          UserId: UserSessionANP.Id,
          ApprovalLevel: varUserApprovalLevel,
          RoleDisplay: varUserRoleDisplay
        });
        
        //ENHANCED: Provide different demo users based on missing permissions
        If(And(Not(varCanAccessApproval), Not(varIsUserAuthenticated)),
          //Set demo users with different approval levels for testing
          Set(varDemoUserType, "Manager"); //Default to Manager for testing
          Switch(varDemoUserType,
            "Manager", 
              Set(UserSessionANP, {
                Id: "DEMO_MANAGER_001",
                HoTen: "Trần Thị Bình (Demo Manager)",
                Email: "manager.demo@company.com",
                MaVaiTro: "Manager",
                Permission: 279, // Manager permissions: PERSONAL_LEAVE(1) + SPECIAL_LEAVE(2) + VIEW_TEAM_LEAVE(4) + APPROVE_LEVEL_1(16) + VIEW_DASHBOARD(256)
                NguoiQuanLyId: "",
                ChucDanh: "Trưởng phòng",
                MaDonVi: "IT",
                TrangThai: "HoatDong",
                Name: "Trần Thị Bình",
                Role: "Manager"
              }),
            "Director",
              Set(UserSessionANP, {
                Id: "DEMO_DIRECTOR_001", 
                HoTen: "Lê Văn Cường (Demo Director)",
                Email: "director.demo@company.com",
                MaVaiTro: "Director",
                Permission: 879, // Director permissions: PERSONAL_LEAVE(1) + SPECIAL_LEAVE(2) + VIEW_TEAM_LEAVE(4) + VIEW_ALL_LEAVE(8) + APPROVE_LEVEL_2(32) + APPROVE_LEVEL_3(64) + VIEW_DASHBOARD(256) + EXPORT_REPORTS(512)
                NguoiQuanLyId: "",
                ChucDanh: "Giám đốc",
                MaDonVi: "BOD",
                TrangThai: "HoatDong",
                Name: "Lê Văn Cường",
                Role: "Director"
              }),
            "HR",
              Set(UserSessionANP, {
                Id: "DEMO_HR_001",
                HoTen: "Phạm Thị Dung (Demo HR)",
                Email: "hr.demo@company.com", 
                MaVaiTro: "HR",
                Permission: 3979, // HR permissions: PERSONAL_LEAVE(1) + SPECIAL_LEAVE(2) + VIEW_ALL_LEAVE(8) + RECORD_LEAVE(128) + VIEW_DASHBOARD(256) + EXPORT_REPORTS(512) + MANAGE_LEAVE_QUOTA(1024) + MANAGE_HOLIDAYS(2048)
                NguoiQuanLyId: "",
                ChucDanh: "Chuyên viên nhân sự",
                MaDonVi: "HR",
                TrangThai: "HoatDong",
                Name: "Phạm Thị Dung",
                Role: "HR"
              })
          );
          Set(varIsUserAuthenticated, true);
          //Recalculate permissions with demo user
          Set(varUserPermissions, {
            CanApproveLevel1: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_1),
            CanApproveLevel2: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_2),
            CanApproveLevel3: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_3),
            CanViewTeamLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_TEAM_LEAVE),
            CanViewAllLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_ALL_LEAVE),
            CanRecordLeave: CheckPermission(UserSessionANP.Permission, UserPermissions.RECORD_LEAVE),
            CanManageUsers: CheckPermission(UserSessionANP.Permission, UserPermissions.MANAGE_USERS),
            CanViewDashboard: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_DASHBOARD),
            CanExportReports: CheckPermission(UserSessionANP.Permission, UserPermissions.EXPORT_REPORTS),
            IsSystemAdmin: CheckPermission(UserSessionANP.Permission, UserPermissions.SYSTEM_ADMIN)
          });
          Set(varCanApprove, Or(varUserPermissions.CanApproveLevel1, varUserPermissions.CanApproveLevel2, varUserPermissions.CanApproveLevel3));
          Set(varCanAccessApproval, Or(varCanApprove, varUserPermissions.CanRecordLeave, varUserPermissions.IsSystemAdmin));
          Set(varUserApprovalLevel, 
            If(varUserPermissions.CanApproveLevel3, 3,
              If(varUserPermissions.CanApproveLevel2, 2,
                If(varUserPermissions.CanApproveLevel1, 1, 0))));
          Set(varUserRoleDisplay,
            If(varUserPermissions.IsSystemAdmin, "Quản trị viên",
              If(varUserPermissions.CanRecordLeave, "Nhân sự (Ghi nhận)",
                If(varUserPermissions.CanApproveLevel3, "Giám đốc điều hành",
                  If(varUserPermissions.CanApproveLevel2, "Giám đốc khối",
                    If(varUserPermissions.CanApproveLevel1, "Quản lý phòng/bộ phận", "Nhân viên"))))))
        );
        
        //ENHANCED: Only navigate away if user has NO access at all
        If(Not(varCanAccessApproval),
          Set(varNavigateAwayFlag, true);
          Set(varNavigateReason, "Bạn không có quyền truy cập chức năng phê duyệt"),
          //Continue with approval screen initialization
          Set(varSelectedApprovalLeave, Blank());
          Set(varShowApprovalDetails, false);
          Set(varShowApprovalConfirm, false);
          Set(varApprovalAction, "");
          Set(varApprovalComment, "");
          Set(varFilterLevel, "All"); //Default filter to show all levels
          
          //Load SharePoint data with authentication check
          If(varIsUserAuthenticated,
            //Load pending approvals from SharePoint 
            ClearCollect(colPendingApprovals, 
              Filter(DonNghiPhep, 
                Or(TrangThai.Value = "ChoDuyetCap1", TrangThai.Value = "ChoDuyetCap2", TrangThai.Value = "ChoDuyetCap3")
              )
            );
            Set(varPendingApprovals, colPendingApprovals);
            
            //ENHANCED: Filter approvals for current user's level AND all levels for visibility
            ClearCollect(colMyLevelApprovals, 
              If(varCanApprove,
                //If user can approve, show only their level
                Filter(colPendingApprovals, 
                  Or(
                    And(varUserPermissions.CanApproveLevel1, TrangThai.Value = "ChoDuyetCap1"),
                    And(varUserPermissions.CanApproveLevel2, TrangThai.Value = "ChoDuyetCap2"),
                    And(varUserPermissions.CanApproveLevel3, TrangThai.Value = "ChoDuyetCap3")
                  )
                ),
                //If user can't approve (like HR), show all for monitoring
                colPendingApprovals
              )
            );
            Set(varMyLevelApprovals, colMyLevelApprovals),
            
            //No authentication - use enhanced demo data
            ClearCollect(colPendingApprovals,
              Table(
                {Title: "REQ001", MaNguoiDung: {Value: "EMP001"}, NgayBatDau: DateAdd(Today(), 5, TimeUnit.Days), NgayKetThuc: DateAdd(Today(), 7, TimeUnit.Days), SoNgayNghi: 3, MaLoai: {Value: "ANNUAL"}, LyDo: "Nghỉ phép năm", TrangThai: {Value: "ChoDuyetCap1"}, NguoiBanGiao: {Value: "EMP002"}, NoiDungBanGiao: "Bàn giao công việc cho đồng nghiệp"},
                {Title: "REQ002", MaNguoiDung: {Value: "EMP003"}, NgayBatDau: DateAdd(Today(), 10, TimeUnit.Days), NgayKetThuc: DateAdd(Today(), 12, TimeUnit.Days), SoNgayNghi: 3, MaLoai: {Value: "SICK"}, LyDo: "Nghỉ ốm", TrangThai: {Value: "ChoDuyetCap2"}, NguoiBanGiao: {Value: "EMP004"}, NoiDungBanGiao: "Bàn giao công việc cấp bách"},
                {Title: "REQ003", MaNguoiDung: {Value: "EMP005"}, NgayBatDau: DateAdd(Today(), 15, TimeUnit.Days), NgayKetThuc: DateAdd(Today(), 29, TimeUnit.Days), SoNgayNghi: 15, MaLoai: {Value: "ANNUAL"}, LyDo: "Nghỉ phép dài ngày", TrangThai: {Value: "ChoDuyetCap3"}, NguoiBanGiao: {Value: "EMP006"}, NoiDungBanGiao: "Bàn giao dự án quan trọng"}
              )
            );
            Set(varPendingApprovals, colPendingApprovals);
            
            //Enhanced demo filtering
            ClearCollect(colMyLevelApprovals, 
              If(varCanApprove,
                Filter(colPendingApprovals, 
                  Or(
                    And(varUserPermissions.CanApproveLevel1, TrangThai.Value = "ChoDuyetCap1"),
                    And(varUserPermissions.CanApproveLevel2, TrangThai.Value = "ChoDuyetCap2"),
                    And(varUserPermissions.CanApproveLevel3, TrangThai.Value = "ChoDuyetCap3")
                  )
                ),
                colPendingApprovals
              )
            );
            Set(varMyLevelApprovals, colMyLevelApprovals)
          )
        );
        
        //Start authentication check
        Set(varAuthTimerStart, true)
    Children:
      # Authentication Check Timer
      - 'Approval.AuthTimer':
          Control: Timer
          Properties:
            X: =0
            Y: =0
            Width: =1
            Height: =1
            Duration: =100
            AutoStart: =varAuthTimerStart
            Visible: =false
            OnTimerEnd: |
              =//Reset timer flag
              Set(varAuthTimerStart, false);
              //Check authentication: If not logged in, redirect to login
              If(Not(varIsUserAuthenticated),
                Navigate(LoginScreen),
                //Continue with approval - user is authenticated
                Set(varAuthenticationValid, true)
              )
      
      # Permission Check Timer - Only navigate away if NO access at all
      - 'Approval.PermissionTimer':
          Control: Timer
          Properties:
            X: =0
            Y: =0
            Width: =1
            Height: =1
            Duration: =500
            AutoStart: =varNavigateAwayFlag
            Visible: =false
            OnTimerEnd: |
              =//Reset timer flag
              Set(varNavigateAwayFlag, false);
              //Show notification and navigate to Dashboard
              Notify(varNavigateReason, NotificationType.Error);
              Navigate(DashboardScreen)
      
      - Approval.Header:
          Control: CanvasComponent
          ComponentName: HeaderComponent
          Properties:
            X: =0
            Y: =0
            Height: =Parent.Height * 0.065
            Width: =Parent.Width
            NotificationCount: =CountRows(varMyLevelApprovals)
            OnLogout: |
              =//Clear authentication flag
              Set(varIsUserAuthenticated, false);
              //Clear UserSessionANP data with correct structure
              Set(UserSessionANP, {
                Id: "",
                HoTen: "",
                Email: "",
                MaVaiTro: "",
                Permission: 0,
                NguoiQuanLyId: "",
                ChucDanh: "",
                MaDonVi: "",
                TrangThai: "",
                Name: "",
                Role: ""
              });
              //Navigate to login
              Navigate(LoginScreen)
            OnSearch: =false
            ShowNotification: =true
            ShowSearch: =true
            UserName: =UserSessionANP.HoTen
            UserRole: =UserSessionANP.MaVaiTro
      - Approval.Navigation:
          Control: CanvasComponent
          ComponentName: NavigationComponent
          Properties:
            X: =0
            Y: ='Approval.Header'.Height
            Width: =If(varNavCollapsed, App.Width * 0.045, App.Width * 0.14)
            Height: =Parent.Height - 'Approval.Header'.Height
            UserRole: =UserSessionANP.MaVaiTro
            ActiveScreen: ="Approval"
            IsCollapsed: =varNavCollapsed
            DashboardScreen: =DashboardScreen
            LeaveRequestScreen: =LeaveRequestScreen
            MyLeavesScreen: =MyLeavesScreen
            CalendarScreen: =CalendarScreen
            ManagementScreen: =ManagementScreen
            ReportsScreen: =ReportsScreen
            ProfileScreen: =ProfileScreen
            ApprovalScreen: =ApprovalScreen
            OnNavigate: |
              =Set(varActiveScreen, ScreenName);
              Switch(ScreenName,
                "Dashboard", Navigate(DashboardScreen),
                "LeaveRequest", Navigate(LeaveRequestScreen),
                "MyLeaves", Navigate(MyLeavesScreen),
                "Calendar", Navigate(CalendarScreen),
                "Management", Navigate(ManagementScreen),
                "Profile", Navigate(ProfileScreen),
                "Approval", Navigate(ApprovalScreen),
                "Reports", Navigate(ReportsScreen)
              )
            OnToggleCollapse: |
              =Set(varNavCollapsed, !varNavCollapsed)
      - Approval.Content.Container:
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: ='Approval.Navigation'.Width
            Y: ='Approval.Header'.Height
            Height: =Parent.Height - 'Approval.Header'.Height
            Width: =Parent.Width - 'Approval.Navigation'.Width
          Children:
            - Approval.Content.Padded:
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.01
                  Y: =Parent.Height * 0.01
                  Height: =Parent.Height * 0.98
                  Width: =Parent.Width * 0.98
                Children:
                  - Approval.PageHeader.Container:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: =0
                        Height: =Parent.Height * 0.12
                        Width: =Parent.Width
                      Children:
                        - Approval.PageHeader.Background:
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.Height
                              Width: =Parent.Width
                        - Approval.PageHeader.Icon:
                            Control: Classic/Icon
                            Properties:
                              X: =Parent.Width * 0.015
                              Y: =Parent.Height * 0.2
                              Color: =RGBA(59, 130, 246, 1)
                              Height: =Parent.Height * 0.15
                              Icon: =Icon.CheckBadge
                              Width: =Parent.Height * 0.15
                        - Approval.PageHeader.Title:
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015 + 'Approval.PageHeader.Icon'.Width + Parent.Width * 0.01
                              Y: =Parent.Height * 0.15
                              Color: =RGBA(17, 24, 39, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height * 0.25
                              Size: =FontSizes.Medium
                              Text: ="Phê duyệt đơn nghỉ phép"
                              Width: =Parent.Width * 0.4
                        - Approval.PageHeader.Stats:
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015 + 'Approval.PageHeader.Icon'.Width + Parent.Width * 0.01
                              Y: =Parent.Height * 0.45
                              Color: =RGBA(75, 85, 99, 1)
                              Font: =Font.'Open Sans'
                              Height: =Parent.Height * 0.2
                              Size: =FontSizes.Base
                              Text: =Concatenate("Đang chờ duyệt" & ":" & " ", CountRows(varMyLevelApprovals), " " & "đơn")
                              Width: =Parent.Width * 0.4
                        # ENHANCED: Role and Permission Display
                        - Approval.PageHeader.RoleInfo:
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015 + 'Approval.PageHeader.Icon'.Width + Parent.Width * 0.01
                              Y: =Parent.Height * 0.7
                              Color: =If(varCanApprove, RGBA(34, 197, 94, 1), RGBA(251, 146, 60, 1))
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height * 0.2
                              Size: =FontSizes.Small
                              Text: =Concatenate("Vai trò" & ":" & " ", varUserRoleDisplay, If(varCanApprove, Concatenate(" (Cấp ", Text(varUserApprovalLevel), ")"), " (Chỉ xem)"))
                              Width: =Parent.Width * 0.4
                        # ENHANCED: Demo User Switcher for Testing
                        - Approval.PageHeader.DemoSwitcher:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =Parent.Width * 0.55
                              Y: =Parent.Height * 0.1
                              Height: =Parent.Height * 0.8
                              Width: =Parent.Width * 0.42
                              Visible: =Not(varIsUserAuthenticated) //Show only when using demo
                            Children:
                              - Approval.Demo.Label:
                                  Control: Label
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Color: =RGBA(75, 85, 99, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =Parent.Height * 0.3
                                    Size: =FontSizes.Small
                                    Text: ="Demo User (Testing):"
                                    Width: =Parent.Width
                              - Approval.Demo.Manager:
                                  Control: CanvasComponent
                                  ComponentName: ButtonComponent
                                  Properties:
                                    X: =0
                                    Y: =Parent.Height * 0.35
                                    FullWidth: =false
                                    Height: =Parent.Height * 0.25
                                    Icon: =""
                                    IconPosition: ="Left"
                                    IsDisabled: =false
                                    IsLoading: =false
                                    LoadingText: ="Đang xử lý..."
                                    OnClick: |
                                      =Set(varDemoUserType, "Manager");
                                      Navigate(ApprovalScreen)
                                    Size: ="Small"
                                    Text: ="Manager"
                                    Width: =Parent.Width * 0.3
                              - Approval.Demo.Director:
                                  Control: CanvasComponent
                                  ComponentName: ButtonComponent
                                  Properties:
                                    X: =Parent.Width * 0.35
                                    Y: =Parent.Height * 0.35
                                    FullWidth: =false
                                    Height: =Parent.Height * 0.25
                                    Icon: =""
                                    IconPosition: ="Left"
                                    IsDisabled: =false
                                    IsLoading: =false
                                    LoadingText: ="Đang xử lý..."
                                    OnClick: |
                                      =Set(varDemoUserType, "Director");
                                      Navigate(ApprovalScreen)
                                    Size: ="Small"
                                    Text: ="Director"
                                    Width: =Parent.Width * 0.3
                              - Approval.Demo.HR:
                                  Control: CanvasComponent
                                  ComponentName: ButtonComponent
                                  Properties:
                                    X: =Parent.Width * 0.7
                                    Y: =Parent.Height * 0.35
                                    FullWidth: =false
                                    Height: =Parent.Height * 0.25
                                    Icon: =""
                                    IconPosition: ="Left"
                                    IsDisabled: =false
                                    IsLoading: =false
                                    LoadingText: ="Đang xử lý..."
                                    OnClick: |
                                      =Set(varDemoUserType, "HR");
                                      Navigate(ApprovalScreen)
                                    Size: ="Small"
                                    Text: ="HR"
                                    Width: =Parent.Width * 0.3
                        # Permission Debug Info (can be hidden in production)
                        - Approval.PageHeader.Debug:
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.6
                              Y: =Parent.Height * 0.75
                              Color: =RGBA(156, 163, 175, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Normal
                              Height: =Parent.Height * 0.2
                              Size: =FontSizes.Small
                              Text: =Concatenate("Debug - Perm:" & " ", Text(UserSessionANP.Permission), " | ", "L1:" & " ", If(varUserPermissions.CanApproveLevel1, "✓", "✗"), " ", "L2:" & " ", If(varUserPermissions.CanApproveLevel2, "✓", "✗"), " ", "L3:" & " ", If(varUserPermissions.CanApproveLevel3, "✓", "✗"))
                              Visible: =true //Set to false in production
                              Width: =Parent.Width * 0.35
                  - Approval.Stats.Container:
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: ='Approval.PageHeader.Container'.Y + 'Approval.PageHeader.Container'.Height + Parent.Height * 0.015
                        Height: =Parent.Height * 0.15
                        Width: =Parent.Width
                      Children:
                        - Approval.Stats.Background:
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.Height
                              Width: =Parent.Width
                        - Approval.Stats.Header:
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015
                              Y: =Parent.Height * 0.05
                              Color: =RGBA(17, 24, 39, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height * 0.2
                              Size: =FontSizes.Base
                              Text: ="Tổng quan phê duyệt"
                              Width: =Parent.Width * 0.97
                        - Approval.Stats.Cards.Container:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =Parent.Width * 0.015
                              Y: =Parent.Height * 0.3
                              Height: =Parent.Height * 0.65
                              Width: =Parent.Width * 0.97
                            Children:
                              - Approval.Stats.Pending:
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Color: =RGBA(251, 191, 36, 1)
                                    Height: =Parent.Height
                                    Icon: ="Clock"
                                    Title: ="Chờ tôi duyệt"
                                    Value: =CountRows(varMyLevelApprovals)
                                    Width: =(Parent.Width - Parent.Width * 0.03) / 4
                              - Approval.Stats.Cap1:
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =(Parent.Width + Parent.Width * 0.01) / 4
                                    Y: =0
                                    Color: =RGBA(239, 68, 68, 1)
                                    Height: =Parent.Height
                                    Icon: ="Person"
                                    Title: ="Chờ cấp 1"
                                    Value: =CountRows(Filter(varPendingApprovals, TrangThai.Value = "ChoDuyetCap1"))
                                    Width: =(Parent.Width - Parent.Width * 0.03) / 4
                              - Approval.Stats.Cap2:
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =(Parent.Width + Parent.Width * 0.01) * 2 / 4
                                    Y: =0
                                    Color: =RGBA(251, 146, 60, 1)
                                    Height: =Parent.Height
                                    Icon: ="Settings"
                                    Title: ="Chờ cấp 2"
                                    Value: =CountRows(Filter(varPendingApprovals, TrangThai.Value = "ChoDuyetCap2"))
                                    Width: =(Parent.Width - Parent.Width * 0.03) / 4
                              - Approval.Stats.Cap3:
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =(Parent.Width + Parent.Width * 0.01) * 3 / 4
                                    Y: =0
                                    Color: =RGBA(139, 69, 19, 1)
                                    Height: =Parent.Height
                                    Icon: ="Crown"
                                    Title: ="Chờ cấp 3"
                                    Value: =CountRows(Filter(varPendingApprovals, TrangThai.Value = "ChoDuyetCap3"))
                                    Width: =(Parent.Width - Parent.Width * 0.03) / 4
      - Approval.DataTable:
          Control: DataTable
          Properties:
