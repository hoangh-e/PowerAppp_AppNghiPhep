Screens:
  MyLeavesScreen:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      OnVisible: |
        =Set(varActiveScreen, "MyLeaves");
        Set(varNavCollapsed, false);
        Set(varMobileMenuOpen, false);
        Set(varDataLoading, true);
        Set(varNetworkError, false);
        
        //Check user permissions using CheckPermission function from App/Formulas
        Set(varUserPermissions, {
          CanViewPersonalLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.PERSONAL_LEAVE),
          CanCreatePersonalLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.PERSONAL_LEAVE),
          CanViewTeamLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_TEAM_LEAVE),
          CanViewAllLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_ALL_LEAVE),
          CanExportReports: CheckPermission(UserSessionANP.Permission, UserPermissions.EXPORT_REPORTS),
          CanRecordLeave: CheckPermission(UserSessionANP.Permission, UserPermissions.RECORD_LEAVE),
          CanViewDashboard: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_DASHBOARD)
        });
        
        //CRITICAL: Check if user can view personal leaves
        Set(varCanViewMyLeaves, varUserPermissions.CanViewPersonalLeaves);
        
        //Filter and sorting controls
        Set(varSelectedStatus, "");
        Set(varFilterDateFrom, Blank());
        Set(varFilterDateTo, Blank());
        Set(varSelectedLeave, Blank());
        Set(varRecordSelected, false);
        Set(varShowDetails, false);
        Set(varShowCancelConfirm, false);
        Set(varCancelMessage, "");
        
        //Load SharePoint data with authentication check
        If(varIsUserAuthenticated,
          //Load user's leave requests from SharePoint DonNghiPhep
          If(varCanViewMyLeaves,
            ClearCollect(colCurrentUserLeaves, 
              SortByColumns(
                Filter(DonNghiPhep, MaNguoiDung.Value = UserSessionANP.Id),
                "NgayBatDau", 
                SortOrder.Descending
              )
            );
            
            //Load leave types from SharePoint for display
            ClearCollect(colMyLeavesTypes, LoaiNghi);
            
            //Load user data for display
            ClearCollect(colMyLeavesUsers, Filter(NguoiDung, Title = UserSessionANP.Id));
            
            //Load leave balance data from SharePoint SoNgayPhep
            ClearCollect(colMyLeaveBalance, Filter(SoNgayPhep, MaNhanVien.Value = UserSessionANP.Id));
            
            Set(varNetworkError, false),
            //No permission - redirect to dashboard
            Notify("Bạn không có quyền xem đơn nghỉ phép cá nhân", NotificationType.Error);
            Navigate(DashboardScreen)
          ),
          //No authentication - use demo data for preview
          Set(varNetworkError, true);
          //Create demo leave data with correct SharePoint structure
          ClearCollect(colCurrentUserLeaves, 
            Table(
              {MaDon: "LR001", MaNguoiDung: {Value: "EMP001"}, NgayBatDau: Date(2024,12,20), NgayKetThuc: Date(2024,12,22), SoNgayNghi: 3, LyDo: "Nghỉ phép thường niên", TrangThai: {Value: "ChoDuyetCap1"}, BuoiNghi: {Value: "CaNgay"}, MaLoai: {Value: "ANNUAL"}},
              {MaDon: "LR002", MaNguoiDung: {Value: "EMP001"}, NgayBatDau: Date(2024,11,15), NgayKetThuc: Date(2024,11,15), SoNgayNghi: 1, LyDo: "Nghỉ ốm", TrangThai: {Value: "DaDuyet"}, BuoiNghi: {Value: "Sang"}, MaLoai: {Value: "SICK"}},
              {MaDon: "LR003", MaNguoiDung: {Value: "EMP001"}, NgayBatDau: Date(2024,10,10), NgayKetThuc: Date(2024,10,12), SoNgayNghi: 3, LyDo: "Công việc gia đình", TrangThai: {Value: "TuChoi"}, BuoiNghi: {Value: "CaNgay"}, MaLoai: {Value: "PERSONAL"}}
            )
          );
          //Demo leave types
          ClearCollect(colMyLeavesTypes,
            Table(
              {Title: "ANNUAL", TenLoai: "Nghỉ phép năm"},
              {Title: "SICK", TenLoai: "Nghỉ ốm"},
              {Title: "PERSONAL", TenLoai: "Việc cá nhân"}
            )
          );
          //Demo user data
          ClearCollect(colMyLeavesUsers,
            Table(
              {Title: "EMP001", HoTen: "Nguyễn Văn An", MaDonVi: {Value: "IT"}}
            )
          );
          //Demo leave balance
          ClearCollect(colMyLeaveBalance,
            Table(
              {MaNhanVien: {Value: "EMP001"}, TongNgayDuocPhep: 12, SoNgayDaNghi: 7, SoNgayConLai: 5}
            )
          )
        );
        
        Set(varDataLoading, false);
        
        //Start authentication check
        Set(varAuthTimerStart, true)
    Children:
      # Authentication Check Timer
      - 'MyLeaves.AuthTimer':
          Control: Timer
          Properties:
            X: =0
            Y: =0
            Width: =1
            Height: =1
            Duration: =100
            AutoStart: =varAuthTimerStart
            Visible: =false
            OnTimerEnd: |
              =//Reset timer flag
              Set(varAuthTimerStart, false);
              //Check authentication: If not logged in, redirect to login
              If(Not(varIsUserAuthenticated),
                Navigate(LoginScreen),
                //Check personal leave permissions after authentication
                If(Not(varCanViewMyLeaves),
                  Notify("Bạn không có quyền xem đơn nghỉ phép cá nhân", NotificationType.Error);
                  Navigate(DashboardScreen),
                  //Continue with my leaves - user is authenticated and has permission
                  Set(varAuthenticationValid, true)
                )
              )
              
      # Header Component
      - 'MyLeaves.Header':
          Control: CanvasComponent
          ComponentName: HeaderComponent
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height * 0.065
            UserName: =UserSessionANP.HoTen
            UserRole: =UserSessionANP.MaVaiTro
            ShowNotification: =true
            NotificationCount: =0
            OnLogout: |
              =Set(varIsUserAuthenticated, false);
              Set(UserSessionANP, {
                Id: "",
                HoTen: "",
                Email: "",
                MaVaiTro: "",
                Permission: 0,
                NguoiQuanLyId: "",
                ChucDanh: "",
                MaDonVi: "",
                TrangThai: "",
                Name: "",
                Role: ""
              });
              Navigate(LoginScreen)

      # Navigation Component
      - 'MyLeaves.Navigation':
          Control: CanvasComponent
          ComponentName: NavigationComponent
          Properties:
            X: =0
            Y: ='MyLeaves.Header'.Height
            Width: =If(varNavCollapsed, App.Width * 0.045, App.Width * 0.14)
            Height: =Parent.Height - 'MyLeaves.Header'.Height
            UserRole: =UserSessionANP.MaVaiTro
            ActiveScreen: ="MyLeaves"
            IsCollapsed: =varNavCollapsed
            DashboardScreen: =DashboardScreen
            LeaveRequestScreen: =LeaveRequestScreen
            MyLeavesScreen: =MyLeavesScreen
            CalendarScreen: =CalendarScreen
            ManagementScreen: =ManagementScreen
            ReportsScreen: =ReportsScreen
            ProfileScreen: =ProfileScreen
            OnNavigate: |
              =Set(varActiveScreen, ScreenName);
              Switch(ScreenName,
                "Dashboard", Navigate(DashboardScreen),
                "LeaveRequest", Navigate(LeaveRequestScreen),
                "MyLeaves", Navigate(MyLeavesScreen),
                "Calendar", Navigate(CalendarScreen),
                "Management", Navigate(ManagementScreen),
                "Profile", Navigate(ProfileScreen),
                "Approval", Navigate(ApprovalScreen),
                "Reports", Navigate(ReportsScreen)
              )
            OnToggleCollapse: |
              =Set(varNavCollapsed, !varNavCollapsed)
            
      # Main Content Container
      - 'MyLeaves.Content.Container':
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: ='MyLeaves.Navigation'.Width
            Y: ='MyLeaves.Header'.Height
            Width: =Parent.Width - 'MyLeaves.Navigation'.Width
            Height: =Parent.Height - 'MyLeaves.Header'.Height
          Children:
            - 'MyLeaves.Content.Padded':
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.01
                  Y: =Parent.Height * 0.01
                  Width: =Parent.Width * 0.98
                  Height: =Parent.Height * 0.98
                Children:
                  # Page Header
                  - 'MyLeaves.PageHeader.Container':
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.Width
                        Height: =Parent.Height * 0.1
                      Children:
                        - 'MyLeaves.PageHeader.Background':
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.Width
                              Height: =Parent.Height
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              
                        - 'MyLeaves.PageHeader.Icon':
                            Control: Classic/Icon
                            Properties:
                              X: =Parent.Width * 0.015
                              Y: =Parent.Height * 0.25
                              Width: =Parent.Height * 0.2
                              Height: =Parent.Height * 0.2
                              Icon: =Icon.DetailList
                              Color: =RGBA(59, 130, 246, 1)
                              
                        - 'MyLeaves.PageHeader.Title':
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015 + 'MyLeaves.PageHeader.Icon'.Width + Parent.Width * 0.01
                              Y: =Parent.Height * 0.2
                              Width: =Parent.Width * 0.6
                              Height: =Parent.Height * 0.35
                              Text: ="Đơn nghỉ phép của tôi"
                              Color: =RGBA(17, 24, 39, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =FontSizes.Medium
                        
                        - 'MyLeaves.PageHeader.Stats':
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015 + 'MyLeaves.PageHeader.Icon'.Width + Parent.Width * 0.01
                              Y: =Parent.Height * 0.6
                              Width: =Parent.Width * 0.6
                              Height: =Parent.Height * 0.25
                              Text: =Concatenate("Tổng", ":" & " ", CountRows(colCurrentUserLeaves), " " & "đơn nghỉ phép")
                              Color: =RGBA(75, 85, 99, 1)
                              Font: =Font.'Open Sans'
                              Size: =FontSizes.Small
                        
                        - 'MyLeaves.NewRequest.Button':
                            Control: CanvasComponent
                            ComponentName: ButtonComponent
                            Properties:
                              X: =Parent.Width * 0.75
                              Y: =(Parent.Height - Self.Height) / 2
                              Width: =Parent.Width * 0.22
                              Height: =Parent.Height * 0.6
                              Text: ="Tạo đơn mới"
                              Size: =FontSizes.Medium
                              OnClick: |
                                =Navigate(LeaveRequestScreen)

                  # Stats Section
                  - 'MyLeaves.Stats.Container':
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: ='MyLeaves.PageHeader.Container'.Y + 'MyLeaves.PageHeader.Container'.Height + Parent.Height * 0.015
                        Width: =Parent.Width
                        Height: =Parent.Height * 0.15
                      Children:
                        - 'MyLeaves.Stats.Background':
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.Width
                              Height: =Parent.Height
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              
                        - 'MyLeaves.Stats.Header':
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015
                              Y: =Parent.Height * 0.05
                              Width: =Parent.Width * 0.97
                              Height: =Parent.Height * 0.2
                              Text: ="Thống kê nhanh"
                              Color: =RGBA(17, 24, 39, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =FontSizes.Base
                        
                        - 'MyLeaves.Stats.Cards.Container':
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =Parent.Width * 0.015
                              Y: =Parent.Height * 0.3
                              Width: =Parent.Width * 0.97
                              Height: =Parent.Height * 0.65
                            Children:
                              - 'MyLeaves.Stats.Pending':
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =(Parent.Width - Parent.Width * 0.03) / 4
                                    Height: =Parent.Height
                                    Title: ="Chờ duyệt"
                                    Value: =CountRows(Filter(colCurrentUserLeaves, Or(TrangThai.Value = "ChoDuyetCap1", TrangThai.Value = "ChoDuyetCap2", TrangThai.Value = "ChoDuyetCap3")))
                                    Icon: ="Clock"
                                    Color: =RGBA(251, 191, 36, 1)
                                    
                              - 'MyLeaves.Stats.Approved':
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =(Parent.Width + Parent.Width * 0.01) / 4
                                    Y: =0
                                    Width: =(Parent.Width - Parent.Width * 0.03) / 4
                                    Height: =Parent.Height
                                    Title: ="Đã duyệt"
                                    Value: =CountRows(Filter(colCurrentUserLeaves, TrangThai.Value = "DaDuyet"))
                                    Icon: ="CheckBadge"
                                    Color: =RGBA(34, 197, 94, 1)
                                    
                              - 'MyLeaves.Stats.Rejected':
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =(Parent.Width + Parent.Width * 0.01) * 2 / 4
                                    Y: =0
                                    Width: =(Parent.Width - Parent.Width * 0.03) / 4
                                    Height: =Parent.Height
                                    Title: ="Từ chối"
                                    Value: =CountRows(Filter(colCurrentUserLeaves, TrangThai.Value = "TuChoi"))
                                    Icon: ="Cancel"
                                    Color: =RGBA(239, 68, 68, 1)

                              - 'MyLeaves.Stats.Total':
                                  Control: CanvasComponent
                                  ComponentName: StatsCardComponent
                                  Properties:
                                    X: =(Parent.Width + Parent.Width * 0.01) * 3 / 4
                                    Y: =0
                                    Width: =(Parent.Width - Parent.Width * 0.03) / 4
                                    Height: =Parent.Height
                                    Title: ="Tổng cộng"
                                    Value: =CountRows(colCurrentUserLeaves)
                                    Icon: ="CalendarBlank"
                                    Color: =RGBA(59, 130, 246, 1)

                  # Filter Section
                  - 'MyLeaves.Filter.Container':
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: ='MyLeaves.Stats.Container'.Y + 'MyLeaves.Stats.Container'.Height + Parent.Height * 0.015
                        Width: =Parent.Width
                        Height: =Parent.Height * 0.12
                      Children:
                        - 'MyLeaves.Filter.Background':
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.Width
                              Height: =Parent.Height
                              Fill: =RGBA(249, 250, 251, 1)
                              BorderColor: =RGBA(229, 231, 235, 1)
                              BorderThickness: =1
                              
                        - 'MyLeaves.Filter.Header':
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015
                              Y: =Parent.Height * 0.05
                              Width: =Parent.Width * 0.97
                              Height: =Parent.Height * 0.2
                              Text: ="Bộ lọc"
                              Color: =RGBA(17, 24, 39, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Size: =FontSizes.Base
                              
                        - 'MyLeaves.Filter.Controls.Container':
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =Parent.Width * 0.015
                              Y: =Parent.Height * 0.3
                              Width: =Parent.Width * 0.97
                              Height: =Parent.Height * 0.4
                            Children:
                              # Status Filter
                              - 'MyLeaves.Filter.StatusLabel':
                                  Control: Label
                                  Properties:
                                    X: =0
                                    Y: =(Parent.Height - Self.Height) / 2
                                    Width: =Parent.Width * 0.1
                                    Height: =Parent.Height * 0.8
                                    Text: ="Trạng thái" & ":"
                                    Color: =RGBA(55, 65, 81, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =FontSizes.Small
                                    Align: =Align.Left
                                    
                              - 'MyLeaves.Filter.StatusDropdown':
                                  Control: Classic/DropDown
                                  Properties:
                                    X: =Parent.Width * 0.11
                                    Y: =0
                                    Width: =Parent.Width * 0.18
                                    Height: =Parent.Height
                                    Items: =["Tất cả", "ChoDuyetCap1", "ChoDuyetCap2", "ChoDuyetCap3", "DaDuyet", "TuChoi", "Huy"]
                                    Default: ="Tất cả"
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Color: =RGBA(55, 65, 81, 1)
                                    Font: =Font.'Open Sans'
                                    Size: =FontSizes.Small
                                    OnChange: |
                                      =Set(varSelectedStatus, If(Self.Selected.Value = "Tất cả", "", Self.Selected.Value))

                              # Date From Filter
                              - 'MyLeaves.Filter.FromLabel':
                                  Control: Label
                                  Properties:
                                    X: =Parent.Width * 0.31
                                    Y: =(Parent.Height - Self.Height) / 2
                                    Width: =Parent.Width * 0.08
                                    Height: =Parent.Height * 0.8
                                    Text: =Concatenate("Từ ngày", ":")
                                    Color: =RGBA(55, 65, 81, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =FontSizes.Small
                                    Align: =Align.Left
                                    
                              - 'MyLeaves.Filter.DateFrom':
                                  Control: Classic/DatePicker
                                  Properties:
                                    X: =Parent.Width * 0.4
                                    Y: =0
                                    Width: =Parent.Width * 0.15
                                    Height: =Parent.Height
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Color: =RGBA(55, 65, 81, 1)
                                    Font: =Font.'Open Sans'
                                    Size: =FontSizes.Small
                                    OnChange: |
                                      =Set(varFilterDateFrom, Self.SelectedDate)

                              # Date To Filter
                              - 'MyLeaves.Filter.ToLabel':
                                  Control: Label
                                  Properties:
                                    X: =Parent.Width * 0.57
                                    Y: =(Parent.Height - Self.Height) / 2
                                    Width: =Parent.Width * 0.08
                                    Height: =Parent.Height * 0.8
                                    Text: =Concatenate("Đến ngày", ":")
                                    Color: =RGBA(55, 65, 81, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =FontSizes.Small
                                    Align: =Align.Left
                                    
                              - 'MyLeaves.Filter.DateTo':
                                  Control: Classic/DatePicker
                                  Properties:
                                    X: =Parent.Width * 0.66
                                    Y: =0
                                    Width: =Parent.Width * 0.15
                                    Height: =Parent.Height
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Color: =RGBA(55, 65, 81, 1)
                                    Font: =Font.'Open Sans'
                                    Size: =FontSizes.Small
                                    OnChange: |
                                      =Set(varFilterDateTo, Self.SelectedDate)

                              # Clear Filter Button
                              - 'MyLeaves.Filter.ClearButton':
                                  Control: CanvasComponent
                                  ComponentName: ButtonComponent
                                  Properties:
                                    X: =Parent.Width * 0.83
                                    Y: =0
                                    Width: =Parent.Width * 0.15
                                    Height: =Parent.Height
                                    Text: ="Xóa bộ lọc"
                                    Size: =FontSizes.Small
                                    OnClick: |
                                      =Set(varSelectedStatus, ""); Set(varFilterDateFrom, Blank()); Set(varFilterDateTo, Blank()); Reset('MyLeaves.Filter.StatusDropdown'); Reset('MyLeaves.Filter.DateFrom'); Reset('MyLeaves.Filter.DateTo')

                        # Summary Stats
                        - 'MyLeaves.Filter.Summary':
                            Control: Label
                            Properties:
                              X: =Parent.Width * 0.015
                              Y: =Parent.Height * 0.75
                              Width: =Parent.Width * 0.97
                              Height: =Parent.Height * 0.2
                              Text: =Concatenate("Hiển thị ", CountRows(Filter(colCurrentUserLeaves, And(Or(IsBlank(varSelectedStatus), TrangThai.Value = varSelectedStatus), Or(IsBlank(varFilterDateFrom), NgayBatDau >= varFilterDateFrom), Or(IsBlank(varFilterDateTo), NgayKetThuc <= varFilterDateTo)))), " " & "kết quả")
                              Color: =RGBA(107, 114, 128, 1)
                              Font: =Font.'Open Sans'
                              Size: =FontSizes.Small
                              Align: =Align.Left

      # Action Bar for selected records
      - 'MyLeaves.ActionBar.Container':
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: ='MyLeaves.Navigation'.Width + 'MyLeaves.Content.Container'.Width * 0.02
            Y: ='MyLeaves.Header'.Height + 'MyLeaves.Content.Container'.Height * 0.41
            Width: ='MyLeaves.Content.Container'.Width * 0.96
            Height: ='MyLeaves.Content.Container'.Height * 0.06
            Fill: =RGBA(249, 250, 251, 1)
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Visible: =varRecordSelected
          Children:
            - 'MyLeaves.ActionBar.Background':
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =Parent.Height
                  Fill: =If(varRecordSelected, RGBA(219, 234, 254, 0.3), RGBA(255, 255, 255, 1))
                  BorderColor: =If(varRecordSelected, RGBA(59, 130, 246, 1), RGBA(226, 232, 240, 1))
                  BorderThickness: =If(varRecordSelected, 2, 1)
                  
            - 'MyLeaves.ActionBar.ViewButton':
                Control: CanvasComponent
                ComponentName: ButtonComponent
                Properties:
                  X: =Parent.Width * 0.05
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Parent.Width * 0.25
                  Height: =Parent.Height * 0.7
                  Text: ="Xem chi tiết"
                  Size: =FontSizes.Small
                  IsDisabled: =IsBlank(varSelectedLeave)
                  OnClick: |
                    =Set(varShowDetails, true)
                    
            - 'MyLeaves.ActionBar.CancelButton':
                Control: CanvasComponent
                ComponentName: ButtonComponent
                Properties:
                  X: =Parent.Width * 0.35
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Parent.Width * 0.25
                  Height: =Parent.Height * 0.7
                  Text: ="Hủy đơn"
                  Size: =FontSizes.Small
                  IsDisabled: =Or(IsBlank(varSelectedLeave), Not(Or(varSelectedLeave.TrangThai.Value = "ChoDuyetCap1", varSelectedLeave.TrangThai.Value = "ChoDuyetCap2", varSelectedLeave.TrangThai.Value = "ChoDuyetCap3")))
                  OnClick: |
                    =Set(varShowCancelConfirm, true)
                    
            - 'MyLeaves.ActionBar.ClearButton':
                Control: CanvasComponent
                ComponentName: ButtonComponent
                Properties:
                  X: =Parent.Width * 0.65
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Parent.Width * 0.25
                  Height: =Parent.Height * 0.7
                  Text: ="Bỏ chọn"
                  Size: =FontSizes.Small
                  OnClick: |
                    =Set(varSelectedLeave, Blank());
                    Set(varRecordSelected, false)
                    
            - 'MyLeaves.ActionBar.SelectionIndicator':
                Control: Label
                Properties:
                  X: =Parent.Width * 0.92
                  Y: =(Parent.Height - Self.Height) / 2
                  Width: =Parent.Width * 0.06
                  Height: =Parent.Height * 0.5
                  Text: =If(varRecordSelected, "✓", "")
                  Color: =RGBA(34, 197, 94, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Size: =FontSizes.Large
                  Align: =Align.Center

      # DataTable - Direct Screen child following rules
      - 'MyLeaves.DataTable':
          Control: DataTable
          Variant: DataTable
          Properties:
            X: ='MyLeaves.Navigation'.Width + 'MyLeaves.Content.Container'.Width * 0.02
            Y: ='MyLeaves.Header'.Height + 'MyLeaves.Content.Container'.Height * 0.48
            Width: ='MyLeaves.Content.Container'.Width * 0.96
            Height: ='MyLeaves.Content.Container'.Height * 0.48
            Items: =SortByColumns(Filter(colCurrentUserLeaves, And(Or(IsBlank(varSelectedStatus), TrangThai.Value = varSelectedStatus), Or(IsBlank(varFilterDateFrom), NgayBatDau >= varFilterDateFrom), Or(IsBlank(varFilterDateTo), NgayKetThuc <= varFilterDateTo))), "NgayBatDau", SortOrder.Descending)
            BorderColor: =RGBA(229, 231, 235, 1)
            BorderThickness: =1
            Font: =Font.'Open Sans'
            Size: =FontSizes.Small
            Color: =RGBA(55, 65, 81, 1)
            HeadingColor: =RGBA(255, 255, 255, 1)
            HeadingFill: =RGBA(59, 130, 246, 1)
            HeadingFont: =Font.'Open Sans'
            HeadingFontWeight: =FontWeight.Bold
            HeadingSize: =FontSizes.Base
            NoDataText: ="Không có đơn nghỉ phép nào"
          Children:
            - NgayBatDau_Column:
                Control: DataTableColumn
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Ngày bắt đầu"
                  FieldName: ="NgayBatDau"
                  Order: =1
                  Text: =Text(Parent.Selected.NgayBatDau, "dd/mm/yyyy")
                  OnSelect: |
                    =Set(varSelectedLeave, Parent.Selected);
                    Set(varRecordSelected, true)
            - NgayKetThuc_Column:
                Control: DataTableColumn
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Ngày kết thúc"
                  FieldName: ="NgayKetThuc"
                  Order: =2
                  Text: =Text(Parent.Selected.NgayKetThuc, "dd/mm/yyyy")
                  OnSelect: |
                    =Set(varSelectedLeave, Parent.Selected);
                    Set(varRecordSelected, true)
            - SoNgayNghi_Column:
                Control: DataTableColumn
                Variant: Number
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Số ngày"
                  FieldName: ="SoNgayNghi"
                  Order: =3
                  Text: =Text(Parent.Selected.SoNgayNghi) & " ngày"
                  OnSelect: |
                    =Set(varSelectedLeave, Parent.Selected);
                    Set(varRecordSelected, true)
            - LoaiNghi_Column:
                Control: DataTableColumn
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Loại nghỉ"
                  FieldName: ="MaLoai"
                  Order: =4
                  Text: =If(varIsUserAuthenticated, LookUp(colMyLeavesTypes, Title = Parent.Selected.MaLoai.Value).TenLoai, Switch(Parent.Selected.MaLoai.Value, "ANNUAL", "Nghỉ phép năm", "SICK", "Nghỉ ốm", "PERSONAL", "Việc cá nhân", Parent.Selected.MaLoai.Value))
                  OnSelect: |
                    =Set(varSelectedLeave, Parent.Selected);
                    Set(varRecordSelected, true)
            - LyDo_Column:
                Control: DataTableColumn
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Lý do"
                  FieldName: ="LyDo"
                  Order: =5
                  Text: =If(Len(Parent.Selected.LyDo) > 30, Left(Parent.Selected.LyDo, 27) & "...", Parent.Selected.LyDo)
                  OnSelect: |
                    =Set(varSelectedLeave, Parent.Selected);
                    Set(varRecordSelected, true)
            - TrangThai_Column:
                Control: DataTableColumn
                Variant: Textual
                IsLocked: true
                Properties:
                  FieldDisplayName: ="Trạng thái"
                  FieldName: ="TrangThai"
                  Order: =6
                  Text: =Switch(Parent.Selected.TrangThai.Value, "ChoDuyetCap1", "Chờ duyệt cấp 1", "ChoDuyetCap2", "Chờ duyệt cấp 2", "ChoDuyetCap3", "Chờ duyệt cấp 3", "DaDuyet", "Đã duyệt", "TuChoi", "Từ chối", "Huy", "Đã hủy", "Không xác định")
                  OnSelect: |
                    =Set(varSelectedLeave, Parent.Selected);
                    Set(varRecordSelected, true)

      # Leave Details Modal using GroupContainer
      - 'MyLeaves.Details.Modal':
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - Parent.Width * 0.7) / 2
            Y: =(Parent.Height - Parent.Height * 0.8) / 2
            Width: =Parent.Width * 0.7
            Height: =Parent.Height * 0.8
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =2
            Visible: =varShowDetails
          Children:
            - 'MyLeaves.Details.Header':
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.03
                  Y: =Parent.Height * 0.03
                  Width: =Parent.Width * 0.94
                  Height: =Parent.Height * 0.08
                  Fill: =RGBA(59, 130, 246, 1)
                  BorderColor: =RGBA(37, 99, 235, 1)
                  BorderThickness: =1
                Children:
                  - 'MyLeaves.Details.Title':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.03
                        Y: =(Parent.Height - Parent.Height * 0.6) / 2
                        Width: =Parent.Width * 0.8
                        Height: =Parent.Height * 0.6
                        Text: ="Chi tiết đơn nghỉ phép"
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =FontSizes.Medium
                        
                  - 'MyLeaves.Details.CloseButton':
                      Control: CanvasComponent
                      ComponentName: ButtonComponent
                      Properties:
                        X: =Parent.Width * 0.84
                        Y: =(Parent.Height - Self.Height) / 2
                        Width: =Parent.Width * 0.13
                        Height: =Parent.Height * 0.6
                        Text: ="Đóng"
                        Size: =FontSizes.Small
                        OnClick: |
                          =Set(varShowDetails, false)
                        
            - 'MyLeaves.Details.Content':
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.03
                  Y: ='MyLeaves.Details.Header'.Y + 'MyLeaves.Details.Header'.Height + Parent.Height * 0.02
                  Width: =Parent.Width * 0.94
                  Height: =Parent.Height * 0.84
                  BorderColor: =RGBA(226, 232, 240, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                Children:
                  # Mã đơn
                  - 'MyLeaves.Details.MaDon.Label':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.03
                        Y: =Parent.Height * 0.05
                        Width: =Parent.Width * 0.2
                        Height: =Parent.Height * 0.06
                        Text: ="Mã đơn:"
                        Color: =RGBA(17, 24, 39, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Size: =FontSizes.Base
                        
                  - 'MyLeaves.Details.MaDon.Value':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.25
                        Y: =Parent.Height * 0.05
                        Width: =Parent.Width * 0.7
                        Height: =Parent.Height * 0.06
                        Text: =If(Not(IsBlank(varSelectedLeave)), varSelectedLeave.MaDon, "")
                        Color: =RGBA(55, 65, 81, 1)
                        Font: =Font.'Open Sans'
                        Size: =FontSizes.Base
                        
                  # Loại nghỉ
                  - 'MyLeaves.Details.LoaiNghi.Label':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.03
                        Y: =Parent.Height * 0.15
                        Width: =Parent.Width * 0.2
                        Height: =Parent.Height * 0.06
                        Text: ="Loại nghỉ:"
                        Color: =RGBA(17, 24, 39, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Size: =FontSizes.Base
                        
                  - 'MyLeaves.Details.LoaiNghi.Value':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.25
                        Y: =Parent.Height * 0.15
                        Width: =Parent.Width * 0.7
                        Height: =Parent.Height * 0.06
                        Text: =If(Not(IsBlank(varSelectedLeave)), If(varIsUserAuthenticated, LookUp(colMyLeavesTypes, Title = varSelectedLeave.MaLoai.Value).TenLoai, Switch(varSelectedLeave.MaLoai.Value, "ANNUAL", "Nghỉ phép năm", "SICK", "Nghỉ ốm", "PERSONAL", "Việc cá nhân", varSelectedLeave.MaLoai.Value)), "")
                        Color: =RGBA(55, 65, 81, 1)
                        Font: =Font.'Open Sans'
                        Size: =FontSizes.Base
                        
                  # Thời gian nghỉ
                  - 'MyLeaves.Details.ThoiGian.Label':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.03
                        Y: =Parent.Height * 0.25
                        Width: =Parent.Width * 0.2
                        Height: =Parent.Height * 0.06
                        Text: ="Thời gian nghỉ:"
                        Color: =RGBA(17, 24, 39, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Size: =FontSizes.Base
                        
                  - 'MyLeaves.Details.ThoiGian.Value':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.25
                        Y: =Parent.Height * 0.25
                        Width: =Parent.Width * 0.7
                        Height: =Parent.Height * 0.06
                        Text: =If(Not(IsBlank(varSelectedLeave)), Text(varSelectedLeave.NgayBatDau, "dd/mm/yyyy") & " - " & Text(varSelectedLeave.NgayKetThuc, "dd/mm/yyyy"), "")
                        Color: =RGBA(55, 65, 81, 1)
                        Font: =Font.'Open Sans'
                        Size: =FontSizes.Base
                        
                  # Số ngày nghỉ
                  - 'MyLeaves.Details.SoNgay.Label':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.03
                        Y: =Parent.Height * 0.35
                        Width: =Parent.Width * 0.2
                        Height: =Parent.Height * 0.06
                        Text: ="Số ngày nghỉ:"
                        Color: =RGBA(17, 24, 39, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Size: =FontSizes.Base
                        
                  - 'MyLeaves.Details.SoNgay.Value':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.25
                        Y: =Parent.Height * 0.35
                        Width: =Parent.Width * 0.7
                        Height: =Parent.Height * 0.06
                        Text: =If(Not(IsBlank(varSelectedLeave)), varSelectedLeave.SoNgayNghi & " ngày", "")
                        Color: =RGBA(55, 65, 81, 1)
                        Font: =Font.'Open Sans'
                        Size: =FontSizes.Base
                        
                  # Trạng thái
                  - 'MyLeaves.Details.TrangThai.Label':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.03
                        Y: =Parent.Height * 0.45
                        Width: =Parent.Width * 0.2
                        Height: =Parent.Height * 0.06
                        Text: ="Trạng thái:"
                        Color: =RGBA(17, 24, 39, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Size: =FontSizes.Base
                        
                  - 'MyLeaves.Details.TrangThai.Value':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.25
                        Y: =Parent.Height * 0.45
                        Width: =Parent.Width * 0.7
                        Height: =Parent.Height * 0.06
                        Text: =If(Not(IsBlank(varSelectedLeave)), Switch(varSelectedLeave.TrangThai.Value, "ChoDuyetCap1", "Chờ phê duyệt cấp 1", "ChoDuyetCap2", "Chờ phê duyệt cấp 2", "ChoDuyetCap3", "Chờ phê duyệt cấp 3", "DaDuyet", "Đã phê duyệt", "TuChoi", "Bị từ chối", "Huy", "Đã hủy", varSelectedLeave.TrangThai.Value), "")
                        Color: =If(And(Not(IsBlank(varSelectedLeave)), Not(IsBlank(varSelectedLeave.TrangThai.Value))), Switch(varSelectedLeave.TrangThai.Value, "ChoDuyetCap1", RGBA(180, 83, 9, 1), "ChoDuyetCap2", RGBA(180, 83, 9, 1), "ChoDuyetCap3", RGBA(180, 83, 9, 1), "DaDuyet", RGBA(21, 128, 61, 1), "TuChoi", RGBA(220, 38, 38, 1), "Huy", RGBA(107, 114, 128, 1), RGBA(55, 65, 81, 1)), RGBA(55, 65, 81, 1))
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Size: =FontSizes.Base
                        
                  # Buổi nghỉ
                  - 'MyLeaves.Details.BuoiNghi.Label':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.03
                        Y: =Parent.Height * 0.55
                        Width: =Parent.Width * 0.2
                        Height: =Parent.Height * 0.06
                        Text: ="Buổi nghỉ:"
                        Color: =RGBA(17, 24, 39, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Size: =FontSizes.Base
                        
                  - 'MyLeaves.Details.BuoiNghi.Value':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.25
                        Y: =Parent.Height * 0.55
                        Width: =Parent.Width * 0.7
                        Height: =Parent.Height * 0.06
                        Text: =If(Not(IsBlank(varSelectedLeave)), Switch(varSelectedLeave.BuoiNghi.Value, "CaNgay", "Cả ngày", "Sang", "Buổi sáng", "Chieu", "Buổi chiều", varSelectedLeave.BuoiNghi.Value), "")
                        Color: =RGBA(55, 65, 81, 1)
                        Font: =Font.'Open Sans'
                        Size: =FontSizes.Base
                        
                  # Lý do nghỉ
                  - 'MyLeaves.Details.LyDo.Label':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.03
                        Y: =Parent.Height * 0.65
                        Width: =Parent.Width * 0.2
                        Height: =Parent.Height * 0.06
                        Text: ="Lý do nghỉ:"
                        Color: =RGBA(17, 24, 39, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Size: =FontSizes.Base
                        
                  - 'MyLeaves.Details.LyDo.Value':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.25
                        Y: =Parent.Height * 0.65
                        Width: =Parent.Width * 0.7
                        Height: =Parent.Height * 0.25
                        Text: =If(Not(IsBlank(varSelectedLeave)), varSelectedLeave.LyDo, "")
                        Color: =RGBA(55, 65, 81, 1)
                        Font: =Font.'Open Sans'
                        Size: =FontSizes.Base
                        Wrap: =true

      # Loading Indicator
      - 'MyLeaves.Loading.Overlay':
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 0, 0, 0.3)
            Visible: =varDataLoading
            
      # Loading Message Container
      - 'MyLeaves.Loading.Container':
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - Parent.Width * 0.3) / 2
            Y: =(Parent.Height - Parent.Height * 0.2) / 2
            Width: =Parent.Width * 0.3
            Height: =Parent.Height * 0.2
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(59, 130, 246, 1)
            BorderThickness: =2
            Visible: =varDataLoading
          Children:
            - 'MyLeaves.Loading.Message':
                Control: Label
                Properties:
                  X: =Parent.Width * 0.1
                  Y: =(Parent.Height - Parent.Height * 0.4) / 2
                  Width: =Parent.Width * 0.8
                  Height: =Parent.Height * 0.4
                  Text: ="Đang tải dữ liệu..."
                  Color: =RGBA(59, 130, 246, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Size: =FontSizes.Medium
                  Align: =Align.Center

      # Network Error Message
      - 'MyLeaves.NetworkError.Container':
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - Parent.Width * 0.5) / 2
            Y: =(Parent.Height - Parent.Height * 0.3) / 2
            Width: =Parent.Width * 0.5
            Height: =Parent.Height * 0.3
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(239, 68, 68, 1)
            BorderThickness: =2
            Visible: =varNetworkError
          Children:
            - 'MyLeaves.NetworkError.Message':
                Control: Label
                Properties:
                  X: =Parent.Width * 0.1
                  Y: =Parent.Height * 0.2
                  Width: =Parent.Width * 0.8
                  Height: =Parent.Height * 0.4
                  Text: ="Không thể kết nối đến máy chủ. Vui lòng kiểm tra kết nối mạng và thử lại."
                  Color: =RGBA(239, 68, 68, 1)
                  Font: =Font.'Open Sans'
                  Size: =FontSizes.Base
                  Align: =Align.Center
                  Wrap: =true
                  
            - 'MyLeaves.NetworkError.RetryButton':
                Control: CanvasComponent
                ComponentName: ButtonComponent
                Properties:
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height * 0.65
                  Width: =Parent.Width * 0.3
                  Height: =Parent.Height * 0.15
                  Text: ="Thử lại"
                  Size: =FontSizes.Small
                  OnClick: |
                    =Set(varNetworkError, false);
                    Navigate(MyLeavesScreen)

      # Cancel Confirmation Modal Overlay
      - 'MyLeaves.Cancel.Overlay':
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(0, 0, 0, 0.5)
            Visible: =varShowCancelConfirm
            OnSelect: |
              =Set(varShowCancelConfirm, false)
            
      # Cancel Confirmation Modal
      - 'MyLeaves.Cancel.Modal':
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - Parent.Width * 0.4) / 2
            Y: =(Parent.Height - Parent.Height * 0.3) / 2
            Width: =Parent.Width * 0.4
            Height: =Parent.Height * 0.3
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =2
            Visible: =varShowCancelConfirm
          Children:
            - 'MyLeaves.Cancel.Header':
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.04
                  Y: =Parent.Height * 0.04
                  Width: =Parent.Width * 0.92
                  Height: =Parent.Height * 0.15
                  Fill: =RGBA(239, 68, 68, 1)
                  BorderColor: =RGBA(220, 38, 38, 1)
                  BorderThickness: =1
                Children:
                  - 'MyLeaves.Cancel.Title':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.05
                        Y: =(Parent.Height - Parent.Height * 0.7) / 2
                        Width: =Parent.Width * 0.9
                        Height: =Parent.Height * 0.7
                        Text: ="Xác nhận hủy đơn"
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =FontSizes.Medium
                        Align: =Align.Center
                  
            - 'MyLeaves.Cancel.Content':
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.04
                  Y: ='MyLeaves.Cancel.Header'.Y + 'MyLeaves.Cancel.Header'.Height + Parent.Height * 0.03
                  Width: =Parent.Width * 0.92
                  Height: =Parent.Height * 0.4
                Children:
                  - 'MyLeaves.Cancel.Message':
                      Control: Label
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.Width
                        Height: =Parent.Height
                        Text: =Concatenate("Bạn có chắc chắn muốn hủy đơn nghỉ phép từ ngày ", If(Not(IsBlank(varSelectedLeave)), Text(varSelectedLeave.NgayBatDau, "dd/mm/yyyy"), ""), " đến ", If(Not(IsBlank(varSelectedLeave)), Text(varSelectedLeave.NgayKetThuc, "dd/mm/yyyy"), ""), "?", Char(10), Char(10), "Hành động này không thể hoàn tác.")
                        Color: =RGBA(55, 65, 81, 1)
                        Font: =Font.'Open Sans'
                        Size: =FontSizes.Small
                        Align: =Align.Center
                        Wrap: =true
                  
            - 'MyLeaves.Cancel.Actions':
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.04
                  Y: ='MyLeaves.Cancel.Content'.Y + 'MyLeaves.Cancel.Content'.Height + Parent.Height * 0.03
                  Width: =Parent.Width * 0.92
                  Height: =Parent.Height * 0.25
                Children:
                  - 'MyLeaves.Cancel.CancelButton':
                      Control: CanvasComponent
                      ComponentName: ButtonComponent
                      Properties:
                        X: =0
                        Y: =(Parent.Height - Self.Height) / 2
                        Width: =Parent.Width * 0.45
                        Height: =Parent.Height * 0.8
                        Text: ="Không"
                        Size: =FontSizes.Medium
                        OnClick: |
                          =Set(varShowCancelConfirm, false)
                        
                  - 'MyLeaves.Cancel.ConfirmButton':
                      Control: CanvasComponent
                      ComponentName: ButtonComponent
                      Properties:
                        X: =Parent.Width * 0.55
                        Y: =(Parent.Height - Self.Height) / 2
                        Width: =Parent.Width * 0.45
                        Height: =Parent.Height * 0.8
                        Text: ="Hủy đơn"
                        Size: =FontSizes.Medium
                        OnClick: |
                          =If(Not(IsBlank(varSelectedLeave)),
                            Patch(DonNghiPhep, varSelectedLeave, {TrangThai: {Value: "Huy"}});
                            Set(varCancelMessage, "Đã hủy đơn nghỉ phép thành công!");
                            Set(varShowCancelConfirm, false);
                            Set(varCurrentUserLeaves, Filter(DonNghiPhep, And(Not(IsBlank(MaNguoiDung.Value)), MaNguoiDung.Value = UserSessionANP.Id)));
                            Notify(varCancelMessage, NotificationType.Success),
                            Notify("Có lỗi xảy ra khi hủy đơn", NotificationType.Error)
                          )
