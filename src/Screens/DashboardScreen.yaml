  Screens:
    DashboardScreen:
      Properties:
        Fill: =RGBA(248, 250, 252, 1)
        OnVisible: |
          =//Set active screen for navigation
          Set(varActiveScreen, "Dashboard");
          //Initialize navigation variables
          Set(varNavCollapsed, false); 
          Set(varMobileMenuOpen, false);
          
          //Check user permissions using CheckPermission function from App/Formulas
          Set(varUserPermissions, {
            CanViewPersonalLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.PERSONAL_LEAVE),
            CanCreateSpecialLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.SPECIAL_LEAVE),
            CanViewTeamLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_TEAM_LEAVE),
            CanViewAllLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_ALL_LEAVE),
            CanApproveLevel1: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_1),
            CanApproveLevel2: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_2),
            CanApproveLevel3: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_3),
            CanViewDashboard: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_DASHBOARD),
            CanExportReports: CheckPermission(UserSessionANP.Permission, UserPermissions.EXPORT_REPORTS),
            CanManageUsers: CheckPermission(UserSessionANP.Permission, UserPermissions.MANAGE_USERS),
            CanRecordLeave: CheckPermission(UserSessionANP.Permission, UserPermissions.RECORD_LEAVE),
            CanManageRoles: CheckPermission(UserSessionANP.Permission, UserPermissions.MANAGE_ROLES),
            IsSystemAdmin: CheckPermission(UserSessionANP.Permission, UserPermissions.SYSTEM_ADMIN)
          });
          
          //CRITICAL: Check if user can access dashboard - Admin always has access
          Set(varCanAccessDashboard, Or(
            varUserPermissions.CanViewDashboard, 
            varUserPermissions.CanViewPersonalLeaves, 
            varUserPermissions.CanViewAllLeaves,
            varUserPermissions.IsSystemAdmin,
            UserSessionANP.MaVaiTro = "Admin"
          ));
          
          //Debug: Check UserSessionANP values
          Set(varDebugInfo, {
            Permission: UserSessionANP.Permission,
            Role: UserSessionANP.MaVaiTro,
            CanViewDash: varUserPermissions.CanViewDashboard,
            CanAccess: varCanAccessDashboard
          });
          
          //Use UserSessionANP data directly
          Set(varUser, {
            Id: UserSessionANP.Id,
            Name: UserSessionANP.HoTen, 
            Email: UserSessionANP.Email,
            Role: UserSessionANP.Role,
            MaVaiTro: UserSessionANP.MaVaiTro,
            HoTen: UserSessionANP.HoTen,
            ChucDanh: UserSessionANP.ChucDanh,
            MaDonVi: UserSessionANP.MaDonVi,
            Permission: UserSessionANP.Permission
          });
          
          //Load leave balance data from SharePoint SoNgayPhep
          If(varCanAccessDashboard,
            //Get leave balance data based on user permissions
            If(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers),
              //Admin/HR - view all company leave data
              ClearCollect(colAllLeaveBalance, SoNgayPhep);
              Set(varTotalLeaveBalance, Sum(colAllLeaveBalance, TongNgayDuocPhep));
              Set(varUsedLeaveBalance, Sum(colAllLeaveBalance, SoNgayDaNghi));
              Set(varRemainingLeaveBalance, Sum(colAllLeaveBalance, SoNgayConLai)),
              //Regular user - view personal leave data only
              ClearCollect(colUserLeaveBalance, Filter(SoNgayPhep, MaNhanVien.Value = UserSessionANP.Id));
              Set(varTotalLeaveBalance, Sum(colUserLeaveBalance, TongNgayDuocPhep));
              Set(varUsedLeaveBalance, Sum(colUserLeaveBalance, SoNgayDaNghi));
              Set(varRemainingLeaveBalance, Sum(colUserLeaveBalance, SoNgayConLai))
            ),
            //No permission - clear data
            Set(varTotalLeaveBalance, 0);
            Set(varUsedLeaveBalance, 0);
            Set(varRemainingLeaveBalance, 0)
          );
          
          //Load leave request status counts from SharePoint DonNghiPhep
          If(varCanAccessDashboard,
            //Get leave request data based on user permissions
            If(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers),
              //Admin/HR - view all company leave requests
              ClearCollect(colAllLeaveRequests, DonNghiPhep);
              Set(varPendingRequestsCount, CountRows(Filter(colAllLeaveRequests, Or(TrangThai.Value = "ChoDuyetCap1", TrangThai.Value = "ChoDuyetCap2", TrangThai.Value = "ChoDuyetCap3"))));
              Set(varApprovedRequestsCount, CountRows(Filter(colAllLeaveRequests, TrangThai.Value = "DaDuyet")));
              Set(varRejectedRequestsCount, CountRows(Filter(colAllLeaveRequests, TrangThai.Value = "TuChoi"))),
              //Regular user - view personal leave requests only
              ClearCollect(colUserLeaveRequests, Filter(DonNghiPhep, MaNguoiDung.Value = UserSessionANP.Id));
              Set(varPendingRequestsCount, CountRows(Filter(colUserLeaveRequests, Or(TrangThai.Value = "ChoDuyetCap1", TrangThai.Value = "ChoDuyetCap2", TrangThai.Value = "ChoDuyetCap3"))));
              Set(varApprovedRequestsCount, CountRows(Filter(colUserLeaveRequests, TrangThai.Value = "DaDuyet")));
              Set(varRejectedRequestsCount, CountRows(Filter(colUserLeaveRequests, TrangThai.Value = "TuChoi")))
            ),
            //No permission - clear data
            Set(varPendingRequestsCount, 0);
            Set(varApprovedRequestsCount, 0);
            Set(varRejectedRequestsCount, 0)
          );
          
          //Set dashboard statistics using SharePoint data
          Set(varDashboardStats, {
            TotalLeave: varTotalLeaveBalance,
            UsedLeave: varUsedLeaveBalance,
            RemainingLeave: varRemainingLeaveBalance,
            PendingRequests: varPendingRequestsCount,
            ApprovedRequests: varApprovedRequestsCount,
            RejectedRequests: varRejectedRequestsCount
          });
          
          //Load pending approvals count from SharePoint based on user permissions
          Set(varPendingApprovalsCount, 
            If(Or(varUserPermissions.CanApproveLevel1, varUserPermissions.CanApproveLevel2, varUserPermissions.CanApproveLevel3),
              CountRows(
                Filter(DonNghiPhep, 
                  Or(
                    And(varUserPermissions.CanApproveLevel1, TrangThai.Value = "ChoDuyetCap1"),
                    And(varUserPermissions.CanApproveLevel2, TrangThai.Value = "ChoDuyetCap2"), 
                    And(varUserPermissions.CanApproveLevel3, TrangThai.Value = "ChoDuyetCap3")
                  )
                )
              ),
              0
            )
          );
          
          //Load recent leave requests from SharePoint
          If(varCanAccessDashboard,
            //Get recent leave requests based on permissions
            If(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers),
              //Admin/HR - get all recent leave requests
              ClearCollect(colRecentLeaves, 
                Sort(
                  FirstN(DonNghiPhep, 20),
                  NgayBatDau, 
                  SortOrder.Descending
                )
              ),
              //Regular user - get personal recent leave requests
              ClearCollect(colRecentLeaves, 
                Sort(
                  Filter(DonNghiPhep, MaNguoiDung.Value = UserSessionANP.Id),
                  NgayBatDau, 
                  SortOrder.Descending
                )
              )
            );
            Set(varRecentLeavesCount, CountRows(colRecentLeaves)),
            //No permission - clear data
            ClearCollect(colRecentLeaves, Blank());
            Set(varRecentLeavesCount, 0)
          );
          
          //Load chart data from SharePoint for last 6 months
          If(varCanAccessDashboard,
            //Create monthly statistics from SharePoint data
            ClearCollect(colMonthlyStats,
              ForAll(
                [1, 2, 3, 4, 5, 6],
                With(
                  {
                    MonthNum: Value,
                    MonthRequests: If(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers),
                      Filter(DonNghiPhep, Month(NgayBatDau) = Value And Year(NgayBatDau) = Year(Today())),
                      Filter(DonNghiPhep, Month(NgayBatDau) = Value And Year(NgayBatDau) = Year(Today()) And MaNguoiDung.Value = UserSessionANP.Id)
                    )
                  },
                  {
                    Month: Switch(MonthNum, 1, "T1", 2, "T2", 3, "T3", 4, "T4", 5, "T5", 6, "T6", "T" & MonthNum),
                    Approved: CountRows(Filter(MonthRequests, TrangThai.Value = "DaDuyet")),
                    Pending: CountRows(Filter(MonthRequests, Or(TrangThai.Value = "ChoDuyetCap1", TrangThai.Value = "ChoDuyetCap2", TrangThai.Value = "ChoDuyetCap3"))),
                    Rejected: CountRows(Filter(MonthRequests, TrangThai.Value = "TuChoi"))
                  }
                )
              )
            ),
            //No permission - clear chart data
            ClearCollect(colMonthlyStats, Blank())
          );
          
          //Start authentication check
          Set(varAuthTimerStart, true)
      Children:
        # Authentication Check Timer
        - 'Dashboard.AuthTimer':
            Control: Timer
            Properties:
              X: =0
              Y: =0
              Width: =1
              Height: =1
              Duration: =100
              AutoStart: =varAuthTimerStart
              Visible: =false
              OnTimerEnd: |
                =//Reset timer flag
                Set(varAuthTimerStart, false);
                //Check authentication: If not logged in, redirect to login
                If(Not(varIsUserAuthenticated),
                  Navigate(LoginScreen),
                  //Continue with dashboard - user is authenticated
                  Set(varAuthenticationValid, true)
                )
        
        - 'Dashboard.Header':
            Control: CanvasComponent
            ComponentName: HeaderComponent
            Properties:
              X: =0
              Y: =0
              Width: =Parent.Width
              Height: =Parent.Height * 0.065
              UserName: =UserSessionANP.HoTen
              UserRole: =UserSessionANP.MaVaiTro
              ShowNotification: =true
              NotificationCount: =varPendingApprovalsCount
              OnLogout: |
                =//Clear authentication flag
                Set(varIsUserAuthenticated, false);
                //Clear UserSessionANP data with correct structure
                Set(UserSessionANP, {
                  Id: "",
                  HoTen: "",
                  Email: "",
                  MaVaiTro: "",
                  Permission: 0,
                  NguoiQuanLyId: "",
                  ChucDanh: "",
                  MaDonVi: "",
                  TrangThai: "",
                  Name: "",
                  Role: ""
                });
                //Navigate to login
                Navigate(LoginScreen)
        
        - 'Dashboard.Navigation':
            Control: CanvasComponent
            ComponentName: NavigationComponent
            Properties:
              X: =0
              Y: ='Dashboard.Header'.Height
              Width: =If(varNavCollapsed, App.Width * 0.045, App.Width * 0.14)
              Height: =Parent.Height - 'Dashboard.Header'.Height
              UserRole: =UserSessionANP.MaVaiTro
              ActiveScreen: =If(IsBlank(varActiveScreen), "Dashboard", varActiveScreen)
              IsCollapsed: =varNavCollapsed
              DashboardScreen: =DashboardScreen
              LeaveRequestScreen: =LeaveRequestScreen
              MyLeavesScreen: =MyLeavesScreen
              CalendarScreen: =CalendarScreen
              ManagementScreen: =ManagementScreen
              ReportsScreen: =ReportsScreen
              ProfileScreen: =ProfileScreen
              OnNavigate: |
                =Set(varActiveScreen, ScreenName);
                Switch(ScreenName,
                  "Dashboard", Navigate(DashboardScreen),
                  "LeaveRequest", Navigate(LeaveRequestScreen),
                  "MyLeaves", Navigate(MyLeavesScreen),
                  "Calendar", Navigate(CalendarScreen),
                  "Management", Navigate(ManagementScreen),
                  "Profile", Navigate(ProfileScreen),
                  "Approval", Navigate(ApprovalScreen),
                  "Reports", Navigate(ReportsScreen)
                )
              OnToggleCollapse: |
                =Set(varNavCollapsed, !varNavCollapsed)

        - 'Dashboard.Content.Container':    
            Control: GroupContainer
            Variant: ManualLayout
            Properties:
              X: ='Dashboard.Navigation'.Width
              Y: ='Dashboard.Header'.Height
              Width: =Parent.Width - 'Dashboard.Navigation'.Width
              Height: =Parent.Height - 'Dashboard.Header'.Height
              Visible: =varCanAccessDashboard
            Children:
              - 'Dashboard.Content.Padded':
                  Control: GroupContainer
                  Variant: ManualLayout
                  Properties:
                    X: =Parent.Width * 0.01
                    Y: =Parent.Height * 0.01
                    Width: =Parent.Width * 0.98
                    Height: =Parent.Height * 0.98
                  Children:
                    - 'Dashboard.Content.Welcome':
                        Control: GroupContainer
                        Variant: ManualLayout
                        Properties:
                          X: =0
                          Y: =0
                          Width: =Parent.Width
                          Height: =Parent.Height * 0.1
                        Children:
                          - 'Dashboard.Content.Welcome.Background':
                              Control: Rectangle
                              Properties:
                                X: =0
                                Y: =0
                                Width: =Parent.Width
                                Height: =Parent.Height
                                Fill: =RGBA(255, 255, 255, 1)
                                BorderColor: =RGBA(226, 232, 240, 1)
                                BorderThickness: =1
                                
                          - 'Dashboard.Content.Welcome.Icon':
                              Control: Classic/Icon
                              Properties:
                                X: =Parent.Width * 0.015
                                Y: =Parent.Height * 0.25
                                Width: =Parent.Height * 0.2
                                Height: =Parent.Height * 0.2
                                Icon: =Icon.Home
                                Color: =RGBA(59, 130, 246, 1)
                                
                          - 'Dashboard.Content.Title':
                              Control: Label
                              Properties:
                                X: =Parent.Width * 0.015 + 'Dashboard.Content.Welcome.Icon'.Width + Parent.Width * 0.01
                                Y: =Parent.Height * 0.2
                                Width: =Parent.Width * 0.8
                                Height: =Parent.Height * 0.35
                                Text: ="Chào mừng quay trở lại, " & UserSessionANP.HoTen
                                Color: =RGBA(17, 24, 39, 1)
                                Font: =Font.'Open Sans'
                                FontWeight: =FontWeight.Bold
                                Size: =FontSizes.Medium
                                
                          - 'Dashboard.Content.Subtitle':
                              Control: Label
                              Properties:
                                X: =Parent.Width * 0.015 + 'Dashboard.Content.Welcome.Icon'.Width + Parent.Width * 0.01
                                Y: =Parent.Height * 0.6
                                Width: =Parent.Width * 0.8
                                Height: =Parent.Height * 0.25
                                Text: ="Phòng ban:" & " " & UserSessionANP.MaDonVi & " • " & "Chức danh:" & " " & UserSessionANP.ChucDanh
                                Color: =RGBA(75, 85, 99, 1)
                                Font: =Font.'Open Sans'
                                Size: =FontSizes.Small
              
              - 'Dashboard.Stats.Container':
                  Control: GroupContainer
                  Variant: ManualLayout
                  Properties:
                    X: =0
                    Y: ='Dashboard.Content.Welcome'.Y + 'Dashboard.Content.Welcome'.Height + Parent.Height * 0.015
                    Width: =Parent.Width
                    Height: =Parent.Height * 0.35
                    Visible: =true
                  Children:
                    - 'Dashboard.Stats.Background':
                        Control: Rectangle
                        Properties:
                          X: =0
                          Y: =0
                          Width: =Parent.Width
                          Height: =Parent.Height
                          Fill: =RGBA(255, 255, 255, 1)
                          BorderColor: =RGBA(226, 232, 240, 1)
                          BorderThickness: =1
                          
                    - 'Dashboard.Stats.Header':
                        Control: Label
                        Properties:
                          X: =Parent.Width * 0.015
                          Y: =Parent.Height * 0.05
                          Width: =Parent.Width * 0.97
                          Height: =Parent.Height * 0.1
                          Text: =If(varUserPermissions.CanViewAllLeaves, "Tổng quan nghỉ phép toàn công ty", "Tổng quan nghỉ phép")
                          Color: =RGBA(17, 24, 39, 1)
                          Font: =Font.'Open Sans'
                          FontWeight: =FontWeight.Bold
                          Size: =FontSizes.Medium
                          
                    - 'Dashboard.Stats.LeaveBalance.Container':
                        Control: GroupContainer
                        Variant: ManualLayout
                        Properties:
                          X: =Parent.Width * 0.015
                          Y: =Parent.Height * 0.18
                          Width: =Parent.Width * 0.97
                          Height: =Parent.Height * 0.34
                          Visible: =Or(varUserPermissions.CanViewPersonalLeaves, varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers)
                        Children:
                          - 'Dashboard.Stats.TotalLeave':
                              Control: CanvasComponent
                              ComponentName: StatsCardComponent
                              Properties:
                                X: =0
                                Y: =0
                                Width: =Parent.Width / 3 - Parent.Width * 0.01
                                Height: =Parent.Height
                                Title: =If(varUserPermissions.CanViewAllLeaves, "Tổng ngày phép (Toàn CT)", "Tổng ngày phép")
                                Value: =varDashboardStats.TotalLeave
                                Icon: =Icon.CalendarBlank
                                Color: =RGBA(59, 130, 246, 1)
                                
                          - 'Dashboard.Stats.UsedLeave':
                              Control: CanvasComponent
                              ComponentName: StatsCardComponent
                              Properties:
                                X: =Parent.Width / 3 + Parent.Width * 0.005
                                Y: =0
                                Width: =Parent.Width / 3 - Parent.Width * 0.01
                                Height: =Parent.Height
                                Title: =If(varUserPermissions.CanViewAllLeaves, "Đã sử dụng (Toàn CT)", "Đã sử dụng")
                                Value: =varDashboardStats.UsedLeave
                                Icon: =Icon.CheckBadge
                                Color: =RGBA(34, 197, 94, 1)
                                
                          - 'Dashboard.Stats.RemainingLeave':
                              Control: CanvasComponent
                              ComponentName: StatsCardComponent
                              Properties:
                                X: =Parent.Width * 2 / 3 + Parent.Width * 0.01
                                Y: =0
                                Width: =Parent.Width / 3 - Parent.Width * 0.01
                                Height: =Parent.Height
                                Title: =If(varUserPermissions.CanViewAllLeaves, "Còn lại (Toàn CT)", "Còn lại")
                                Value: =varDashboardStats.RemainingLeave
                                Icon: =Icon.Clock
                                Color: =RGBA(251, 191, 36, 1)
                                
                    - 'Dashboard.Stats.RequestStatus.Container':
                        Control: GroupContainer
                        Variant: ManualLayout
                        Properties:
                          X: =Parent.Width * 0.015
                          Y: =Parent.Height * 0.58
                          Width: =Parent.Width * 0.97
                          Height: =Parent.Height * 0.34
                        Children:
                          - 'Dashboard.Stats.PendingRequests':
                              Control: CanvasComponent
                              ComponentName: StatsCardComponent
                              Properties:
                                X: =0
                                Y: =0
                                Width: =Parent.Width / 3 - Parent.Width * 0.01
                                Height: =Parent.Height
                                Title: ="Đang chờ duyệt"
                                Value: =varDashboardStats.PendingRequests
                                Icon: =Icon.CalendarBlank
                                Color: =RGBA(251, 191, 36, 1)
                                
                          - 'Dashboard.Stats.ApprovedRequests':
                              Control: CanvasComponent
                              ComponentName: StatsCardComponent
                              Properties:
                                X: =Parent.Width / 3 + Parent.Width * 0.005
                                Y: =0
                                Width: =Parent.Width / 3 - Parent.Width * 0.01
                                Height: =Parent.Height
                                Title: ="Đã được duyệt"
                                Value: =varDashboardStats.ApprovedRequests
                                Icon: =Icon.CheckBadge
                                Color: =RGBA(34, 197, 94, 1)
                                
                          - 'Dashboard.Stats.RejectedRequests':
                              Control: CanvasComponent
                              ComponentName: StatsCardComponent
                              Properties:
                                X: =Parent.Width * 2 / 3 + Parent.Width * 0.01
                                Y: =0
                                Width: =Parent.Width / 3 - Parent.Width * 0.01
                                Height: =Parent.Height
                                Title: ="Bị từ chối"
                                Value: =varDashboardStats.RejectedRequests
                                Icon: =Icon.Cancel
                                Color: =RGBA(239, 68, 68, 1)
              
              # Limited Permission Message - hiển thị khi user có ít quyền
              - 'Dashboard.LimitedPermission.Container':
                  Control: GroupContainer
                  Variant: ManualLayout
                  Properties:
                    X: =0
                    Y: ='Dashboard.Stats.Container'.Y + 'Dashboard.Stats.Container'.Height + Parent.Height * 0.015
                    Width: =Parent.Width
                    Height: =Parent.Height * 0.12
                    Visible: =Not(Or(varUserPermissions.CanViewPersonalLeaves, varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers))
                  Children:
                    - 'Dashboard.LimitedPermission.Background':
                        Control: Rectangle
                        Properties:
                          X: =0
                          Y: =0
                          Width: =Parent.Width
                          Height: =Parent.Height
                          Fill: =RGBA(255, 248, 220, 1)
                          BorderColor: =RGBA(251, 191, 36, 1)
                          BorderThickness: =1
                          
                    - 'Dashboard.LimitedPermission.Icon':
                        Control: Classic/Icon
                        Properties:
                          X: =Parent.Width * 0.03
                          Y: =(Parent.Height - Self.Width) / 2
                          Width: =Parent.Height * 0.4
                          Height: =Parent.Height * 0.4
                          Icon: =Icon.Information
                          Color: =RGBA(251, 191, 36, 1)
                          
                    - 'Dashboard.LimitedPermission.Message':
                        Control: Label
                        Properties:
                          X: =Parent.Width * 0.1
                          Y: =Parent.Height * 0.15
                          Width: =Parent.Width * 0.85
                          Height: =Parent.Height * 0.7
                          Text: ="Quyền hạn của bạn bị giới hạn. Một số tính năng có thể không hiển thị đầy đủ. Liên hệ quản trị viên để được cấp thêm quyền."
                          Color: =RGBA(180, 83, 9, 1)
                          Font: =Font.'Open Sans'
                          FontWeight: =FontWeight.Normal
                          Size: =FontSizes.Base
                          Align: =Align.Left
                          Wrap: =true
              
              - 'Dashboard.LeaveStats.Container':
                  Control: GroupContainer
                  Variant: ManualLayout
                  Properties:
                    X: =0
                    Y: ='Dashboard.LimitedPermission.Container'.Y + 'Dashboard.LimitedPermission.Container'.Height + Parent.Height * 0.015
                    Width: =Parent.Width
                    Height: =Parent.Height * 0.32
                    Visible: =true
                  Children:
                    - 'Dashboard.LeaveStats.Background':
                        Control: Rectangle
                        Properties:
                          X: =0
                          Y: =0
                          Width: =Parent.Width
                          Height: =Parent.Height
                          Fill: =RGBA(255, 255, 255, 1)
                          BorderColor: =RGBA(226, 232, 240, 1)
                          BorderThickness: =1
                          
                    - 'Dashboard.LeaveStats.Header.Container':
                        Control: GroupContainer
                        Variant: ManualLayout
                        Properties:
                          X: =Parent.Width * 0.015
                          Y: =Parent.Height * 0.03
                          Width: =Parent.Width * 0.97
                          Height: =Parent.Height * 0.12
                        Children:
                          - 'Dashboard.LeaveStats.Title':
                              Control: Label
                              Properties:
                                X: =0
                                Y: =0
                                Width: =Parent.Width * 0.7
                                Height: =Parent.Height
                                Text: =If(varUserPermissions.CanViewAllLeaves, "Tình hình nghỉ phép toàn công ty 6 tháng gần đây", "Tình hình nghỉ phép 6 tháng gần đây")
                                Color: =RGBA(17, 24, 39, 1)
                                Font: =Font.'Open Sans'
                                FontWeight: =FontWeight.Bold
                                Size: =FontSizes.Medium
                                
                          - 'Dashboard.LeaveStats.ViewAll':
                              Control: CanvasComponent
                              ComponentName: ButtonComponent
                              Properties:
                                X: =Parent.Width * 0.6
                                Y: =(Parent.Height - Self.Height) / 2
                                Width: =Parent.Width * 0.18
                                Height: =Parent.Height * 0.55
                                Text: ="Xem chi tiết"
                                Size: ="Small"
                                Visible: =Or(varUserPermissions.CanViewPersonalLeaves, varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers)
                                OnClick: =Navigate(ReportsScreen)
                                
                    - 'Dashboard.LeaveStats.Chart':
                        Control: LineChart
                        Properties:
                          X: =Parent.Width * 0.015
                          Y: =Parent.Height * 0.18
                          Width: =Parent.Width * 0.97
                          Height: =Parent.Height * 0.79
                          Items: =colMonthlyStats
                          Visible: =Or(varUserPermissions.CanViewPersonalLeaves, varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers)

        - 'Dashboard.AccessDenied.Container':
            Control: GroupContainer
            Variant: ManualLayout
            Properties:
              X: ='Dashboard.Navigation'.Width
              Y: ='Dashboard.Header'.Height
              Width: =Parent.Width - 'Dashboard.Navigation'.Width
              Height: =Parent.Height - 'Dashboard.Header'.Height
              Visible: =Not(varCanAccessDashboard)
            Children:
              - 'Dashboard.AccessDenied.Background':
                  Control: Rectangle
                  Properties:
                    X: =0
                    Y: =0
                    Width: =Parent.Width
                    Height: =Parent.Height
                    Fill: =RGBA(255, 255, 255, 1)
                    BorderColor: =RGBA(226, 232, 240, 1)
                    BorderThickness: =1

              - 'Dashboard.AccessDenied.Content':
                  Control: GroupContainer
                  Variant: ManualLayout
                  Properties:
                    X: =Parent.Width * 0.2
                    Y: =Parent.Height * 0.3
                    Width: =Parent.Width * 0.6
                    Height: =Parent.Height * 0.4
                  Children:
                    - 'Dashboard.AccessDenied.Icon':
                        Control: Classic/Icon
                        Properties:
                          X: =(Parent.Width - Self.Width) / 2
                          Y: =0
                          Width: =Parent.Width * 0.08
                          Height: =Parent.Width * 0.08
                          Icon: =Icon.Lock
                          Color: =RGBA(239, 68, 68, 1)
                        
                    - 'Dashboard.AccessDenied.Title':
                        Control: Label
                        Properties:
                          X: =0
                          Y: =Parent.Height * 0.12
                          Width: =Parent.Width
                          Height: =Parent.Height * 0.08
                          Text: ="Không có quyền truy cập"
                          Color: =RGBA(17, 24, 39, 1)
                          Font: =Font.'Open Sans'
                          FontWeight: =FontWeight.Bold
                          Size: =FontSizes.XLarge
                          Align: =Align.Center
                    
                    - 'Dashboard.AccessDenied.Message':
                        Control: Label
                        Properties:
                          X: =0
                          Y: =Parent.Height * 0.22
                          Width: =Parent.Width
                          Height: =Parent.Height * 0.15
                          Text: ="Bạn không có quyền truy cập vào Dashboard. Vui lòng liên hệ quản trị viên để được cấp quyền."
                          Color: =RGBA(107, 114, 128, 1)
                          Font: =Font.'Open Sans'
                          FontWeight: =FontWeight.Normal
                          Size: =FontSizes.Medium
                          Align: =Align.Center
                          Wrap: =true

                    - 'Dashboard.AccessDenied.BackButton':
                        Control: CanvasComponent
                        ComponentName: ButtonComponent
                        Properties:
                          X: =(Parent.Width - Self.Width) / 2
                          Y: =Parent.Height * 0.4
                          Width: =Parent.Width * 0.3
                          Height: =Parent.Height * 0.08
                          Text: ="Đi tới Hồ sơ"
                          Size: ="Medium"
                          OnClick: =Navigate(ProfileScreen)

