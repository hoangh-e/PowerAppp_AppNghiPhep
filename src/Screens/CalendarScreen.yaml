Screens:
  CalendarScreen:
    Properties:
      Fill: =RGBA(248, 250, 252, 1)
      OnVisible: |
        =Set(varActiveScreen, "Calendar");
        Set(varNetworkError, false);
        Set(varDemoMode, false);
        Set(varDataLoading, true);
        Set(varCurrentDate, Today());
        Set(varSelectedMonth, Month(Today()));
        Set(varSelectedYear, Year(Today()));
        Set(varCalendarView, "Personal");
        Set(varViewFormat, "Calendar");
        Set(varShowCalendarDetails, false);
        Set(varSelectedDateLeaves, Blank());
        Set(varNavCollapsed, false);
        Set(varMobileMenuOpen, false);
        
        //CRITICAL: Check authentication status first
        Set(varIsUserAuthenticated, And(
          Not(IsBlank(UserSessionANP.Id)),
          UserSessionANP.Id <> "",
          UserSessionANP.Permission > 0
        ));
        
        //Check user permissions - ROLE-BASED CALENDAR PERMISSIONS per requirements document
        Set(varUserPermissions, {
          CanViewPersonalLeaves: true, //All roles can view personal calendar
          CanCreateSpecialLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.SPECIAL_LEAVE),
          CanViewTeamLeaves: Or(UserSessionANP.MaVaiTro = "Manager", UserSessionANP.MaVaiTro = "HR", UserSessionANP.MaVaiTro = "Admin"), //Manager, HR, Admin can view department calendar
          CanViewAllLeaves: Or(UserSessionANP.MaVaiTro = "Director", UserSessionANP.MaVaiTro = "HR", UserSessionANP.MaVaiTro = "Admin"), //Director, HR, Admin can view company calendar
          CanApproveLevel1: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_1),
          CanApproveLevel2: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_2),
          CanApproveLevel3: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_3),
          CanRecordLeave: CheckPermission(UserSessionANP.Permission, UserPermissions.RECORD_LEAVE),
          CanManageUsers: CheckPermission(UserSessionANP.Permission, UserPermissions.MANAGE_USERS),
          CanExportReports: CheckPermission(UserSessionANP.Permission, UserPermissions.EXPORT_REPORTS),
          CanViewDashboard: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_DASHBOARD)
        });
        
        //CRITICAL: Check if user has calendar viewing permissions - ROLE-BASED per document  
        Set(varCanViewCalendar, Or(
          varUserPermissions.CanViewPersonalLeaves, 
          varUserPermissions.CanViewTeamLeaves, 
          varUserPermissions.CanViewAllLeaves,
          varUserPermissions.CanManageUsers,
          UserSessionANP.MaVaiTro = "Admin",
          UserSessionANP.MaVaiTro = "Employee", //All roles should have calendar access
          UserSessionANP.MaVaiTro = "Manager",
          UserSessionANP.MaVaiTro = "Director",
          UserSessionANP.MaVaiTro = "HR"
        ));
        
        //DEBUG: Set debug info for troubleshooting permissions
        Set(varDebugInfo, {
          UserPermission: UserSessionANP.Permission,
          UserRole: UserSessionANP.MaVaiTro,
          CanViewPersonalLeaves: varUserPermissions.CanViewPersonalLeaves,
          CanViewTeamLeaves: varUserPermissions.CanViewTeamLeaves,
          CanViewAllLeaves: varUserPermissions.CanViewAllLeaves,
          CanViewCalendar: varCanViewCalendar
        });
        
        //Auto-set appropriate calendar view based on user permissions
        If(Not(varUserPermissions.CanViewPersonalLeaves) And varCalendarView = "Personal",
          //User doesn't have personal permission, switch to available view
          If(varUserPermissions.CanViewTeamLeaves,
            Set(varCalendarView, "Department"),
            If(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers, UserSessionANP.MaVaiTro = "Admin"),
              Set(varCalendarView, "All"),
              Set(varCalendarView, "Personal") //Fallback - will show empty
            )
          )
        );
        
        If(Not(varUserPermissions.CanViewTeamLeaves) And varCalendarView = "Department",
          //User doesn't have department permission, switch to available view
          If(varUserPermissions.CanViewPersonalLeaves,
            Set(varCalendarView, "Personal"),
            If(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers, UserSessionANP.MaVaiTro = "Admin"),
              Set(varCalendarView, "All"),
              Set(varCalendarView, "Personal") //Fallback
            )
          )
        );
        
        If(Not(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers, UserSessionANP.MaVaiTro = "Admin")) And varCalendarView = "All",
          //User doesn't have all company permission, switch to available view
          If(varUserPermissions.CanViewPersonalLeaves,
            Set(varCalendarView, "Personal"),
            If(varUserPermissions.CanViewTeamLeaves,
              Set(varCalendarView, "Department"),
              Set(varCalendarView, "Personal") //Fallback
            )
          )
        );
        
        //Load SharePoint data with authentication check
        If(varIsUserAuthenticated,
          //Load Personal Leaves from SharePoint based on permissions
          If(varUserPermissions.CanViewPersonalLeaves,
            ClearCollect(colPersonalLeaves, 
              Filter(DonNghiPhep, 
                And(
                  MaNguoiDung.Value = UserSessionANP.Id,
                  Or(
                    Month(NgayBatDau) = varSelectedMonth,
                    Month(NgayKetThuc) = varSelectedMonth,
                    And(NgayBatDau <= Date(varSelectedYear, varSelectedMonth, 1), NgayKetThuc >= DateAdd(Date(varSelectedYear, varSelectedMonth + 1, 1), -1, TimeUnit.Days))
                  )
                )
              )
            ),
            //No personal leave permission - clear personal data
            ClearCollect(colPersonalLeaves, Blank())
          );
          
          //Load Department Leaves from SharePoint based on permissions
          If(varUserPermissions.CanViewTeamLeaves,
            ClearCollect(colDepartmentLeaves,
              Filter(DonNghiPhep,
                And(
                  LookUp(NguoiDung, Title = MaNguoiDung).MaDonVi.Value = UserSessionANP.MaDonVi,
                  Or(
                    Month(NgayBatDau) = varSelectedMonth,
                    Month(NgayKetThuc) = varSelectedMonth,
                    And(NgayBatDau <= Date(varSelectedYear, varSelectedMonth, 1), NgayKetThuc >= DateAdd(Date(varSelectedYear, varSelectedMonth + 1, 1), -1, TimeUnit.Days))
                  )
                )
              )
            ),
            //No team leave permission - clear department data
            ClearCollect(colDepartmentLeaves, Blank())
          );
          
          //Load All Company Leaves from SharePoint based on permissions
          If(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers, UserSessionANP.MaVaiTro = "Admin"),
            //Admin/HR - view all company leave requests
            ClearCollect(colAllLeaves,
              Filter(DonNghiPhep,
                Or(
                  Month(NgayBatDau) = varSelectedMonth,
                  Month(NgayKetThuc) = varSelectedMonth,
                  And(NgayBatDau <= Date(varSelectedYear, varSelectedMonth, 1), NgayKetThuc >= DateAdd(Date(varSelectedYear, varSelectedMonth + 1, 1), -1, TimeUnit.Days))
                )
              )
            ),
            //No all leaves permission - clear all company data
            ClearCollect(colAllLeaves, Blank())
          );
          
          //Load Holidays from SharePoint
          ClearCollect(colHolidays,
            ForAll(
              Filter(NgayLe, Nam = varSelectedYear),
              {
                Ngay: Ngay,
                TenNgayLe: TenNgayLe,
                FormattedDate: Text(DateValue(Ngay & "/" & varSelectedYear), "yyyy-mm-dd")
              }
            )
          );
          
          //Load Users from SharePoint for lookups - only if user has permission to view other users
          If(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanViewTeamLeaves, varUserPermissions.CanManageUsers),
            ClearCollect(colCalendarUsers, NguoiDung),
            //Limited permission - only load current user
            ClearCollect(colCalendarUsers, Filter(NguoiDung, Title = UserSessionANP.Id))
          );
          
          //Load Leave Types from SharePoint
          ClearCollect(colCalendarLeaveTypes, LoaiNghi);
          
          //Load Departments from SharePoint for lookups - only if user has permission
          If(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanViewTeamLeaves, varUserPermissions.CanManageUsers),
            ClearCollect(colCalendarDepartments, DonVi),
            //Limited permission - only load current user's department
            ClearCollect(colCalendarDepartments, Filter(DonVi, Title = UserSessionANP.MaDonVi))
          );
          
          //Load Leave Balance data from SharePoint SoNgayPhep for additional context
          If(Or(varUserPermissions.CanViewAllLeaves, varUserPermissions.CanManageUsers),
            //Admin/HR - view all company leave balance data
            ClearCollect(colAllLeaveBalance, SoNgayPhep),
            //Regular user - view personal leave balance data only
            ClearCollect(colUserLeaveBalance, Filter(SoNgayPhep, MaNhanVien.Value = UserSessionANP.Id))
          );
          
          Set(varNetworkError, false),
          //No authentication - use demo data for preview
          Set(varNetworkError, false);
          Set(varDemoMode, true);
          
          //DEMO: Set demo user only if no valid user session exists
          If(UserSessionANP.Permission = 0,
            Set(UserSessionANP, {
              Id: "EMP001",
              HoTen: "Demo User",
              Email: "demo@company.com",
              MaVaiTro: "Employee",
              Permission: 259, // PERSONAL_LEAVE (1) + SPECIAL_LEAVE (2) + VIEW_DASHBOARD (256) 
              NguoiQuanLyId: "MGR001",
              ChucDanh: "Nhân viên",
              MaDonVi: "IT",
              TrangThai: "HoatDong",
              Name: "Demo User",
              Role: "Employee"
            });
            
            //Recalculate permissions after setting demo user - ROLE-BASED LOGIC
            Set(varUserPermissions, {
              CanViewPersonalLeaves: true, //All roles can view personal calendar
              CanCreateSpecialLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.SPECIAL_LEAVE),
              CanViewTeamLeaves: Or(UserSessionANP.MaVaiTro = "Manager", UserSessionANP.MaVaiTro = "HR", UserSessionANP.MaVaiTro = "Admin"), //Manager, HR, Admin can view department calendar
              CanViewAllLeaves: Or(UserSessionANP.MaVaiTro = "Director", UserSessionANP.MaVaiTro = "HR", UserSessionANP.MaVaiTro = "Admin"), //Director, HR, Admin can view company calendar
              CanApproveLevel1: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_1),
              CanApproveLevel2: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_2),
              CanApproveLevel3: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_3),
              CanRecordLeave: CheckPermission(UserSessionANP.Permission, UserPermissions.RECORD_LEAVE),
              CanManageUsers: CheckPermission(UserSessionANP.Permission, UserPermissions.MANAGE_USERS),
              CanExportReports: CheckPermission(UserSessionANP.Permission, UserPermissions.EXPORT_REPORTS),
              CanViewDashboard: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_DASHBOARD)
            })
          );
          
          //Create demo leave data for preview with correct structure
          ClearCollect(colPersonalLeaves, 
            Table(
              {MaNguoiDung: {Value: "EMP001"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 5), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 7), SoNgayNghi: 3, MaLoai: {Value: "ANNUAL"}, LyDo: "Nghỉ phép năm", TrangThai: {Value: "DaDuyet"}},
              {MaNguoiDung: {Value: "EMP001"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 15), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 15), SoNgayNghi: 1, MaLoai: {Value: "SICK"}, LyDo: "Nghỉ ốm", TrangThai: {Value: "ChoDuyetCap1"}}
            )
          );
          //Demo department leaves - lọc theo phòng ban của user hiện tại
          ClearCollect(colAllDemoLeaves,
            Table(
              {MaNguoiDung: {Value: "EMP002"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 10), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 12), SoNgayNghi: 3, MaLoai: {Value: "ANNUAL"}, LyDo: "Nghỉ phép", TrangThai: {Value: "DaDuyet"}},
              {MaNguoiDung: {Value: "EMP003"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 20), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 22), SoNgayNghi: 3, MaLoai: {Value: "PERSONAL"}, LyDo: "Việc cá nhân", TrangThai: {Value: "DaDuyet"}},
              {MaNguoiDung: {Value: "EMP004"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 8), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 9), SoNgayNghi: 2, MaLoai: {Value: "SICK"}, LyDo: "Nghỉ ốm", TrangThai: {Value: "DaDuyet"}},
              {MaNguoiDung: {Value: "EMP005"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 25), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 26), SoNgayNghi: 2, MaLoai: {Value: "ANNUAL"}, LyDo: "Nghỉ phép", TrangThai: {Value: "DaDuyet"}}
            )
          );
          //Lọc chỉ nhân viên cùng phòng ban với user hiện tại
          ClearCollect(colDepartmentLeaves,
            Filter(colAllDemoLeaves,
              LookUp(colCalendarUsers, Title = MaNguoiDung).MaDonVi.Value = If(IsBlank(UserSessionANP.MaDonVi), "IT", UserSessionANP.MaDonVi)
            )
          );
          ClearCollect(colAllLeaves,
            Table(
              {MaNguoiDung: {Value: "EMP001"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 5), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 7), SoNgayNghi: 3, MaLoai: {Value: "ANNUAL"}, LyDo: "Nghỉ phép năm", TrangThai: {Value: "DaDuyet"}},
              {MaNguoiDung: {Value: "EMP002"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 10), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 12), SoNgayNghi: 3, MaLoai: {Value: "ANNUAL"}, LyDo: "Nghỉ phép", TrangThai: {Value: "DaDuyet"}},
              {MaNguoiDung: {Value: "EMP003"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 20), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 22), SoNgayNghi: 3, MaLoai: {Value: "PERSONAL"}, LyDo: "Việc cá nhân", TrangThai: {Value: "DaDuyet"}},
              {MaNguoiDung: {Value: "EMP001"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 15), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 15), SoNgayNghi: 1, MaLoai: {Value: "SICK"}, LyDo: "Nghỉ ốm", TrangThai: {Value: "ChoDuyetCap1"}},
              {MaNguoiDung: {Value: "EMP004"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 8), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 9), SoNgayNghi: 2, MaLoai: {Value: "SICK"}, LyDo: "Nghỉ ốm", TrangThai: {Value: "DaDuyet"}},
              {MaNguoiDung: {Value: "EMP005"}, NgayBatDau: Date(varSelectedYear, varSelectedMonth, 25), NgayKetThuc: Date(varSelectedYear, varSelectedMonth, 26), SoNgayNghi: 2, MaLoai: {Value: "ANNUAL"}, LyDo: "Nghỉ phép", TrangThai: {Value: "DaDuyet"}}
            )
          );
          //Demo holidays
          ClearCollect(colHolidays,
            Table(
              {Ngay: "01/01", TenNgayLe: "Tết Dương lịch", FormattedDate: Text(Date(varSelectedYear, 1, 1), "yyyy-mm-dd")},
              {Ngay: "30/04", TenNgayLe: "Giải phóng miền Nam", FormattedDate: Text(Date(varSelectedYear, 4, 30), "yyyy-mm-dd")},
              {Ngay: "01/05", TenNgayLe: "Quốc tế Lao động", FormattedDate: Text(Date(varSelectedYear, 5, 1), "yyyy-mm-dd")},
              {Ngay: "02/09", TenNgayLe: "Quốc khánh", FormattedDate: Text(Date(varSelectedYear, 9, 2), "yyyy-mm-dd")}
            )
          );
          //Demo users for lookups - với nhiều phòng ban để test
          ClearCollect(colCalendarUsers,
            Table(
              {Title: "EMP001", HoTen: "Nguyễn Văn An", MaDonVi: {Value: "IT"}},
              {Title: "EMP002", HoTen: "Trần Thị Bình", MaDonVi: {Value: "IT"}},
              {Title: "EMP003", HoTen: "Lê Văn Cường", MaDonVi: {Value: "IT"}},
              {Title: "EMP004", HoTen: "Phạm Thị Dung", MaDonVi: {Value: "HR"}},
              {Title: "EMP005", HoTen: "Hoàng Văn Em", MaDonVi: {Value: "SALES"}}
            )
          );
          //Demo leave types
          ClearCollect(colCalendarLeaveTypes,
            Table(
              {Title: "ANNUAL", TenLoai: "Nghỉ phép năm"},
              {Title: "SICK", TenLoai: "Nghỉ ốm"},
              {Title: "PERSONAL", TenLoai: "Việc cá nhân"}
            )
          );
          //Demo departments
          ClearCollect(colCalendarDepartments,
            Table(
              {Title: "IT", TenDonVi: "Phòng Công nghệ thông tin"},
              {Title: "HR", TenDonVi: "Phòng Nhân sự"},
              {Title: "SALES", TenDonVi: "Phòng Kinh doanh"}
            )
          );
          //Demo leave balance
          ClearCollect(colUserLeaveBalance,
            Table(
              {MaNhanVien: {Value: "EMP001"}, TongNgayDuocPhep: 12, SoNgayDaNghi: 3, SoNgayConLai: 9}
            )
          )
        );
        
        //Calculate calendar grid
        Set(varFirstDayOfMonth, Date(varSelectedYear, varSelectedMonth, 1));
        Set(varLastDayOfMonth, DateAdd(Date(varSelectedYear, varSelectedMonth + 1, 1), -1, TimeUnit.Days));
        Set(varFirstWeekday, Weekday(varFirstDayOfMonth, StartOfWeek.Sunday));
        Set(varDaysInMonth, Day(varLastDayOfMonth));
        Set(varStartDate, DateAdd(varFirstDayOfMonth, -(varFirstWeekday - 1), TimeUnit.Days));
        Set(varWeeksNeeded, Max(RoundUp((varDaysInMonth + varFirstWeekday - 1) / 7, 0), 1));
        Set(varTotalCells, varWeeksNeeded * 7);
        ClearCollect(colCalendarDays,
          ForAll(
            Sequence(varTotalCells),
            With(
              {currentDate: DateAdd(varStartDate, Value - 1, TimeUnit.Days)},
              {
                CalendarDate: currentDate,
                IsCurrentMonth: Month(currentDate) = varSelectedMonth,
                IsToday: currentDate = Today(),
                IsWeekend: Or(Weekday(currentDate, StartOfWeek.Sunday) = 1, Weekday(currentDate, StartOfWeek.Sunday) = 7),
                DayNumber: Day(currentDate),
                FormattedDate: Text(currentDate, "yyyy-mm-dd"),
                WeekRow: RoundUp(Value / 7, 0)
              }
            )
          )
        );
        
        //FINAL: Always recalculate calendar permissions after all data is loaded - ROLE-BASED
        Set(varCanViewCalendar, Or(
          varUserPermissions.CanViewPersonalLeaves, 
          varUserPermissions.CanViewTeamLeaves, 
          varUserPermissions.CanViewAllLeaves,
          varUserPermissions.CanManageUsers,
          UserSessionANP.MaVaiTro = "Admin",
          UserSessionANP.MaVaiTro = "Employee", //All roles should have calendar access
          UserSessionANP.MaVaiTro = "Manager",
          UserSessionANP.MaVaiTro = "Director",
          UserSessionANP.MaVaiTro = "HR"
        ));
        
        //FINAL: Update debug info after final calculations
        Set(varDebugInfo, {
          UserPermission: UserSessionANP.Permission,
          UserRole: UserSessionANP.MaVaiTro,
          CanViewPersonalLeaves: varUserPermissions.CanViewPersonalLeaves,
          CanViewTeamLeaves: varUserPermissions.CanViewTeamLeaves,
          CanViewAllLeaves: varUserPermissions.CanViewAllLeaves,
          CanViewCalendar: varCanViewCalendar
        });
        
        Set(varDataLoading, false);
        
        //Start authentication check
        Set(varAuthTimerStart, true)
    Children:
      # Authentication Check Timer
      - 'Calendar.AuthTimer':
          Control: Timer
          Properties:
            X: =0
            Y: =0
            Width: =1
            Height: =1
            Duration: =100
            AutoStart: =varAuthTimerStart
            Visible: =false
            OnTimerEnd: |
              =//Reset timer flag
              Set(varAuthTimerStart, false);
              //Check authentication: If not logged in, redirect to login
              If(Not(varIsUserAuthenticated),
                Navigate(LoginScreen),
                //Check calendar permissions after authentication
                If(Not(varCanViewCalendar),
                  Notify("Bạn không có quyền xem lịch nghỉ phép", NotificationType.Error);
                  Navigate(DashboardScreen),
                  //Continue with calendar - user is authenticated and has permission
                  Set(varAuthenticationValid, true)
                )
              )
              
      # Header Component
      - 'Calendar.Header':
          Control: CanvasComponent
          ComponentName: HeaderComponent
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height * 0.065
            UserName: =UserSessionANP.HoTen
            UserRole: =UserSessionANP.MaVaiTro
            ShowNotification: =true
            NotificationCount: =0
            OnLogout: |
              =//Clear authentication flag
              Set(varIsUserAuthenticated, false);
              //Clear UserSessionANP data with correct structure
              Set(UserSessionANP, {
                Id: "",
                HoTen: "",
                Email: "",
                MaVaiTro: "",
                Permission: 0,
                NguoiQuanLyId: "",
                ChucDanh: "",
                MaDonVi: "",
                TrangThai: "",
                Name: "",
                Role: ""
              });
              //Navigate to login
              Navigate(LoginScreen)

      # Navigation Component
      - 'Calendar.Navigation':
          Control: CanvasComponent
          ComponentName: NavigationComponent
          Properties:
            X: =0
            Y: ='Calendar.Header'.Height
            Width: =If(varNavCollapsed, App.Width * 0.045, App.Width * 0.14)
            Height: =Parent.Height - 'Calendar.Header'.Height
            UserRole: =UserSessionANP.MaVaiTro
            ActiveScreen: ="Calendar"
            IsCollapsed: =varNavCollapsed
            DashboardScreen: =DashboardScreen
            LeaveRequestScreen: =LeaveRequestScreen
            MyLeavesScreen: =MyLeavesScreen
            CalendarScreen: =CalendarScreen
            ManagementScreen: =ManagementScreen
            ReportsScreen: =ReportsScreen
            ProfileScreen: =ProfileScreen
            ApprovalScreen: =ApprovalScreen
            OnNavigate: |
              =Set(varActiveScreen, ScreenName);
              Switch(ScreenName,
                "Dashboard", Navigate(DashboardScreen),
                "LeaveRequest", Navigate(LeaveRequestScreen),
                "MyLeaves", Navigate(MyLeavesScreen),
                "Calendar", Navigate(CalendarScreen),
                "Management", Navigate(ManagementScreen),
                "Profile", Navigate(ProfileScreen),
                "Approval", Navigate(ApprovalScreen),
                "Reports", Navigate(ReportsScreen)
              )
            OnToggleCollapse: |
              =Set(varNavCollapsed, !varNavCollapsed)
              
      # Main Content Container
      - 'Calendar.Content.Container':
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: ='Calendar.Navigation'.Width
            Y: ='Calendar.Header'.Height
            Width: =Parent.Width - 'Calendar.Navigation'.Width
            Height: =Parent.Height - 'Calendar.Header'.Height
          Children:
            - 'Calendar.Content.Padded':
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.01
                  Y: =Parent.Height * 0.01
                  Width: =Parent.Width * 0.98
                  Height: =Parent.Height * 0.98
                Children:
                  # Page Header with Controls
                  - 'Calendar.PageHeader.Container':
                      Control: GroupContainer
                      Variant: ManualLayout
                      Properties:
                        X: =0
                        Y: =0
                        Width: =Parent.Width
                        Height: =Parent.Height * 0.15
                      Children:
                        - 'Calendar.PageHeader.Background':
                            Control: Rectangle
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.Width
                              Height: =Parent.Height
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                              
                        # Calendar Navigation
                        - 'Calendar.Nav.Container':
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =Parent.Width * 0.02
                              Y: =Parent.Height * 0.1
                              Width: =Parent.Width * 0.4
                              Height: =Parent.Height * 0.8
                            Children:
                              - 'Calendar.Nav.PrevButton':
                                  Control: CanvasComponent
                                  ComponentName: ButtonComponent
                                  Properties:
                                    X: =0
                                    Y: =(Parent.Height - Self.Height) / 2
                                    Width: =Parent.Width * 0.15
                                    Height: =Parent.Height * 0.6
                                    Text: ="‹"
                                    Variant: ="Outline"
                                    Size: =FontSizes.Medium
                                    OnClick: |
                                      =If(varSelectedMonth = 1,
                                        Set(varSelectedMonth, 12); Set(varSelectedYear, varSelectedYear - 1),
                                        Set(varSelectedMonth, varSelectedMonth - 1)
                                      );
                                      Set(varFirstDayOfMonth, Date(varSelectedYear, varSelectedMonth, 1));
                                      Set(varLastDayOfMonth, DateAdd(Date(varSelectedYear, varSelectedMonth + 1, 1), -1, TimeUnit.Days));
                                      Set(varFirstWeekday, Weekday(varFirstDayOfMonth, StartOfWeek.Sunday));
                                      Set(varDaysInMonth, Day(varLastDayOfMonth));
                                      Set(varStartDate, DateAdd(varFirstDayOfMonth, -(varFirstWeekday - 1), TimeUnit.Days));
                                      Set(varWeeksNeeded, Max(RoundUp((varDaysInMonth + varFirstWeekday - 1) / 7, 0), 1));
                                      Set(varTotalCells, varWeeksNeeded * 7);
                                      ClearCollect(colCalendarDays,
                                        ForAll(
                                          Sequence(varTotalCells),
                                          With(
                                            {currentDate: DateAdd(varStartDate, Value - 1, TimeUnit.Days)},
                                            {
                                              CalendarDate: currentDate,
                                              IsCurrentMonth: Month(currentDate) = varSelectedMonth,
                                              IsToday: currentDate = Today(),
                                              IsWeekend: Or(Weekday(currentDate, StartOfWeek.Sunday) = 1, Weekday(currentDate, StartOfWeek.Sunday) = 7),
                                              DayNumber: Day(currentDate),
                                              FormattedDate: Text(currentDate, "yyyy-mm-dd"),
                                              WeekRow: RoundUp(Value / 7, 0)
                                            }
                                          )
                                        )
                                      )
                                      
                              - 'Calendar.Nav.MonthYear':
                                  Control: Label
                                  Properties:
                                    X: =Parent.Width * 0.2
                                    Y: =(Parent.Height - Self.Height) / 2
                                    Width: =Parent.Width * 0.6
                                    Height: =Parent.Height * 0.6
                                    Text: =Concatenate("Tháng ", varSelectedMonth, " năm ", varSelectedYear)
                                    Color: =RGBA(17, 24, 39, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Size: =FontSizes.Large
                                    Align: =Align.Center
                                    VerticalAlign: =VerticalAlign.Middle
                                    
                              - 'Calendar.Nav.NextButton':
                                  Control: CanvasComponent
                                  ComponentName: ButtonComponent
                                  Properties:
                                    X: =Parent.Width * 0.85
                                    Y: =(Parent.Height - Self.Height) / 2
                                    Width: =Parent.Width * 0.15
                                    Height: =Parent.Height * 0.6
                                    Text: ="›"
                                    Variant: ="Outline"
                                    Size: =FontSizes.Medium
                                    OnClick: |
                                      =If(varSelectedMonth = 12,
                                        Set(varSelectedMonth, 1); Set(varSelectedYear, varSelectedYear + 1),
                                        Set(varSelectedMonth, varSelectedMonth + 1)
                                      );
                                      Set(varFirstDayOfMonth, Date(varSelectedYear, varSelectedMonth, 1));
                                      Set(varLastDayOfMonth, DateAdd(Date(varSelectedYear, varSelectedMonth + 1, 1), -1, TimeUnit.Days));
                                      Set(varFirstWeekday, Weekday(varFirstDayOfMonth, StartOfWeek.Sunday));
                                      Set(varDaysInMonth, Day(varLastDayOfMonth));
                                      Set(varStartDate, DateAdd(varFirstDayOfMonth, -(varFirstWeekday - 1), TimeUnit.Days));
                                      Set(varWeeksNeeded, Max(RoundUp((varDaysInMonth + varFirstWeekday - 1) / 7, 0), 1));
                                      Set(varTotalCells, varWeeksNeeded * 7);
                                      ClearCollect(colCalendarDays,
                                        ForAll(
                                          Sequence(varTotalCells),
                                          With(
                                            {currentDate: DateAdd(varStartDate, Value - 1, TimeUnit.Days)},
                                            {
                                              CalendarDate: currentDate,
                                              IsCurrentMonth: Month(currentDate) = varSelectedMonth,
                                              IsToday: currentDate = Today(),
                                              IsWeekend: Or(Weekday(currentDate, StartOfWeek.Sunday) = 1, Weekday(currentDate, StartOfWeek.Sunday) = 7),
                                              DayNumber: Day(currentDate),
                                              FormattedDate: Text(currentDate, "yyyy-mm-dd"),
                                              WeekRow: RoundUp(Value / 7, 0)
                                            }
                                          )
                                        )
                                      )
                                      
