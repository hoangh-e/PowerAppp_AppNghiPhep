                                            "ChoDuyetCap1", "Chờ duyệt",
                                            "ChoDuyetCap2", "Chờ duyệt", 
                                            "ChoDuyetCap3", "Chờ duyệt",
                                            "DaDuyet", "Đã duyệt",
                                            "TuChoi", "Từ chối",
                                            "Huy", "Đã hủy",
                                            ThisItem.TrangThai.Value)
                                          Color: =Switch(ThisItem.TrangThai.Value,
                                            "DaDuyet", RGBA(34, 197, 94, 1),
                                            "TuChoi", RGBA(239, 68, 68, 1),
                                            "Huy", RGBA(107, 114, 128, 1),
                                            RGBA(251, 191, 36, 1))
                                          Fill: =Switch(ThisItem.TrangThai.Value,
                                            "DaDuyet", RGBA(240, 253, 244, 1),
                                            "TuChoi", RGBA(254, 242, 242, 1),
                                            "Huy", RGBA(249, 250, 251, 1),
                                            RGBA(254, 243, 199, 1))
                                          BorderColor: =Switch(ThisItem.TrangThai.Value,
                                            "DaDuyet", RGBA(34, 197, 94, 1),
                                            "TuChoi", RGBA(239, 68, 68, 1),
                                            "Huy", RGBA(107, 114, 128, 1),
                                            RGBA(251, 191, 36, 1))
                                          BorderThickness: =1
                                          Font: =Font.'Open Sans'
                                          FontWeight: =FontWeight.Semibold
                                          Size: =FontSizes.Small
                                          Align: =Align.Center
                                          VerticalAlign: =VerticalAlign.Middle
                                          
                                    # Reason
                                    - 'Calendar.List.Reason':
                                        Control: Label
                                        Properties:
                                          X: =Parent.Width * 0.3
                                          Y: =Parent.Height * 0.7
                                          Width: =Parent.Width * 0.66
                                          Height: =Parent.Width * 0.25
                                          Text: =If(Len(ThisItem.LyDo) > 50, Left(ThisItem.LyDo, 47) & "...", ThisItem.LyDo)
                                          Color: =RGBA(75, 85, 99, 1)
                                          Font: =Font.'Open Sans'
                                          Size: =FontSizes.Small
                                          Wrap: =true
                                          
                        # No data message for List View
                        - 'Calendar.List.NoData':
                            Control: Label
                            Properties:
                              X: =0
                              Y: =(Parent.Height - Self.Height) / 2
                              Width: =Parent.Width
                              Height: =Parent.Height * 0.2
                              Text: ="Không có dữ liệu nghỉ phép trong tháng này"
                              Color: =RGBA(107, 114, 128, 1)
                              Font: =Font.'Open Sans'
                              Size: =FontSizes.Large
                              Align: =Align.Center
                              VerticalAlign: =VerticalAlign.Middle
                              Visible: =CountRows(Switch(varCalendarView,
                                "Personal", colPersonalLeaves,
                                "Department", colDepartmentLeaves,
                                "All", colAllLeaves,
                                colPersonalLeaves)) = 0

             # Loading Indicator
      - 'Calendar.Loading.Overlay':
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
            Fill: =RGBA(255, 255, 255, 0.8)
            Visible: =varDataLoading
           
      - 'Calendar.Loading.Text':
          Control: Label
          Properties:
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
            Width: =200
            Height: =50
            Text: ="Đang tải dữ liệu..."
            Color: =RGBA(59, 130, 246, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =FontSizes.Large
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Visible: =varDataLoading
             
       # Network Error Message
      - 'Calendar.Error.Message':
          Control: Rectangle
          Properties:
            X: =(Parent.Width - Parent.Width * 0.4) / 2
            Y: =Parent.Height * 0.1
            Width: =Parent.Width * 0.4
            Height: =60
            Fill: =If(varDemoMode, RGBA(254, 243, 199, 1), RGBA(254, 242, 242, 1))
            BorderColor: =If(varDemoMode, RGBA(251, 191, 36, 1), RGBA(239, 68, 68, 1))
            BorderThickness: =2
            Visible: =Or(varNetworkError, varDemoMode)
             
      - 'Calendar.Error.Text':
          Control: Label
          Properties:
            X: =(Parent.Width - Parent.Width * 0.38) / 2
            Y: =Parent.Height * 0.1 + 10
            Width: =Parent.Width * 0.38
            Height: =40
            Text: =If(varDemoMode, "Chế độ xem thử - Vui lòng đăng nhập để xem dữ liệu thực", "Lỗi kết nối SharePoint")
            Color: =If(varDemoMode, RGBA(251, 191, 36, 1), RGBA(239, 68, 68, 1))
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Size: =FontSizes.Base
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Visible: =Or(varNetworkError, varDemoMode)

      # Calendar Details Modal
      - 'Calendar.Details.Modal':
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - Parent.Width * 0.6) / 2
            Y: =(Parent.Height - Parent.Height * 0.7) / 2
            Width: =Parent.Width * 0.6
            Height: =Parent.Height * 0.7
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(226, 232, 240, 1)
            BorderThickness: =2
            Visible: =varShowCalendarDetails
          Children:
            - 'Calendar.Details.Header':
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.02
                  Y: =Parent.Height * 0.02
                  Width: =Parent.Width * 0.96
                  Height: =Parent.Height * 0.08
                  Fill: =RGBA(59, 130, 246, 1)
                  BorderColor: =RGBA(37, 99, 235, 1)
                  BorderThickness: =1
                Children:
                  - 'Calendar.Details.Title':
                      Control: Label
                      Properties:
                        X: =Parent.Width * 0.03
                        Y: =(Parent.Height - Parent.Height * 0.6) / 2
                        Width: =Parent.Width * 0.8
                        Height: =Parent.Height * 0.6
                        Text: ="Chi tiết lịch nghỉ phép"
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Size: =FontSizes.Large
                        
                  - 'Calendar.Details.CloseButton':
                      Control: CanvasComponent
                      ComponentName: ButtonComponent
                      Properties:
                        X: =Parent.Width * 0.84
                        Y: =(Parent.Height - Self.Height) / 2
                        Width: =Parent.Width * 0.13
                        Height: =Parent.Height * 0.6
                        Text: ="Đóng"
                        Variant: ="Outline"
                        Size: =FontSizes.Small
                        OnClick: =Set(varShowCalendarDetails, false)
                        
            - 'Calendar.Details.Content':
                Control: GroupContainer
                Variant: ManualLayout
                Properties:
                  X: =Parent.Width * 0.02
                  Y: ='Calendar.Details.Header'.Y + 'Calendar.Details.Header'.Height + Parent.Height * 0.02
                  Width: =Parent.Width * 0.96
                  Height: =Parent.Height * 0.86
                  BorderColor: =RGBA(226, 232, 240, 1)
                  BorderThickness: =1
                  Fill: =RGBA(255, 255, 255, 1)
                Children:
                  # Leave List Gallery
                  - 'Calendar.Details.LeaveList':
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        X: =Parent.Width * 0.02
                        Y: =Parent.Height * 0.02
                        Width: =Parent.Width * 0.96
                        Height: =Parent.Height * 0.96
                        Items: =varSelectedDateLeaves
                        TemplateSize: =80
                        BorderThickness: =0
                        Fill: =RGBA(0, 0, 0, 0)
                      Children:
                        - 'Calendar.Details.LeaveItem':
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =80
                              Fill: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(226, 232, 240, 1)
                              BorderThickness: =1
                            Children:
                              # Employee Name
                              - 'Calendar.Details.EmployeeName':
                                  Control: Label
                                  Properties:
                                    X: =Parent.Width * 0.02
                                    Y: =Parent.Height * 0.1
                                    Width: =Parent.Width * 0.25
                                    Height: =Parent.Height * 0.4
                                    Text: =LookUp(colCalendarUsers, Title = ThisItem.MaNguoiDung.Value).HoTen
                                    Color: =RGBA(17, 24, 39, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =FontSizes.Base
                                    
                              # Leave Period
                              - 'Calendar.Details.LeavePeriod':
                                  Control: Label
                                  Properties:
                                    X: =Parent.Width * 0.02
                                    Y: =Parent.Height * 0.55
                                    Width: =Parent.Width * 0.25
                                    Height: =Parent.Height * 0.35
                                    Text: =Text(ThisItem.NgayBatDau, "dd/mm") & " - " & Text(ThisItem.NgayKetThuc, "dd/mm")
                                    Color: =RGBA(75, 85, 99, 1)
                                    Font: =Font.'Open Sans'
                                    Size: =FontSizes.Base
                                    
                              # Leave Type
                              - 'Calendar.Details.LeaveType':
                                  Control: Label
                                  Properties:
                                    X: =Parent.Width * 0.3
                                    Y: =Parent.Height * 0.1
                                    Width: =Parent.Width * 0.2
                                    Height: =Parent.Height * 0.4
                                    Text: =LookUp(colCalendarLeaveTypes, Title = ThisItem.MaLoai.Value).TenLoai
                                    Color: =RGBA(17, 24, 39, 1)
                                    Font: =Font.'Open Sans'
                                    Size: =FontSizes.Base
                                    
                              # Days Count
                              - 'Calendar.Details.DaysCount':
                                  Control: Label
                                  Properties:
                                    X: =Parent.Width * 0.3
                                    Y: =Parent.Height * 0.55
                                    Width: =Parent.Width * 0.2
                                    Height: =Parent.Height * 0.35
                                    Text: =ThisItem.SoNgayNghi & " ngày"
                                    Color: =RGBA(75, 85, 99, 1)
                                    Font: =Font.'Open Sans'
                                    Size: =FontSizes.Base
                                    
                              # Status
                              - 'Calendar.Details.Status':
                                  Control: Label
                                  Properties:
                                    X: =Parent.Width * 0.55
                                    Y: =(Parent.Height - Self.Height) / 2
                                    Width: =Parent.Width * 0.2
                                    Height: =Parent.Height * 0.6
                                    Text: =Switch(ThisItem.TrangThai.Value, 
                                      "ChoDuyetCap1", "Chờ duyệt",
                                      "ChoDuyetCap2", "Chờ duyệt", 
                                      "ChoDuyetCap3", "Chờ duyệt",
                                      "DaDuyet", "Đã duyệt",
                                      "TuChoi", "Từ chối",
                                      "Huy", "Đã hủy",
                                      ThisItem.TrangThai.Value)
                                    Color: =Switch(ThisItem.TrangThai.Value,
                                      "DaDuyet", RGBA(34, 197, 94, 1),
                                      "TuChoi", RGBA(239, 68, 68, 1),
                                      "Huy", RGBA(107, 114, 128, 1),
                                      RGBA(251, 191, 36, 1))
                                    Fill: =Switch(ThisItem.TrangThai.Value,
                                      "DaDuyet", RGBA(240, 253, 244, 1),
                                      "TuChoi", RGBA(254, 242, 242, 1),
                                      "Huy", RGBA(249, 250, 251, 1),
                                      RGBA(254, 243, 199, 1))
                                    BorderColor: =Switch(ThisItem.TrangThai.Value,
                                      "DaDuyet", RGBA(34, 197, 94, 1),
                                      "TuChoi", RGBA(239, 68, 68, 1),
                                      "Huy", RGBA(107, 114, 128, 1),
                                      RGBA(251, 191, 36, 1))
                                    BorderThickness: =1
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Size: =FontSizes.Base
                                    Align: =Align.Center
                                    
                              # Reason (partial)
                              - 'Calendar.Details.Reason':
                                  Control: Label
                                  Properties:
                                    X: =Parent.Width * 0.78
                                    Y: =(Parent.Height - Self.Height) / 2
                                    Width: =Parent.Width * 0.2
                                    Height: =Parent.Height * 0.8
                                    Text: =If(Len(ThisItem.LyDo) > 20, Left(ThisItem.LyDo, 17) & "...", ThisItem.LyDo)
                                    Color: =RGBA(75, 85, 99, 1)
                                    Font: =Font.'Open Sans'
                                    Size: =FontSizes.Base
                                    Wrap: =true 

                  # No data message
                  - 'Calendar.Details.NoData':
                      Control: Label
                      Properties:
                        X: =0
                        Y: =(Parent.Height - Self.Height) / 2
                        Width: =Parent.Width
                        Height: =Parent.Height * 0.2
                        Text: ="Không có dữ liệu nghỉ phép cho ngày này"
                        Color: =RGBA(107, 114, 128, 1)
                        Font: =Font.'Open Sans'
                        Size: =FontSizes.Base
                        Align: =Align.Center
                        VerticalAlign: =VerticalAlign.Middle
                        Visible: =CountRows(varSelectedDateLeaves) = 0

 
                    
      # Permission Access Message - Show when user has no calendar permissions
      - 'Calendar.PermissionMessage':
          Control: GroupContainer
          Variant: ManualLayout
          Properties:
            X: =(Parent.Width - Parent.Width * 0.6) / 2
            Y: =(Parent.Height - Parent.Height * 0.4) / 2
            Width: =Parent.Width * 0.6
            Height: =Parent.Height * 0.4
            Visible: =Not(varCanViewCalendar)
          Children:
            - 'Calendar.PermissionMessage.Background':
                Control: Rectangle
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.Width
                  Height: =Parent.Height
                  Fill: =RGBA(254, 242, 242, 1)
                  BorderColor: =RGBA(239, 68, 68, 1)
                  BorderThickness: =2
                  
            - 'Calendar.PermissionMessage.Icon':
                Control: Classic/Icon
                Properties:
                  X: =(Parent.Width - Parent.Width * 0.2) / 2
                  Y: =Parent.Height * 0.15
                  Width: =Parent.Width * 0.2
                  Height: =Parent.Height * 0.2
                  Icon: =Icon.Cancel
                  Color: =RGBA(239, 68, 68, 1)
                  
            - 'Calendar.PermissionMessage.Title':
                Control: Label
                Properties:
                  X: =Parent.Width * 0.05
                  Y: =Parent.Height * 0.4
                  Width: =Parent.Width * 0.9
                  Height: =Parent.Height * 0.2
                  Text: ="Không có quyền truy cập"
                  Color: =RGBA(239, 68, 68, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Size: =FontSizes.Large
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  
            - 'Calendar.PermissionMessage.Description':
                Control: Label
                Properties:
                  X: =Parent.Width * 0.05
                  Y: =Parent.Height * 0.65
                  Width: =Parent.Width * 0.9
                  Height: =Parent.Height * 0.25
                  Text: ="Bạn không có quyền xem lịch nghỉ phép. Vui lòng liên hệ quản trị viên để được cấp quyền."
                  Color: =RGBA(75, 85, 99, 1)
                  Font: =Font.'Open Sans'
                  Size: =FontSizes.Base
                  Align: =Align.Center
                  VerticalAlign: =VerticalAlign.Middle
                  Wrap: =true
                  
      # Debug Permission Display (for troubleshooting)
      - 'Calendar.DebugInfo':
          Control: Label
          Properties:
            X: =0
            Y: =Parent.Height - Parent.Height * 0.2
            Width: =Parent.Width
            Height: =Parent.Height * 0.2
            Text: |
              =Concatenate(
              "DEBUG - User:", UserSessionANP.HoTen, " | Role:", UserSessionANP.MaVaiTro, " | Permission:", Text(UserSessionANP.Permission), " | ",
              "CanViewPersonal:", Text(varUserPermissions.CanViewPersonalLeaves), " | ",
              "CanViewTeam:", Text(varUserPermissions.CanViewTeamLeaves), " | ",
              "CanViewAll:", Text(varUserPermissions.CanViewAllLeaves), " | ",
              "CanViewCalendar:", Text(varCanViewCalendar)
              )
            Color: =RGBA(107, 114, 128, 1)
            Font: =Font.'Open Sans'
            Size: =FontSizes.Small
            Align: =Align.Center
            Visible: =true
            Wrap: =true
