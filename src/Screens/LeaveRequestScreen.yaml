                          Width: =Parent.Width
                          Height: =Parent.Height
                        Text: ="Đơn nghỉ phép từ ngày " & Text(varSelectedFromDate, "dd/mm/yyyy") & " đến " & Text(varSelectedToDate, "dd/mm/yyyy") & " đã được gửi thành công." & Char(10) & Char(10) & "Đơn sẽ được chuyển đến người phê duyệt trong vòng 24 giờ."
                          Color: =RGBA(55, 65, 81, 1)
                          Font: =Font.'Open Sans'
                          Size: =FontSizes.Base
                          Align: =Align.Center
                          Wrap: =true
                    
              - 'LeaveRequest.Success.Actions':
                  Control: GroupContainer
                  Variant: ManualLayout
                  Properties:
                    X: =Parent.Width * 0.04
                    Y: ='LeaveRequest.Success.Content'.Y + 'LeaveRequest.Success.Content'.Height + Parent.Height * 0.03
                    Width: =Parent.Width * 0.92
                    Height: =Parent.Height * 0.2
                  Children:
                    - 'LeaveRequest.Success.CreateNewButton':
                        Control: CanvasComponent
                        ComponentName: ButtonComponent
                        Properties:
                          X: =0
                          Y: =(Parent.Height - Self.Height) / 2
                          Width: =Parent.Width * 0.45
                          Height: =Parent.Height * 0.8
                          Text: ="Tạo đơn mới"
                          Size: ="Medium"
                          OnClick: |
                            =Set(varShowSuccessModal, false);
                          Set(varSelectedFromDate, Today());
                          Set(varSelectedToDate, Today());
                            Set(varSelectedLeaveType, Blank());
                            Set(varLeaveReason, "");
                            Set(varHandoverPerson, Blank());
                            Set(varHandoverContent, "");
                          Set(varCalculatedDays, 1);
                          ResetForm('LeaveRequest.Form.Container')
                          
                    - 'LeaveRequest.Success.ViewMyLeavesButton':
                        Control: CanvasComponent
                        ComponentName: ButtonComponent
                        Properties:
                          X: =Parent.Width * 0.55
                          Y: =(Parent.Height - Self.Height) / 2
                          Width: =Parent.Width * 0.45
                          Height: =Parent.Height * 0.8
                          Text: ="Xem đơn của tôi"
                          Size: ="Medium"
                          OnClick: |
                            =Set(varShowSuccessModal, false);
                            Navigate(MyLeavesScreen)

        # Loading Indicator
        - 'LeaveRequest.Loading.Overlay':
            Control: Rectangle
            Properties:
              X: =0
              Y: =0
              Width: =Parent.Width
              Height: =Parent.Height
              Fill: =RGBA(255, 255, 255, 0.8)
              Visible: =varDataLoading
            
        - 'LeaveRequest.Loading.Text':
            Control: Label
            Properties:
              X: =(Parent.Width - Self.Width) / 2
              Y: =(Parent.Height - Self.Height) / 2
              Width: =200
              Height: =50
              Text: ="Đang tải dữ liệu..."
              Color: =RGBA(59, 130, 246, 1)
              Font: =Font.'Open Sans'
              FontWeight: =FontWeight.Semibold
              Size: =FontSizes.Large
              Align: =Align.Center
              VerticalAlign: =VerticalAlign.Middle
              Visible: =varDataLoading
              
        # Network Error Message
        - 'LeaveRequest.Error.Message':
            Control: Rectangle
            Properties:
              X: =(Parent.Width - Parent.Width * 0.4) / 2
              Y: =Parent.Height * 0.1
              Width: =Parent.Width * 0.4
              Height: =60
              Fill: =RGBA(254, 242, 242, 1)
              BorderColor: =RGBA(239, 68, 68, 1)
              BorderThickness: =2
              Visible: =varNetworkError
              
        - 'LeaveRequest.Error.Text':
            Control: Label
            Properties:
              X: =(Parent.Width - Parent.Width * 0.38) / 2
              Y: =Parent.Height * 0.1 + 10
              Width: =Parent.Width * 0.38 
              Height: =40
              Text: ="Lỗi kết nối SharePoint. Hiển thị dữ liệu demo."
              Color: =RGBA(239, 68, 68, 1)
              Font: =Font.'Open Sans'
              FontWeight: =FontWeight.Semibold
              Size: =FontSizes.Base
              Align: =Align.Center
              VerticalAlign: =VerticalAlign.Middle
              Visible: =varNetworkError 
