  Screens:
    LeaveRequestScreen:
      Properties:
        Fill: =RGBA(248, 250, 252, 1)
        OnVisible: |
          =Set(varActiveScreen, "LeaveRequest");
          Set(varNavCollapsed, false);
          Set(varMobileMenuOpen, false);
          Set(varNetworkError, false);
          Set(varDataLoading, true);
          
        //CRITICAL: Check if user can create leave requests based on Permission Matrix
        //All users (Employee, Manager, Director, HR, Admin) can create leave requests according to PDF page 6
        //Fix: Check authentication first before checking permissions
        If(varIsUserAuthenticated,
          //Check user permissions using CheckPermission function from App/Formulas
          Set(varUserPermissions, {
            CanCreatePersonalLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.PERSONAL_LEAVE),
            CanCreateSpecialLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.SPECIAL_LEAVE),
            CanViewDashboard: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_DASHBOARD),
            CanViewTeamLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_TEAM_LEAVE),
            CanViewAllLeaves: CheckPermission(UserSessionANP.Permission, UserPermissions.VIEW_ALL_LEAVE),
            CanApproveLevel1: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_1),
            CanApproveLevel2: CheckPermission(UserSessionANP.Permission, UserPermissions.APPROVE_LEVEL_2),
            CanManageUsers: CheckPermission(UserSessionANP.Permission, UserPermissions.MANAGE_USERS),
            CanExportReports: CheckPermission(UserSessionANP.Permission, UserPermissions.EXPORT_REPORTS),
            IsSystemAdmin: CheckPermission(UserSessionANP.Permission, UserPermissions.SYSTEM_ADMIN)
          });
          Set(varCanCreateLeave, varUserPermissions.CanCreatePersonalLeaves),
          //Not authenticated - set default permissions for demo
          Set(varUserPermissions, {
            CanCreatePersonalLeaves: true,
            CanCreateSpecialLeaves: false,
            CanViewDashboard: true,
            CanViewTeamLeaves: false,
            CanViewAllLeaves: false,
            CanApproveLevel1: false,
            CanApproveLevel2: false,
            CanManageUsers: false,
            CanExportReports: false,
            IsSystemAdmin: false
          });
          Set(varCanCreateLeave, true)
        );
        
        //Initialize form variables properly with Today dates
        Set(varSelectedFromDate, Today());
        Set(varSelectedToDate, Today());
          Set(varSelectedLeaveType, Blank());
          Set(varLeaveReason, "");
          Set(varHandoverPerson, Blank());
          Set(varHandoverContent, "");
        Set(varCalculatedDays, 1);

        Set(varValidationErrors, "");
          Set(varIsSubmitting, false);
          Set(varShowSuccessModal, false);
          
          //Load SharePoint data with authentication check
          If(varIsUserAuthenticated,
            //Load user leave balance from SharePoint SoNgayPhep
            ClearCollect(colUserLeaveBalance, 
              Filter(SoNgayPhep, And(MaNhanVien.Value = UserSessionANP.Id, Nam = Year(Today())))
            );
            Set(varUserLeaveBalance, If(CountRows(colUserLeaveBalance) > 0, First(colUserLeaveBalance), Blank()));
            
          //Load available leave types from SharePoint LoaiNghi and format for ComboBox display
            ClearCollect(colAvailableLeaveTypes, 
            AddColumns(LoaiNghi, "DisplayText", TenLoai)
            );
            
          //Load ALL potential handover users from SharePoint NguoiDung and format for ComboBox display
            ClearCollect(colPotentialHandovers, 
            AddColumns(
              Filter(NguoiDung, And(TrangThai.Value = "HoatDong", Title <> UserSessionANP.Id)),
              "DisplayText", HoTen
            )
          );
          //Add manager to handover options if not already included
          If(And(Not(IsBlank(varUserManager)), CountRows(Filter(colPotentialHandovers, Title = varUserManager.Title)) = 0),
            Collect(colPotentialHandovers, 
              {
                Title: varUserManager.Title,
                HoTen: varUserManager.HoTen,
                MaDonVi: varUserManager.MaDonVi,
                TrangThai: varUserManager.TrangThai,
                ChucDanh: varUserManager.ChucDanh,
                DisplayText: varUserManager.HoTen
              }
            )
          );
          
          //FIXED: Load current user info from SharePoint NguoiDung - ensure consistent structure
            Set(varCurrentUser, LookUp(NguoiDung, Title = UserSessionANP.Id));
            
            //Load user manager info from SharePoint NguoiDung
            If(Not(IsBlank(UserSessionANP.NguoiQuanLyId)),
              Set(varUserManager, LookUp(NguoiDung, Title = UserSessionANP.NguoiQuanLyId)),
              Set(varUserManager, Blank())
            );
            
            //Load departments for lookups
            ClearCollect(colDepartments, DonVi);
            
            Set(varNetworkError, false),
            //No authentication - use demo data for preview
            Set(varNetworkError, true);
            
            //Demo leave balance with SharePoint structure
            ClearCollect(colUserLeaveBalance,
              Table(
                {MaNhanVien: {Value: "EMP001"}, Nam: Year(Today()), TongNgayDuocPhep: 12, SoNgayDaNghi: 3, SoNgayConLai: 9}
              )
            );
            Set(varUserLeaveBalance, First(colUserLeaveBalance));
            
          //Demo leave types with SharePoint structure matching LoaiNghi table + DisplayText
            ClearCollect(colAvailableLeaveTypes,
              Table(
              {Title: "ANNUAL", TenLoai: "Phép năm", CoLuong: true, MaLoai: "ANNUAL", DisplayText: "Phép năm"},
              {Title: "SICK", TenLoai: "Nghỉ ốm có lương", CoLuong: true, MaLoai: "SICK", DisplayText: "Nghỉ ốm có lương"},
              {Title: "PERSONAL", TenLoai: "Nghỉ việc riêng", CoLuong: false, MaLoai: "PERSONAL", DisplayText: "Nghỉ việc riêng"},
              {Title: "MATERNITY", TenLoai: "Nghỉ thai sản", CoLuong: true, MaLoai: "MATERNITY", DisplayText: "Nghỉ thai sản"},
              {Title: "UNPAID", TenLoai: "Nghỉ không lương", CoLuong: false, MaLoai: "UNPAID", DisplayText: "Nghỉ không lương"},
              {Title: "STUDY", TenLoai: "Nghỉ học tập", CoLuong: true, MaLoai: "STUDY", DisplayText: "Nghỉ học tập"},
              {Title: "FAMILY", TenLoai: "Nghỉ gia đình", CoLuong: false, MaLoai: "FAMILY", DisplayText: "Nghỉ gia đình"}
            )
          );
          
          //Demo ALL handover users with SharePoint structure matching NguoiDung table + DisplayText
            ClearCollect(colPotentialHandovers,
              Table(
              {Title: "MGR001", HoTen: "Nguyễn Văn Minh", MaDonVi: {Value: "IT"}, TrangThai: {Value: "HoatDong"}, ChucDanh: {Value: "Trưởng phòng"}, DisplayText: "Nguyễn Văn Minh"},
              {Title: "EMP002", HoTen: "Trần Thị Bình", MaDonVi: {Value: "HR"}, TrangThai: {Value: "HoatDong"}, ChucDanh: {Value: "Chuyên viên"}, DisplayText: "Trần Thị Bình"},
              {Title: "EMP003", HoTen: "Lê Hoàng Cường", MaDonVi: {Value: "Finance"}, TrangThai: {Value: "HoatDong"}, ChucDanh: {Value: "Kế toán"}, DisplayText: "Lê Hoàng Cường"},
              {Title: "EMP004", HoTen: "Phạm Thị Dung", MaDonVi: {Value: "Marketing"}, TrangThai: {Value: "HoatDong"}, ChucDanh: {Value: "Chuyên viên"}, DisplayText: "Phạm Thị Dung"},
              {Title: "EMP005", HoTen: "Vũ Minh Khang", MaDonVi: {Value: "IT"}, TrangThai: {Value: "HoatDong"}, ChucDanh: {Value: "Lập trình viên"}, DisplayText: "Vũ Minh Khang"},
              {Title: "EMP006", HoTen: "Đặng Thu Hương", MaDonVi: {Value: "HR"}, TrangThai: {Value: "HoatDong"}, ChucDanh: {Value: "Nhân viên"}, DisplayText: "Đặng Thu Hương"},
              {Title: "EMP007", HoTen: "Ngô Quang Huy", MaDonVi: {Value: "Sales"}, TrangThai: {Value: "HoatDong"}, ChucDanh: {Value: "Nhân viên"}, DisplayText: "Ngô Quang Huy"},
              {Title: "EMP008", HoTen: "Bùi Thị Lan", MaDonVi: {Value: "Finance"}, TrangThai: {Value: "HoatDong"}, ChucDanh: {Value: "Nhân viên"}, DisplayText: "Bùi Thị Lan"},
              {Title: "EMP009", HoTen: "Trịnh Văn Đức", MaDonVi: {Value: "IT"}, TrangThai: {Value: "HoatDong"}, ChucDanh: {Value: "Tester"}, DisplayText: "Trịnh Văn Đức"},
              {Title: "EMP010", HoTen: "Hoàng Thị Mai", MaDonVi: {Value: "Marketing"}, TrangThai: {Value: "HoatDong"}, ChucDanh: {Value: "Designer"}, DisplayText: "Hoàng Thị Mai"}
            )
          );
          
          //FIXED: Demo current user with SharePoint structure - consistent with actual SharePoint records
            Set(varCurrentUser, {
              Title: "EMP001",
              HoTen: "Nguyễn Văn An",
              MaQuanLy: {Value: "MGR001"},
              MaDonVi: {Value: "IT"},
              TrangThai: {Value: "HoatDong"},
              Email: "nguyenvana@company.com",
              ChucDanh: {Value: "Nhân viên"}
            });
            
            //Demo manager with SharePoint structure
            If(Not(IsBlank(UserSessionANP.NguoiQuanLyId)),
              Set(varUserManager, {
                Title: "MGR001",
                HoTen: "Quản lý Demo",
                MaDonVi: {Value: "IT"},
                TrangThai: {Value: "HoatDong"},
                Email: "manager@company.com",
                ChucDanh: {Value: "Trưởng phòng"}
              }),
              Set(varUserManager, Blank())
            );
            
            //Demo departments
            ClearCollect(colDepartments,
              Table(
                {Title: "IT", TenDonVi: "Phòng Công nghệ thông tin"},
                {Title: "HR", TenDonVi: "Phòng Nhân sự"},
                {Title: "Finance", TenDonVi: "Phòng Tài chính"}
              )
            )
          );
          
          Set(varDataLoading, false);
          
          //Start authentication check
          Set(varAuthTimerStart, true)
      Children:
        # Authentication Check Timer
        - 'LeaveRequest.AuthTimer':
            Control: Timer
            Properties:
              X: =0
              Y: =0
              Width: =1
              Height: =1
              Duration: =100
              AutoStart: =varAuthTimerStart
              Visible: =false
              OnTimerEnd: |
                =//Reset timer flag
                Set(varAuthTimerStart, false);
                //Check authentication: If not logged in, redirect to login
                If(Not(varIsUserAuthenticated),
                  Navigate(LoginScreen),
                  //Check leave creation permissions after authentication
                  If(Not(varCanCreateLeave),
                    Notify("Bạn không có quyền tạo đơn nghỉ phép", NotificationType.Error);
                    Navigate(DashboardScreen),
                    //Continue with leave request - user is authenticated and has permission
                    Set(varAuthenticationValid, true)
                  )
                )
        
        # Header Component
        - 'LeaveRequest.Header':
            Control: CanvasComponent
            ComponentName: HeaderComponent
            Properties:
              X: =0
              Y: =0
              Width: =Parent.Width
              Height: =Parent.Height * 0.065
              UserName: =UserSessionANP.HoTen
              UserRole: =UserSessionANP.MaVaiTro
              ShowNotification: =true
              NotificationCount: =0
              OnLogout: |
                =//Clear authentication flag
                Set(varIsUserAuthenticated, false);
                //Clear UserSessionANP data with correct structure
                Set(UserSessionANP, {
                  Id: "",
                  HoTen: "",
                  Email: "",
                  MaVaiTro: "",
                  Permission: 0,
                  NguoiQuanLyId: "",
                  ChucDanh: "",
                  MaDonVi: "",
                  TrangThai: "",
                  Name: "",
                  Role: ""
                });
                //Navigate to login
                Navigate(LoginScreen)
              
        # Navigation Component
        - 'LeaveRequest.Navigation':
            Control: CanvasComponent
            ComponentName: NavigationComponent
            Properties:
              X: =0
              Y: ='LeaveRequest.Header'.Height
              Width: =If(varNavCollapsed, App.Width * 0.045, App.Width * 0.14)
              Height: =Parent.Height - 'LeaveRequest.Header'.Height
              UserRole: =UserSessionANP.MaVaiTro
              ActiveScreen: ="LeaveRequest"
              IsCollapsed: =varNavCollapsed
              DashboardScreen: =DashboardScreen
              LeaveRequestScreen: =LeaveRequestScreen
              MyLeavesScreen: =MyLeavesScreen
              CalendarScreen: =CalendarScreen
              ManagementScreen: =ManagementScreen
              ReportsScreen: =ReportsScreen
              ProfileScreen: =ProfileScreen
              ApprovalScreen: =ApprovalScreen
              OnNavigate: |
                =Set(varActiveScreen, ScreenName);
                Switch(ScreenName,
                  "Dashboard", Navigate(DashboardScreen),
                  "LeaveRequest", Navigate(LeaveRequestScreen),
                  "MyLeaves", Navigate(MyLeavesScreen),
                  "Calendar", Navigate(CalendarScreen),
                  "Management", Navigate(ManagementScreen),
                  "Profile", Navigate(ProfileScreen),
                  "Approval", Navigate(ApprovalScreen),
                  "Reports", Navigate(ReportsScreen)
                )
              OnToggleCollapse: |
                =Set(varNavCollapsed, !varNavCollapsed)
              
        # Main Content Container
        - 'LeaveRequest.Content.Container':
            Control: GroupContainer
            Variant: ManualLayout
            Properties:
              X: ='LeaveRequest.Navigation'.Width
              Y: ='LeaveRequest.Header'.Height
              Width: =Parent.Width - 'LeaveRequest.Navigation'.Width
              Height: =Parent.Height - 'LeaveRequest.Header'.Height
            Children:
              - 'LeaveRequest.Content.Padded':
                  Control: GroupContainer
                  Variant: ManualLayout
                  Properties:
                    X: =Parent.Width * 0.01
                    Y: =Parent.Height * 0.01
                    Width: =Parent.Width * 0.98
                    Height: =Parent.Height * 0.98
                  Children:
                    # Page Header
                    - 'LeaveRequest.PageHeader.Container':
                        Control: GroupContainer
                        Variant: ManualLayout
                        Properties:
                          X: =0
                          Y: =0
                          Width: =Parent.Width
                          Height: =Parent.Height * 0.1
                        Children:
                          - 'LeaveRequest.PageHeader.Background':
                              Control: Rectangle
                              Properties:
                                X: =0
                                Y: =0
                                Width: =Parent.Width
                                Height: =Parent.Height
                                Fill: =RGBA(255, 255, 255, 1)
                                BorderColor: =RGBA(226, 232, 240, 1)
                                BorderThickness: =1
                                
                          - 'LeaveRequest.PageHeader.Icon':
                              Control: Classic/Icon
                              Properties:
                                X: =Parent.Width * 0.015
                                Y: =Parent.Height * 0.25
                                Width: =Parent.Height * 0.2
                                Height: =Parent.Height * 0.2
                                Icon: =Icon.CalendarBlank
                                Color: =RGBA(59, 130, 246, 1)
                                
                          - 'LeaveRequest.PageHeader.Title':
                              Control: Label
                              Properties:
                                X: =Parent.Width * 0.015 + 'LeaveRequest.PageHeader.Icon'.Width + Parent.Width * 0.01
                                Y: =Parent.Height * 0.2
                                Width: =Parent.Width * 0.6
                                Height: =Parent.Height * 0.35
                                Text: ="Tạo đơn nghỉ phép"
                                Color: =RGBA(17, 24, 39, 1)
                                Font: =Font.'Open Sans'
                                FontWeight: =FontWeight.Bold
                                Size: =FontSizes.Medium
                                
                          - 'LeaveRequest.PageHeader.Stats':
                              Control: Label
                              Properties:
                                X: =Parent.Width * 0.015 + 'LeaveRequest.PageHeader.Icon'.Width + Parent.Width * 0.01
                                Y: =Parent.Height * 0.6
                                Width: =Parent.Width * 0.6
                                Height: =Parent.Height * 0.25
                              Text: =If(Not(IsBlank(varUserLeaveBalance)), "Số ngày phép còn lại" & ":" & " " & varUserLeaveBalance.SoNgayConLai & " ngày", "Thông tin nghỉ phép sẽ được tải sau khi đăng nhập")
                                Color: =RGBA(75, 85, 99, 1)
                                Font: =Font.'Open Sans'
                                Size: =FontSizes.Small

                          - 'LeaveRequest.MyLeaves.Button':
                              Control: CanvasComponent
                              ComponentName: ButtonComponent
                              Properties:
                                X: =Parent.Width * 0.75
                                Y: =(Parent.Height - Self.Height) / 2
                                Width: =Parent.Width * 0.22
                                Height: =Parent.Height * 0.6
                                Text: ="Xem đơn của tôi"
                                Size: ="Medium"
                                OnClick: |
                                  =Navigate(MyLeavesScreen)

                  # Form Container with proper Form control
                    - 'LeaveRequest.Form.Container':
                      Control: Form
                      Layout: Vertical
                        Properties:
                          X: =0
                          Y: ='LeaveRequest.PageHeader.Container'.Y + 'LeaveRequest.PageHeader.Container'.Height + Parent.Height * 0.015
                          Width: =Parent.Width
                        Height: =Parent.Height * 0.78
                                BorderColor: =RGBA(226, 232, 240, 1)
                                BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        DataSource: =DonNghiPhep
                        DefaultMode: =FormMode.New
                        Item: =Blank()
                        OnSuccess: |
                          =Set(varShowSuccessModal, true);
                          Notify("Đã gửi đơn nghỉ phép thành công!", NotificationType.Success);
                          ResetForm(Self)
                        OnFailure: |
                          =Notify("Có lỗi xảy ra khi gửi đơn: " & Self.Error, NotificationType.Error)
                      Children:
                        # MaNguoiDung DataCard (Hidden - auto-filled with current user)
                        - MaNguoiDung_DataCard:
                            Control: TypedDataCard
                            Variant: TextualEdit
                            IsLocked: true
                              Properties:
                              BorderColor: =RGBA(32, 54, 71, 1)
                              DataField: ="MaNguoiDung"
                              Default: =If(varIsUserAuthenticated, UserSessionANP.Id, "EMP001")
                              DisplayName: ="Mã người dùng"
                              Required: =true
                              Update: =If(varIsUserAuthenticated, UserSessionANP.Id, "EMP001")
                              Width: =Parent.Width * 0.45
                              Height: =0
                              Visible: =false
                                X: =Parent.Width * 0.025
                              Y: =10
                            Children:
                              - DataCardValue_MaNguoiDung:
                                  Control: Classic/TextInput
                                  MetadataKey: FieldValue
                                  Properties:
                                    Default: =Parent.Default
                                    DisplayMode: =DisplayMode.View
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =30

                        # HoTen DataCard (Hidden - auto-filled with current user name)
                        - HoTen_DataCard:
                            Control: TypedDataCard
                            Variant: TextualEdit
                            IsLocked: true
                            Properties:
                              BorderColor: =RGBA(32, 54, 71, 1)
                              DataField: ="HoTen"
                              Default: =If(varIsUserAuthenticated, UserSessionANP.HoTen, "Nguyễn Văn An")
                              DisplayName: ="Họ và tên"
                              Required: =true
                              Update: =DataCardValue_HoTen.Text
                                Width: =Parent.Width * 0.45
                              Height: =0
                              Visible: =false
                              X: =Parent.Width * 0.525
                              Y: =10
                              Children:
                              - DataCardValue_HoTen:
                                  Control: Classic/TextInput
                                  MetadataKey: FieldValue
                                    Properties:
                                    Default: =Parent.Default
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =30

                        # ChucDanh DataCard (Hidden - auto-filled with current user position)
                        - ChucDanh_DataCard:
                            Control: TypedDataCard
                            Variant: TextualEdit
                            IsLocked: true
                                    Properties:
                              BorderColor: =RGBA(32, 54, 71, 1)
                              DataField: ="ChucDanh"
                              Default: =If(varIsUserAuthenticated, UserSessionANP.ChucDanh, "Nhân viên")
                              DisplayName: ="Chức danh"
                              Required: =true
                              Update: =DataCardValue_ChucDanh.Text
                              Width: =Parent.Width * 0.45
                              Height: =0
                              Visible: =false
                              X: =Parent.Width * 0.025
                              Y: =15
                            Children:
                              - DataCardValue_ChucDanh:
                                  Control: Classic/TextInput
                                  MetadataKey: FieldValue
                                  Properties:
                                    Default: =Parent.Default
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =30

                        # DonVi DataCard (Hidden - auto-filled with current user department)
                        - DonVi_DataCard:
                            Control: TypedDataCard
                            Variant: TextualEdit
                            IsLocked: true
                            Properties:
                              BorderColor: =RGBA(32, 54, 71, 1)
                              DataField: ="DonVi"
                              Default: =If(varIsUserAuthenticated, UserSessionANP.MaDonVi, "IT")
                              DisplayName: ="Đơn vị"
                              Required: =true
                              Update: =DataCardValue_DonVi.Text
                              Width: =Parent.Width * 0.45
                              Height: =0
                              Visible: =false
                              X: =Parent.Width * 0.525
                              Y: =15
                            Children:
                              - DataCardValue_DonVi:
                                  Control: Classic/TextInput
                                  MetadataKey: FieldValue
                                  Properties:
                                    Default: =Parent.Default
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =30

                        # NgayBatDau DataCard
                        - NgayBatDau_DataCard:
                            Control: TypedDataCard
                            Variant: DateEdit
                            IsLocked: true
                            Properties:
                              BorderColor: =RGBA(32, 54, 71, 1)
                              DataField: ="NgayBatDau"
                              Default: =Today()
                              DisplayName: ="Ngày bắt đầu"
                              Required: =true
                              Update: =DataCardValue_NgayBatDau.SelectedDate
                              Width: =Parent.Width * 0.45
                              Height: =120
                              X: =Parent.Width * 0.025
                              Y: =20
                            Children:
                              - DataCardKey_NgayBatDau:
                                    Control: Label
                                  MetadataKey: FieldName
                                    Properties:
                                    Height: =22
                                    Text: =Parent.DisplayName
                                    FontWeight: =FontWeight.Semibold
                                    Width: =Parent.Width - 48
                                    Wrap: =false
                                    X: =24
                                    Y: =10
                                      Color: =RGBA(17, 24, 39, 1)
                                      Font: =Font.'Open Sans'
                                    Size: =FontSizes.Base
                              - DataCardValue_NgayBatDau:
                                    Control: Classic/DatePicker
                                  MetadataKey: FieldValue
                                    Properties:
                                    DisplayMode: =Parent.DisplayMode
                                    DefaultDate: =Parent.Default
                                    Width: =Parent.Width - 48
                                    Height: =40
                                    X: =24
                                    Y: =40
                                      BorderColor: =RGBA(209, 213, 219, 1)
                                      BorderThickness: =1
                                      Fill: =RGBA(255, 255, 255, 1)
                                      Color: =RGBA(55, 65, 81, 1)
                                      Font: =Font.'Open Sans'
                                      Size: =FontSizes.Base
                                      OnChange: |
                                        =Set(varSelectedFromDate, Self.SelectedDate);
                                        If(Not(IsBlank(varSelectedToDate)),
                                          Set(varCalculatedDays, DateDiff(varSelectedFromDate, varSelectedToDate) + 1),
                                          Set(varCalculatedDays, 1)
                                        )
                              - ErrorMessage_NgayBatDau:
                                  Control: Label
                                  MetadataKey: ErrorMessage
                                  Properties:
                                    Height: =30
                                    Text: =Parent.Error
                                    Visible: =And(Not(IsBlank(Parent.Error)), Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =Parent.Width - 48
                                    X: =24
                                    Y: =85
                                    Color: =RGBA(239, 68, 68, 1)
                                    Font: =Font.'Open Sans'
                                    Size: =FontSizes.Small
                              - StarVisible_NgayBatDau:
                                  Control: Label
                                  MetadataKey: FieldRequired
                                  Properties:
                                    Align: =Align.Center
                                    Height: =30
                                    Text: ="*"
                                    Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                                    Width: =30
                                    Y: =10
                                    Color: =RGBA(239, 68, 68, 1)
                                    X: =Parent.Width - 30

                        # NgayKetThuc DataCard
                        - NgayKetThuc_DataCard:
                            Control: TypedDataCard
                            Variant: DateEdit
                            IsLocked: true
                            Properties:
                              BorderColor: =RGBA(32, 54, 71, 1)
                              DataField: ="NgayKetThuc"
                              Default: =Today()
                              DisplayName: ="Ngày kết thúc"
                              Required: =true
                              Update: =DataCardValue_NgayKetThuc.SelectedDate
                              Width: =Parent.Width * 0.45
                              Height: =120
                              X: =Parent.Width * 0.525
                              Y: =20
                            Children:
                              - DataCardKey_NgayKetThuc:
                                    Control: Label
                                  MetadataKey: FieldName
                                    Properties:
                                    Height: =22
                                    Text: =Parent.DisplayName
                                    FontWeight: =FontWeight.Semibold
                                    Width: =Parent.Width - 48
                                    Wrap: =false
                                    X: =24
                                    Y: =10
                                      Color: =RGBA(17, 24, 39, 1)
                                      Font: =Font.'Open Sans'
                                    Size: =FontSizes.Base
                              - DataCardValue_NgayKetThuc:
                                    Control: Classic/DatePicker
                                  MetadataKey: FieldValue
                                    Properties:
                                    DisplayMode: =Parent.DisplayMode
                                    DefaultDate: =Parent.Default
                                    Width: =Parent.Width - 48
                                    Height: =40
                                    X: =24
                                    Y: =40
