                  # Form Action Buttons  
                          - 'LeaveRequest.Actions.Container':
                              Control: GroupContainer
                              Variant: ManualLayout
                              Properties:
                        X: =0
                        Y: ='LeaveRequest.Form.Container'.Y + 'LeaveRequest.Form.Container'.Height + Parent.Height * 0.02
                        Width: =Parent.Width
                        Height: =Parent.Height * 0.1
                              Children:
                                - 'LeaveRequest.Submit.Button':
                            Control: Classic/Button
                                    Properties:
                              X: =Parent.Width * 0.025
                                      Y: =(Parent.Height - Self.Height) / 2
                              Width: =Parent.Width * 0.45
                              Height: =Parent.Height * 0.8
                                      Text: =If(varIsSubmitting, "Đang gửi...", "Gửi đơn")
                              Fill: =RGBA(34, 197, 94, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(34, 197, 94, 1)
                              BorderThickness: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Size: =FontSizes.Medium
                              DisplayMode: =If(
                                Or(
                                        varIsSubmitting,
                                  Not('LeaveRequest.Form.Container'.Unsaved),
                                  IsBlank(DataCardValue_NgayBatDau.SelectedDate),
                                  IsBlank(DataCardValue_NgayKetThuc.SelectedDate),
                                  IsBlank(DataCardValue_LyDo.Text),
                                  varCalculatedDays < 1
                                ),
                                DisplayMode.Disabled,
                                DisplayMode.Edit
                                )
                              OnSelect: |
                                        =Set(varIsSubmitting, true);
                                SubmitForm('LeaveRequest.Form.Container');
                                Set(varIsSubmitting, false)
                                              
                                - 'LeaveRequest.Reset.Button':
                            Control: Classic/Button
                                    Properties:
                              X: =Parent.Width * 0.525
                                      Y: =(Parent.Height - Self.Height) / 2
                              Width: =Parent.Width * 0.45
                              Height: =Parent.Height * 0.8
                                      Text: ="Làm mới"
                              Fill: =RGBA(107, 114, 128, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              BorderColor: =RGBA(107, 114, 128, 1)
                              BorderThickness: =1
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Size: =FontSizes.Medium
                              OnSelect: |
                                =ResetForm('LeaveRequest.Form.Container');
                                Set(varSelectedFromDate, Today());
                                Set(varSelectedToDate, Today());
                                Set(varCalculatedDays, 1);
                                Set(varValidationErrors, "")

